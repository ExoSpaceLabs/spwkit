name: Patch deterministic faults

on:
  push:
    branches: [agent/v0.2-deterministic-fault-injection]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-deterministic-fault-injection
      - name: Apply integration patch
        run: python3 .github/patch_faults.py
      - name: Build and test
        run: |
          cmake -S . -B build -DSPWKIT_BUILD_TESTS=ON -DSPWKIT_BUILD_EXAMPLES=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit implementation
        run: |
          rm .github/patch_faults.py .github/workflows/patch-faults.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Inczert@users.noreply.github.com"
          git add -A
          git commit -m "feat(spwkit): add deterministic fault injection #30"
          git push origin HEAD:agent/v0.2-deterministic-fault-injection
