name: Agent spwmon patch

on:
  push:
    branches: [agent/develop]
    paths:
      - ".github/workflows/agent-spwmon-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/develop
          fetch-depth: 0

      - name: Apply spwmon patch
        run: |
          python3 .github/agent_spwmon_patch.py
          python3 .github/agent_spwmon_fix.py

      - name: Configure pure-C tools profile
        env:
          CC: clang
          CXX: /bin/false
        run: |
          cmake -S . -B build-spwmon \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=ON \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-spwmon/CMakeCache.txt; then
            echo "spwmon profile unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build and test spwmon slice
        run: |
          cmake --build build-spwmon --parallel
          ctest --test-dir build-spwmon --output-on-failure --no-tests=error
          build-spwmon/spwctl --help
          build-spwmon/spwmon --help
          cmake --install build-spwmon --prefix "$PWD/install-spwmon"
          test -x "$PWD/install-spwmon/bin/vspwd"
          test -x "$PWD/install-spwmon/bin/spwctl"
          test -x "$PWD/install-spwmon/bin/spwmon"
          "$PWD/install-spwmon/bin/spwmon" --help

      - name: Publish validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Robert A Incze"
          git config user.email "98164670+Inczert@users.noreply.github.com"
          git add CMakeLists.txt \
                  src/backends/device/vspw_device_protocol.h \
                  src/backends/device/vspw_device_protocol.c \
                  src/vspwd/server.c \
                  src/tools/vspd_management_client.h \
                  src/tools/vspd_management_client.c \
                  src/tools/spwmon.c \
                  tests/vspw_device_protocol.c \
                  tests/device/CMakeLists.txt \
                  tests/device/run_spwmon.sh \
                  docs/vspw-device-protocol.md \
                  docs/spwmon.md
          git diff --cached --check
          git commit -m "feat(spwkit): add passive spwmon observer"
          git push origin HEAD:agent/develop
