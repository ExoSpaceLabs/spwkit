name: Patch session-bound ACK

on:
  push:
    branches: [agent/v0.2-udp-reliability]
    paths:
      - .github/workflows/patch-session-ack.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-udp-reliability

      - name: Bind ACKs to the sender transport session
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          cpp = Path('src/backends/ethernet/udp_backend.cpp')
          text = cpp.read_text()
          text = replace_one(
              text,
              '''spw_result_t UdpBackend::send_ack(std::uint32_t message_id) noexcept {
    if (message_id == 0u) {
        return SPW_ERR_INVALID_ARGUMENT;
    }

    Header header{};
    header.type = MessageType::Ack;
    header.link_id = config_.link_id;
    header.sequence = take_nonzero(next_sequence_);
    header.message_id = message_id;
    if (!encode_header(header, control_datagram_.data(), control_datagram_.size())) {
        return SPW_ERR_BACKEND;
    }
    return send_datagram(control_datagram_.data(), kHeaderSize, SPW_TIMEOUT_IMMEDIATE);
}''',
              '''spw_result_t UdpBackend::send_ack(std::uint32_t message_id) noexcept {
    if (message_id == 0u) {
        return SPW_ERR_INVALID_ARGUMENT;
    }
    if (remote_session_id_ == 0u) {
        return SPW_ERR_INVALID_STATE;
    }

    Header header{};
    header.type = MessageType::Ack;
    header.payload_size = static_cast<std::uint16_t>(kAckPayloadSize);
    header.link_id = config_.link_id;
    header.sequence = take_nonzero(next_sequence_);
    header.message_id = message_id;
    header.total_size = static_cast<std::uint32_t>(kAckPayloadSize);
    if (!encode_header(header, control_datagram_.data(), control_datagram_.size()) ||
        !encode_ack_payload(remote_session_id_,
                            control_datagram_.data() + kHeaderSize,
                            kAckPayloadSize)) {
        return SPW_ERR_BACKEND;
    }
    return send_datagram(control_datagram_.data(),
                         kHeaderSize + kAckPayloadSize,
                         SPW_TIMEOUT_IMMEDIATE);
}''',
              'send ACK')
          text = replace_one(
              text,
              '''spw_result_t UdpBackend::process_ack(const Header& header) noexcept {
    if (pending_tx_kind_ != PendingTxKind::None &&
        header.message_id == pending_tx_message_id_) {
        clear_pending_tx();
    }
    return SPW_OK;
}''',
              '''spw_result_t UdpBackend::process_ack(const Header& header,
                                     const std::uint8_t* payload) noexcept {
    std::uint64_t acknowledged_session_id = 0u;
    if (!decode_ack_payload(payload, header.payload_size, acknowledged_session_id)) {
        statistics_.dropped_packets++;
        return SPW_OK;
    }
    if (acknowledged_session_id != local_session_id_) {
        return SPW_OK;
    }
    if (pending_tx_kind_ != PendingTxKind::None &&
        header.message_id == pending_tx_message_id_) {
        clear_pending_tx();
    }
    return SPW_OK;
}''',
              'process ACK')
          text = replace_one(
              text,
              '''        case MessageType::Ack:
            return process_ack(header);''',
              '''        case MessageType::Ack:
            return process_ack(header, payload);''',
              'ACK dispatch')
          cpp.write_text(text)

          port = Path('src/core/port.cpp')
          text = port.read_text()
          text = replace_one(
              text,
              '''    if (udp->remote_port == 0u || udp->link_id == 0u ||
        udp->fragment_payload_size < 256u || udp->reserved != 0u ||
        udp->local_address[0] == '\\0' || udp->remote_address[0] == '\\0') {''',
              '''    if (udp->remote_port == 0u || udp->link_id == 0u ||
        udp->fragment_payload_size < 256u || udp->max_retries == 0u ||
        udp->ack_timeout_ms == 0u || udp->keepalive_interval_ms == 0u ||
        udp->peer_timeout_ms <= udp->keepalive_interval_ms || udp->reserved != 0u ||
        udp->local_address[0] == '\\0' || udp->remote_address[0] == '\\0') {''',
              'UDP public config validation')
          port.write_text(text)
          PY

          rm .github/workflows/patch-session-ack.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/backends/ethernet/udp_backend.cpp \
                  src/core/port.cpp \
                  .github/workflows/patch-session-ack.yml
          git commit -m "fix(spwkit): reject stale ACKs across UDP sessions #26"
          git push origin HEAD:agent/v0.2-udp-reliability
