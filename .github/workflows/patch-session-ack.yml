name: Patch session-bound ACK

on:
  push:
    branches: [agent/v0.2-udp-reliability]
    paths:
      - .github/workflows/patch-session-ack.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-udp-reliability

      - name: Bind ACKs to the sender transport session
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          cpp = Path('src/backends/ethernet/udp_backend.cpp')
          text = cpp.read_text()
          old = "spw_result_t UdpBackend::send_ack(std::uint32_t message_id) noexcept {\n    if (message_id == 0u) {\n        return SPW_ERR_INVALID_ARGUMENT;\n    }\n\n    Header header{};\n    header.type = MessageType::Ack;\n    header.link_id = config_.link_id;\n    header.sequence = take_nonzero(next_sequence_);\n    header.message_id = message_id;\n    if (!encode_header(header, control_datagram_.data(), control_datagram_.size())) {\n        return SPW_ERR_BACKEND;\n    }\n    return send_datagram(control_datagram_.data(), kHeaderSize, SPW_TIMEOUT_IMMEDIATE);\n}"
          new = "spw_result_t UdpBackend::send_ack(std::uint32_t message_id) noexcept {\n    if (message_id == 0u) {\n        return SPW_ERR_INVALID_ARGUMENT;\n    }\n    if (remote_session_id_ == 0u) {\n        return SPW_ERR_INVALID_STATE;\n    }\n\n    Header header{};\n    header.type = MessageType::Ack;\n    header.payload_size = static_cast<std::uint16_t>(kAckPayloadSize);\n    header.link_id = config_.link_id;\n    header.sequence = take_nonzero(next_sequence_);\n    header.message_id = message_id;\n    header.total_size = static_cast<std::uint32_t>(kAckPayloadSize);\n    if (!encode_header(header, control_datagram_.data(), control_datagram_.size()) ||\n        !encode_ack_payload(remote_session_id_,\n                            control_datagram_.data() + kHeaderSize,\n                            kAckPayloadSize)) {\n        return SPW_ERR_BACKEND;\n    }\n    return send_datagram(control_datagram_.data(),\n                         kHeaderSize + kAckPayloadSize,\n                         SPW_TIMEOUT_IMMEDIATE);\n}"
          text = replace_one(text, old, new, 'send ACK')

          old = "spw_result_t UdpBackend::process_ack(const Header& header) noexcept {\n    if (pending_tx_kind_ != PendingTxKind::None &&\n        header.message_id == pending_tx_message_id_) {\n        clear_pending_tx();\n    }\n    return SPW_OK;\n}"
          new = "spw_result_t UdpBackend::process_ack(const Header& header,\n                                     const std::uint8_t* payload) noexcept {\n    std::uint64_t acknowledged_session_id = 0u;\n    if (!decode_ack_payload(payload, header.payload_size, acknowledged_session_id)) {\n        statistics_.dropped_packets++;\n        return SPW_OK;\n    }\n    if (acknowledged_session_id != local_session_id_) {\n        return SPW_OK;\n    }\n    if (pending_tx_kind_ != PendingTxKind::None &&\n        header.message_id == pending_tx_message_id_) {\n        clear_pending_tx();\n    }\n    return SPW_OK;\n}"
          text = replace_one(text, old, new, 'process ACK')

          old = "        case MessageType::Ack:\n            return process_ack(header);"
          new = "        case MessageType::Ack:\n            return process_ack(header, payload);"
          text = replace_one(text, old, new, 'ACK dispatch')
          cpp.write_text(text)

          port = Path('src/core/port.cpp')
          text = port.read_text()
          old = "    if (udp->remote_port == 0u || udp->link_id == 0u ||\n        udp->fragment_payload_size < 256u || udp->reserved != 0u ||\n        udp->local_address[0] == '\\0' || udp->remote_address[0] == '\\0') {"
          new = "    if (udp->remote_port == 0u || udp->link_id == 0u ||\n        udp->fragment_payload_size < 256u || udp->max_retries == 0u ||\n        udp->ack_timeout_ms == 0u || udp->keepalive_interval_ms == 0u ||\n        udp->peer_timeout_ms <= udp->keepalive_interval_ms || udp->reserved != 0u ||\n        udp->local_address[0] == '\\0' || udp->remote_address[0] == '\\0') {"
          text = replace_one(text, old, new, 'UDP public config validation')
          port.write_text(text)
          PY

          rm .github/workflows/patch-session-ack.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/backends/ethernet/udp_backend.cpp \
                  src/core/port.cpp \
                  .github/workflows/patch-session-ack.yml
          git commit -m "fix(spwkit): reject stale ACKs across UDP sessions #26"
          git push origin HEAD:agent/v0.2-udp-reliability
