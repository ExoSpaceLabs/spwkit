name: Release performance comparison

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/release-performance.yml'
  push:
    branches:
      - 'perf-campaign/**'
    paths:
      - '.github/workflows/release-performance.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline Git ref
        required: true
        default: v0.6.1
        type: string
      candidate_ref:
        description: Candidate Git ref
        required: true
        default: develop
        type: string
      warmup:
        description: Warmup iterations
        required: true
        default: '256'
        type: string
      iterations:
        description: Measured iterations
        required: true
        default: '1024'
        type: string
      payloads:
        description: Space-separated payload sizes
        required: true
        default: '0 1 8 64 256 1024 4096'
        type: string
      campaign_mode:
        description: Release performance mode
        required: true
        default: screen
        type: choice
        options:
          - screen
          - controlled

permissions:
  contents: read

jobs:
  tooling:
    name: Release comparator tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate comparator
        run: python3 benchmarks/test_compare_release_profiles.py

      - name: Validate repeat aggregation
        run: python3 benchmarks/test_aggregate_release_profile_repeats.py

      - name: Validate runner shell
        run: bash -n benchmarks/run_release_profile_comparison.sh

  hosted-screen:
    name: v0.6.1 to candidate hosted screen ${{ matrix.replica }}/3
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.campaign_mode == 'screen')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - name: Checkout with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve screening parameters
        id: params
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASELINE: ${{ github.event.inputs.baseline_ref }}
          DISPATCH_CANDIDATE: ${{ github.event.inputs.candidate_ref }}
          DISPATCH_WARMUP: ${{ github.event.inputs.warmup }}
          DISPATCH_ITERATIONS: ${{ github.event.inputs.iterations }}
          DISPATCH_PAYLOADS: ${{ github.event.inputs.payloads }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            baseline="${DISPATCH_BASELINE}"
            candidate="${DISPATCH_CANDIDATE}"
            warmup="${DISPATCH_WARMUP}"
            iterations="${DISPATCH_ITERATIONS}"
            payloads="${DISPATCH_PAYLOADS}"
          else
            baseline="v0.6.1"
            candidate="HEAD"
            warmup="32"
            iterations="128"
            payloads="0 64 1024 4096"
          fi
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'warmup=%s\n' "$warmup" >> "$GITHUB_OUTPUT"
          printf 'iterations=%s\n' "$iterations" >> "$GITHUB_OUTPUT"
          printf 'payloads=%s\n' "$payloads" >> "$GITHUB_OUTPUT"

      - name: Run paired release screen
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 8192
          output="release-performance-screen-${{ matrix.replica }}"
          rm -rf "$output"
          bash benchmarks/run_release_profile_comparison.sh \
            --baseline-ref "${{ steps.params.outputs.baseline }}" \
            --candidate-ref "${{ steps.params.outputs.candidate }}" \
            --warmup "${{ steps.params.outputs.warmup }}" \
            --iterations "${{ steps.params.outputs.iterations }}" \
            --payloads "${{ steps.params.outputs.payloads }}" \
            --cpu auto \
            --precondition-seconds 0 \
            --governor keep \
            --type github-hosted-release-screen \
            --relative-threshold 5 \
            --absolute-threshold 20 \
            --output-root "$output"

      - name: Publish individual comparison summary
        shell: bash
        run: |
          set -euo pipefail
          comparison="$(find "release-performance-screen-${{ matrix.replica }}" -name comparison.md -print -quit)"
          [[ -f "$comparison" ]] || {
            echo "release comparison summary not found" >&2
            exit 1
          }
          cat "$comparison" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '> This is one of three GitHub-hosted screening repetitions, not release-acceptance evidence.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release screen
        uses: actions/upload-artifact@v4
        with:
          name: spwkit-release-performance-${{ github.run_id }}-${{ matrix.replica }}
          path: release-performance-screen-${{ matrix.replica }}/
          if-no-files-found: error
          retention-days: 30

  hosted-screen-summary:
    name: Repeated hosted screen summary
    needs: [tooling, hosted-screen]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.campaign_mode == 'screen')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download repeated screens
        uses: actions/download-artifact@v4
        with:
          pattern: spwkit-release-performance-${{ github.run_id }}-*
          path: release-performance-repeats
          merge-multiple: false

      - name: Aggregate repeated screening signals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-performance-summary
          python3 benchmarks/aggregate_release_profile_repeats.py \
            release-performance-repeats \
            --expected-runs 3 \
            --min-attention-runs 2 \
            --output-json release-performance-summary/repeat-summary.json \
            --output-markdown release-performance-summary/repeat-summary.md
          cat release-performance-summary/repeat-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '> Recurring hosted signals identify targets for controlled-host investigation. They do not by themselves fail the release gate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repeated screen summary
        uses: actions/upload-artifact@v4
        with:
          name: spwkit-release-performance-summary-${{ github.run_id }}
          path: release-performance-summary/
          if-no-files-found: error
          retention-days: 30

  controlled-campaign:
    name: Controlled same-runner release campaign
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.campaign_mode == 'controlled')
    needs: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve campaign parameters
        id: params
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASELINE: ${{ github.event.inputs.baseline_ref }}
          DISPATCH_CANDIDATE: ${{ github.event.inputs.candidate_ref }}
          DISPATCH_WARMUP: ${{ github.event.inputs.warmup }}
          DISPATCH_ITERATIONS: ${{ github.event.inputs.iterations }}
          DISPATCH_PAYLOADS: ${{ github.event.inputs.payloads }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            baseline="${DISPATCH_BASELINE}"
            candidate="${DISPATCH_CANDIDATE}"
            warmup="${DISPATCH_WARMUP}"
            iterations="${DISPATCH_ITERATIONS}"
            payloads="${DISPATCH_PAYLOADS}"
          else
            baseline="v0.6.1"
            candidate="develop"
            warmup="256"
            iterations="1024"
            payloads="0 1 8 64 256 1024 4096"
          fi
          campaign_cpu="$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )"
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'warmup=%s\n' "$warmup" >> "$GITHUB_OUTPUT"
          printf 'iterations=%s\n' "$iterations" >> "$GITHUB_OUTPUT"
          printf 'payloads=%s\n' "$payloads" >> "$GITHUB_OUTPUT"
          printf 'cpu=%s\n' "$campaign_cpu" >> "$GITHUB_OUTPUT"
          {
            echo '# Controlled same-runner release campaign'
            echo
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- OS: \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
            echo "- CPU: \`${campaign_cpu}\` for every baseline/candidate pair"
            echo "- Baseline: \`${baseline}\`"
            echo "- Candidate: \`${candidate}\`"
            echo "- Warmup: \`${warmup}\`"
            echo "- Iterations: \`${iterations}\`"
            echo "- Payloads: \`${payloads}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run three paired comparisons sequentially
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 8192
          rm -rf release-performance-controlled
          mkdir -p release-performance-controlled
          for replica in 1 2 3; do
            echo "::group::controlled pair ${replica}/3"
            bash benchmarks/run_release_profile_comparison.sh \
              --baseline-ref "${{ steps.params.outputs.baseline }}" \
              --candidate-ref "${{ steps.params.outputs.candidate }}" \
              --warmup "${{ steps.params.outputs.warmup }}" \
              --iterations "${{ steps.params.outputs.iterations }}" \
              --payloads "${{ steps.params.outputs.payloads }}" \
              --cpu "${{ steps.params.outputs.cpu }}" \
              --precondition-seconds 2 \
              --governor keep \
              --type controlled-same-runner-release-campaign \
              --relative-threshold 5 \
              --absolute-threshold 20 \
              --output-root "release-performance-controlled/run-${replica}"
            echo "::endgroup::"
          done

      - name: Aggregate controlled campaign
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/aggregate_release_profile_repeats.py \
            release-performance-controlled \
            --expected-runs 3 \
            --min-attention-runs 2 \
            --output-json release-performance-controlled/repeat-summary.json \
            --output-markdown release-performance-controlled/repeat-summary.md
          cat release-performance-controlled/repeat-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '> All three paired comparisons above ran sequentially in this single job on the same runner and pinned CPU. The environment metadata in each raw campaign remains authoritative for comparability review.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload controlled campaign
        uses: actions/upload-artifact@v4
        with:
          name: spwkit-controlled-release-campaign-${{ github.run_id }}
          path: release-performance-controlled/
          if-no-files-found: error
          retention-days: 90
