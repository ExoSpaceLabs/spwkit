name: Patch v0.2 reliability

on:
  push:
    branches: [agent/v0.2-udp-reliability]
    paths:
      - .github/workflows/patch-v0.2-reliability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-udp-reliability

      - name: Apply reliability hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hpp = Path('src/backends/ethernet/udp_backend.hpp')
          text = hpp.read_text()
          old = '''    std::uint32_t pending_tx_message_id_{0u};
              std::uint16_t pending_tx_retries_{0u};
              TimePoint pending_tx_last_send_{};'''.replace('              ', '    ')
          new = '''    std::uint32_t pending_tx_message_id_{0u};
              std::uint16_t pending_tx_retries_{0u};
              bool pending_tx_failed_{false};
              TimePoint pending_tx_last_send_{};'''.replace('              ', '    ')
          assert old in text
          hpp.write_text(text.replace(old, new, 1))

          cpp = Path('src/backends/ethernet/udp_backend.cpp')
          text = cpp.read_text()

          old = '''    pending_tx_message_id_ = 0u;
              pending_tx_retries_ = 0u;
              pending_tx_last_send_ = {};'''.replace('              ', '    ')
          new = '''    pending_tx_message_id_ = 0u;
              pending_tx_retries_ = 0u;
              pending_tx_failed_ = false;
              pending_tx_last_send_ = {};'''.replace('              ', '    ')
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if (pending_tx_kind_ != PendingTxKind::None) {
                  pending_tx_retries_ = 0u;
                  pending_tx_last_send_ = {};
              }'''.replace('          ', '    ')
          new = '''        if (pending_tx_kind_ != PendingTxKind::None) {
                  pending_tx_retries_ = 0u;
                  pending_tx_failed_ = false;
                  pending_tx_last_send_ = {};
              }'''.replace('          ', '    ')
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if (pending_tx_retries_ >= config_.max_retries) {
              mark_peer_lost();
              statistics_.dropped_packets++;
              return SPW_ERR_LINK_UNAVAILABLE;
          }'''.replace('          ', '    ')
          new = '''    if (pending_tx_retries_ >= config_.max_retries) {
              if (!pending_tx_failed_) {
                  pending_tx_failed_ = true;
                  statistics_.dropped_packets++;
              }
              mark_peer_lost();
              return SPW_ERR_LINK_UNAVAILABLE;
          }'''.replace('          ', '    ')
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    const spw_timeout_us_t keepalive_slice =
              static_cast<spw_timeout_us_t>(config_.keepalive_interval_ms) * 1000u;
          const spw_timeout_us_t wait_timeout = min_timeout(timeout_us, keepalive_slice);'''.replace('          ', '    ')
          new = '''    const spw_timeout_us_t keepalive_slice =
              static_cast<spw_timeout_us_t>(config_.keepalive_interval_ms) * 1000u;
          spw_timeout_us_t service_slice = keepalive_slice;
          if (pending_tx_kind_ != PendingTxKind::None) {
              const spw_timeout_us_t ack_slice =
                  static_cast<spw_timeout_us_t>(config_.ack_timeout_ms) * 1000u;
              service_slice = min_timeout(service_slice, ack_slice);
          }
          const spw_timeout_us_t wait_timeout = min_timeout(timeout_us, service_slice);'''.replace('          ', '    ')
          assert old in text
          text = text.replace(old, new, 1)
          cpp.write_text(text)

          test = Path('tests/udp_backend.cpp')
          text = test.read_text()
          old = '''    /* Peer loss becomes visible through the public link state. */
              assert(spw_port_close(b) == SPW_OK);
              b = nullptr;
              ::usleep(150000u);
              assert(spw_port_get_link_state(a, &a_state) == SPW_OK);
              assert(a_state == SPW_LINK_ERROR_WAIT);'''.replace('              ', '    ')
          new = '''    /*
               * Peer loss becomes visible through the public link state. A few
               * valid control datagrams may already be queued when B closes, so
               * allow each poll to drain one stale datagram and wait another full
               * peer-timeout interval before requiring ERROR_WAIT.
               */
              assert(spw_port_close(b) == SPW_OK);
              b = nullptr;
              for (unsigned attempt = 0u;
                   attempt < 4u && a_state != SPW_LINK_ERROR_WAIT;
                   ++attempt) {
                  ::usleep(160000u);
                  assert(spw_port_get_link_state(a, &a_state) == SPW_OK);
              }
              assert(a_state == SPW_LINK_ERROR_WAIT);'''.replace('              ', '    ')
          assert old in text
          test.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/patch-v0.2-reliability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/backends/ethernet/udp_backend.hpp \
                  src/backends/ethernet/udp_backend.cpp \
                  tests/udp_backend.cpp \
                  .github/workflows/patch-v0.2-reliability.yml
          git commit -m "fix(spwkit): harden UDP reliability servicing #26"
          git push origin HEAD:agent/v0.2-udp-reliability
