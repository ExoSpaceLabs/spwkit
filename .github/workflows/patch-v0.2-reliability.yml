name: Patch v0.2 reliability

on:
  push:
    branches: [agent/v0.2-udp-reliability]
    paths:
      - .github/workflows/patch-v0.2-reliability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-udp-reliability

      - name: Apply reliability hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          hpp = Path('src/backends/ethernet/udp_backend.hpp')
          text = hpp.read_text()
          text = replace_one(
              text,
              "    std::uint16_t pending_tx_retries_{0u};\n    TimePoint pending_tx_last_send_{};",
              "    std::uint16_t pending_tx_retries_{0u};\n    bool pending_tx_failed_{false};\n    TimePoint pending_tx_last_send_{};",
              'pending tx failure state')
          hpp.write_text(text)

          cpp = Path('src/backends/ethernet/udp_backend.cpp')
          text = cpp.read_text()
          text = replace_one(
              text,
              "    pending_tx_retries_ = 0u;\n    pending_tx_last_send_ = {};\n}\n\nvoid UdpBackend::clear_recent_messages",
              "    pending_tx_retries_ = 0u;\n    pending_tx_failed_ = false;\n    pending_tx_last_send_ = {};\n}\n\nvoid UdpBackend::clear_recent_messages",
              'clear pending tx')
          text = replace_one(
              text,
              "        if (pending_tx_kind_ != PendingTxKind::None) {\n            pending_tx_retries_ = 0u;\n            pending_tx_last_send_ = {};\n        }",
              "        if (pending_tx_kind_ != PendingTxKind::None) {\n            pending_tx_retries_ = 0u;\n            pending_tx_failed_ = false;\n            pending_tx_last_send_ = {};\n        }",
              'remote session retry reset')
          text = replace_one(
              text,
              "    if (pending_tx_retries_ >= config_.max_retries) {\n        mark_peer_lost();\n        statistics_.dropped_packets++;\n        return SPW_ERR_LINK_UNAVAILABLE;\n    }",
              "    if (pending_tx_retries_ >= config_.max_retries) {\n        if (!pending_tx_failed_) {\n            pending_tx_failed_ = true;\n            statistics_.dropped_packets++;\n        }\n        mark_peer_lost();\n        return SPW_ERR_LINK_UNAVAILABLE;\n    }",
              'retry exhaustion accounting')
          text = replace_one(
              text,
              "    const spw_timeout_us_t keepalive_slice =\n        static_cast<spw_timeout_us_t>(config_.keepalive_interval_ms) * 1000u;\n    const spw_timeout_us_t wait_timeout = min_timeout(timeout_us, keepalive_slice);",
              "    const spw_timeout_us_t keepalive_slice =\n        static_cast<spw_timeout_us_t>(config_.keepalive_interval_ms) * 1000u;\n    spw_timeout_us_t service_slice = keepalive_slice;\n    if (pending_tx_kind_ != PendingTxKind::None) {\n        const spw_timeout_us_t ack_slice =\n            static_cast<spw_timeout_us_t>(config_.ack_timeout_ms) * 1000u;\n        service_slice = min_timeout(service_slice, ack_slice);\n    }\n    const spw_timeout_us_t wait_timeout = min_timeout(timeout_us, service_slice);",
              'ack timeout service slice')
          cpp.write_text(text)

          test = Path('tests/udp_backend.cpp')
          text = test.read_text()
          text = replace_one(
              text,
              "    /* Peer loss becomes visible through the public link state. */\n    assert(spw_port_close(b) == SPW_OK);\n    b = nullptr;\n    ::usleep(150000u);\n    assert(spw_port_get_link_state(a, &a_state) == SPW_OK);\n    assert(a_state == SPW_LINK_ERROR_WAIT);",
              "    /*\n     * Peer loss becomes visible through the public link state. Valid control\n     * datagrams may already be queued when B closes, so each poll may drain\n     * one stale datagram before a full quiet peer-timeout is observed.\n     */\n    assert(spw_port_close(b) == SPW_OK);\n    b = nullptr;\n    for (unsigned attempt = 0u;\n         attempt < 4u && a_state != SPW_LINK_ERROR_WAIT;\n         ++attempt) {\n        ::usleep(160000u);\n        assert(spw_port_get_link_state(a, &a_state) == SPW_OK);\n    }\n    assert(a_state == SPW_LINK_ERROR_WAIT);",
              'peer loss timing')
          test.write_text(text)
          PY

          rm .github/workflows/patch-v0.2-reliability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/backends/ethernet/udp_backend.hpp \
                  src/backends/ethernet/udp_backend.cpp \
                  tests/udp_backend.cpp \
                  .github/workflows/patch-v0.2-reliability.yml
          git commit -m "fix(spwkit): harden UDP reliability servicing #26"
          git push origin HEAD:agent/v0.2-udp-reliability
