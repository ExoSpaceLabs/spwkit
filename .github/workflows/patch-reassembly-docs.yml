name: Patch reassembly docs

on:
  push:
    branches:
      - agent/v0.2-out-of-order-reassembly
    paths:
      - .github/workflows/patch-reassembly-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-out-of-order-reassembly
      - name: Refresh reassembly documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/vspw-tp.md')
          text = path.read_text()
          old = '''The current UDP reassembler accepts one logical fragmented packet at a time and requires contiguous fragment offsets. Reordered/missing fragments therefore prevent acknowledgement; the sender later retransmits the complete logical message. Reordering is a transport recovery event, not an application-visible EEP.'''
          new = '''The UDP backend keeps one active fragmented logical packet at a time, but its fragments may arrive in arbitrary UDP order. A fixed one-bit-per-payload-byte coverage map records the received portions of the existing 1 MiB reassembly buffer. Exact duplicate fragments and byte-identical partial overlaps are idempotent; conflicting overlaps or inconsistent message metadata are dropped. A packet becomes application-visible only after every payload byte is covered and both `FRAGMENT_START` and `FRAGMENT_END` have been observed.\n\nIncomplete reassembly is cleared on peer/session loss or transition and expires after `peer_timeout_ms` without DATA-fragment activity. KEEPALIVEs keep the peer session alive but do not indefinitely preserve a stalled partial packet. Transport reordering or loss never synthesizes an application-visible EEP.'''
          if old not in text:
              raise SystemExit('VSPW reassembly paragraph not found')
          text = text.replace(old, new, 1)
          old = '''The UDP backend deliberately advertises a smaller 1 MiB maximum packet size so TX retention and reassembly storage remain bounded and deterministic. Its default fragment payload is 1200 bytes to avoid relying on IP fragmentation.'''
          new = '''The UDP backend deliberately advertises a smaller 1 MiB maximum packet size so TX retention and reassembly storage remain bounded and deterministic. Reassembly uses the 1 MiB payload buffer plus a fixed 128 KiB coverage bitmap (one bit per possible payload byte), avoiding an arbitrary fragment-range-count limit. Its default fragment payload is 1200 bytes to avoid relying on IP fragmentation.'''
          if old not in text:
              raise SystemExit('VSPW bounds paragraph not found')
          text = text.replace(old, new, 1)
          old = '''- 5 KiB EEP transfer using 512-byte fragments;\n- insufficient-capacity retry without packet consumption;'''
          new = '''- 5 KiB EEP transfer using 512-byte fragments;\n- deliberately reordered and duplicated UDP fragments reassembling into one packet;\n- stale incomplete reassembly expiring without losing the current peer session;\n- insufficient-capacity retry without packet consumption;'''
          if old not in text:
              raise SystemExit('VSPW verification list not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
              '- bounded fragmentation/reassembly;',
              '- bounded fragmentation plus arbitrary-order reassembly with exact duplicate/overlap handling;',
              1)
          text = text.replace(
              'Arbitrary fragment reordering support, configurable latency/rate, deterministic fault injection, stronger multi-process/container examples and capture/Wireshark tooling remain v0.2 work.',
              'Configurable latency/rate, deterministic fault injection, stronger multi-process/container examples, broader distributed contract coverage and capture/Wireshark tooling remain v0.2 work.',
              1)
          path.write_text(text)

          path = Path('docs/roadmap.md')
          text = path.read_text()
          text = text.replace(
              '- packet fragmentation/reassembly independent of Ethernet MTU;',
              '- packet fragmentation/reassembly independent of Ethernet MTU;\n- bounded arbitrary-order fragment reassembly with duplicate/overlap validation;',
              1)
          text = text.replace(
              '- improve fragmented reassembly policy for arbitrary transport reordering rather than relying on retry of a contiguous retransmission;\n',
              '',
              1)
          path.write_text(text)
          PY

          rm .github/workflows/patch-reassembly-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/vspw-tp.md docs/roadmap.md .github/workflows/patch-reassembly-docs.yml
          git commit -m "docs(spwkit): document bounded out-of-order reassembly #28"
          git push origin HEAD:agent/v0.2-out-of-order-reassembly
