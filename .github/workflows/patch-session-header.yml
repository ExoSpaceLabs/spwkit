name: Patch VSPW-TP session header

on:
  push:
    branches: [agent/v0.2-udp-reliability]
    paths:
      - .github/workflows/patch-session-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-udp-reliability

      - name: Integrate session-aware UDP transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_n(text, old, new, count, label):
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{label}: expected {count} matches, found {actual}")
              return text.replace(old, new)

          cpp = Path('src/backends/ethernet/udp_backend.cpp')
          text = cpp.read_text()

          old = "void UdpBackend::clear_recent_messages() noexcept {\n    recent_message_head_ = 0u;\n    recent_message_count_ = 0u;\n}"
          new = "void UdpBackend::clear_recent_messages() noexcept {\n    recent_message_head_ = 0u;\n    recent_message_count_ = 0u;\n}\n\nvoid UdpBackend::clear_retired_sessions() noexcept {\n    retired_session_head_ = 0u;\n    retired_session_count_ = 0u;\n}"
          text = replace_one(text, old, new, 'retired session reset')

          old = "    clear_reassembly();\n    clear_pending_tx();\n    clear_recent_messages();\n    pending_packet_valid_ = false;"
          new = "    clear_reassembly();\n    clear_pending_tx();\n    clear_recent_messages();\n    clear_retired_sessions();\n    pending_packet_valid_ = false;"
          text = replace_n(text, old, new, 3, 'lifecycle retired-session clearing')

          marker = "bool UdpBackend::recently_delivered(MessageType type,\n                                    std::uint32_t message_id) const noexcept {"
          addition = "bool UdpBackend::is_retired_session(std::uint64_t session_id) const noexcept {\n    if (session_id == 0u) {\n        return false;\n    }\n    for (std::size_t i = 0u; i < retired_session_count_; ++i) {\n        const std::size_t index = (retired_session_head_ + i) % retired_session_depth;\n        if (retired_sessions_[index] == session_id) {\n            return true;\n        }\n    }\n    return false;\n}\n\nvoid UdpBackend::remember_retired_session(std::uint64_t session_id) noexcept {\n    if (session_id == 0u || is_retired_session(session_id)) {\n        return;\n    }\n    if (retired_session_count_ < retired_session_depth) {\n        const std::size_t index =\n            (retired_session_head_ + retired_session_count_) % retired_session_depth;\n        retired_sessions_[index] = session_id;\n        retired_session_count_++;\n        return;\n    }\n    retired_sessions_[retired_session_head_] = session_id;\n    retired_session_head_ = (retired_session_head_ + 1u) % retired_session_depth;\n}\n\n" + marker
          text = replace_one(text, marker, addition, 'retired session helpers')

          old = "void UdpBackend::reset_remote_session(std::uint64_t session_id) noexcept {\n    if (remote_session_id_ == 0u) {\n        remote_session_id_ = session_id;\n        note_peer_activity();\n        return;\n    }\n    if (remote_session_id_ != session_id) {\n        remote_session_id_ = session_id;\n        clear_reassembly();\n        clear_recent_messages();\n        if (pending_tx_kind_ != PendingTxKind::None) {\n            pending_tx_retries_ = 0u;\n            pending_tx_failed_ = false;\n            pending_tx_last_send_ = {};\n        }\n    }\n    note_peer_activity();\n}"
          new = "bool UdpBackend::reset_remote_session(std::uint64_t session_id) noexcept {\n    if (session_id == 0u || is_retired_session(session_id)) {\n        return false;\n    }\n    if (remote_session_id_ == session_id) {\n        note_peer_activity();\n        return true;\n    }\n    if (remote_session_id_ != 0u) {\n        remember_retired_session(remote_session_id_);\n    }\n    remote_session_id_ = session_id;\n    clear_reassembly();\n    clear_recent_messages();\n    if (pending_tx_kind_ != PendingTxKind::None) {\n        pending_tx_retries_ = 0u;\n        pending_tx_failed_ = false;\n        pending_tx_last_send_ = {};\n    }\n    note_peer_activity();\n    return true;\n}"
          text = replace_one(text, old, new, 'remote session transition')

          old = "    header.type = MessageType::Ack;\n    header.payload_size = static_cast<std::uint16_t>(kAckPayloadSize);\n    header.link_id = config_.link_id;"
          new = "    header.type = MessageType::Ack;\n    header.payload_size = static_cast<std::uint16_t>(kAckPayloadSize);\n    header.link_id = config_.link_id;\n    header.session_id = local_session_id_;"
          text = replace_one(text, old, new, 'ACK sender session')

          old = "spw_result_t UdpBackend::send_keepalive(spw_timeout_us_t timeout_us) noexcept {\n    Header header{};\n    header.type = MessageType::Keepalive;\n    header.payload_size = static_cast<std::uint16_t>(kKeepalivePayloadSize);\n    header.link_id = config_.link_id;\n    header.sequence = take_nonzero(next_sequence_);\n    header.total_size = static_cast<std::uint32_t>(kKeepalivePayloadSize);\n    if (!encode_header(header, control_datagram_.data(), control_datagram_.size()) ||\n        !encode_keepalive_payload(local_session_id_,\n                                  control_datagram_.data() + kHeaderSize,\n                                  kKeepalivePayloadSize)) {\n        return SPW_ERR_BACKEND;\n    }\n\n    const spw_result_t result = send_datagram(control_datagram_.data(),\n                                               kHeaderSize + kKeepalivePayloadSize,\n                                               timeout_us);"
          new = "spw_result_t UdpBackend::send_keepalive(spw_timeout_us_t timeout_us) noexcept {\n    Header header{};\n    header.type = MessageType::Keepalive;\n    header.link_id = config_.link_id;\n    header.session_id = local_session_id_;\n    header.sequence = take_nonzero(next_sequence_);\n    if (!encode_header(header, control_datagram_.data(), control_datagram_.size())) {\n        return SPW_ERR_BACKEND;\n    }\n\n    const spw_result_t result = send_datagram(control_datagram_.data(),\n                                               kHeaderSize,\n                                               timeout_us);"
          text = replace_one(text, old, new, 'header-only keepalive')

          old = "        header.payload_size = static_cast<std::uint16_t>(kTimeCodePayloadSize);\n        header.link_id = config_.link_id;\n        header.sequence = take_nonzero(next_sequence_);"
          new = "        header.payload_size = static_cast<std::uint16_t>(kTimeCodePayloadSize);\n        header.link_id = config_.link_id;\n        header.session_id = local_session_id_;\n        header.sequence = take_nonzero(next_sequence_);"
          text = replace_one(text, old, new, 'time-code sender session')

          old = "        header.payload_size = static_cast<std::uint16_t>(payload_size);\n        header.link_id = config_.link_id;\n        header.sequence = take_nonzero(next_sequence_);"
          new = "        header.payload_size = static_cast<std::uint16_t>(payload_size);\n        header.link_id = config_.link_id;\n        header.session_id = local_session_id_;\n        header.sequence = take_nonzero(next_sequence_);"
          text = replace_one(text, old, new, 'DATA sender session')

          old = "spw_result_t UdpBackend::process_keepalive(const Header& header,\n                                           const std::uint8_t* payload) noexcept {\n    std::uint64_t session_id = 0u;\n    if (!decode_keepalive_payload(payload, header.payload_size, session_id)) {\n        statistics_.dropped_packets++;\n        return SPW_OK;\n    }\n    reset_remote_session(session_id);\n    return SPW_OK;\n}"
          new = "spw_result_t UdpBackend::process_keepalive(const Header& header) noexcept {\n    (void)reset_remote_session(header.session_id);\n    return SPW_OK;\n}"
          text = replace_one(text, old, new, 'keepalive session processing')

          old = "    note_peer_activity();\n    const auto* payload = rx_datagram_.data() + kHeaderSize;\n    switch (header.type) {\n        case MessageType::Data:"
          new = "    const auto* payload = rx_datagram_.data() + kHeaderSize;\n    if (header.type == MessageType::Keepalive) {\n        return process_keepalive(header);\n    }\n    if (remote_session_id_ == 0u || header.session_id != remote_session_id_) {\n        return SPW_OK;\n    }\n    note_peer_activity();\n    switch (header.type) {\n        case MessageType::Data:"
          text = replace_one(text, old, new, 'session gate before dispatch')

          old = "        case MessageType::Keepalive:\n            return process_keepalive(header, payload);\n        case MessageType::Ack:"
          new = "        case MessageType::Keepalive:\n            return SPW_OK;\n        case MessageType::Ack:"
          text = replace_one(text, old, new, 'keepalive dispatch')

          cpp.write_text(text)
          PY

          rm .github/workflows/patch-session-header.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/backends/ethernet/udp_backend.cpp \
                  .github/workflows/patch-session-header.yml
          git commit -m "fix(spwkit): reject stale frames across UDP sessions #26"
          git push origin HEAD:agent/v0.2-udp-reliability
