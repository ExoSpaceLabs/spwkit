name: Patch contract timeout profile

on:
  push:
    branches: [agent/v0.2-udp-contract]
    paths:
      - .github/patch_contract32.py
      - .github/workflows/patch-contract32.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-udp-contract
      - name: Apply shared contract timeout profile
        run: python3 .github/patch_contract32.py
      - name: Build and run backend contract/D2D tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSPWKIT_BUILD_TESTS=ON -DSPWKIT_BUILD_EXAMPLES=OFF -DSPWKIT_BUILD_SIMULATOR=ON -DSPWKIT_BUILD_UDP=ON -DSPWKIT_ENABLE_HEAP=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure -R '^backend_contract_(loopback|simulator|udp)$'
          ctest --test-dir build --output-on-failure -L d2d
      - name: Commit validated patch
        run: |
          rm .github/patch_contract32.py .github/workflows/patch-contract32.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Inczert@users.noreply.github.com"
          git add -A
          git commit -m "test(spwkit): add per-fixture transfer timeout #32"
          git push origin HEAD:agent/v0.2-udp-contract
