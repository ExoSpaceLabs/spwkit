name: Zero-copy profiling bootstrap

on:
  push:
    branches: [work/zero-copy-profiling]
    paths:
      - scripts/apply_zero_copy_profiling.py
      - .github/workflows/zero-copy-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: work/zero-copy-profiling
          fetch-depth: 0

      - name: Apply instrumentation patch
        run: python3 scripts/apply_zero_copy_profiling.py

      - name: Validate representative zero-copy probe pairs
        shell: bash
        run: |
          set -euo pipefail
          pairs=(
            "SPW_PROFILE_ID_TX_ZC_ACQUIRE_API_ENTRY:SPW_PROFILE_ID_TX_ZC_ACQUIRE_API_RETURN"
            "SPW_PROFILE_ID_TX_ZC_SUBMIT_API_ENTRY:SPW_PROFILE_ID_TX_ZC_SUBMIT_API_RETURN"
            "SPW_PROFILE_ID_TX_ZC_RECLAIM_API_ENTRY:SPW_PROFILE_ID_TX_ZC_RECLAIM_API_RETURN"
            "SPW_PROFILE_ID_TX_ZC_RELEASE_API_ENTRY:SPW_PROFILE_ID_TX_ZC_RELEASE_API_RETURN"
          )
          index=0
          for pair in "${pairs[@]}"; do
            IFS=: read -r start end <<<"$pair"
            build="build-bootstrap-${index}"
            cmake -S . -B "$build" \
              -DSPWKIT_ENABLE_PROFILING=ON \
              -DSPWKIT_PROFILE_START="$start" \
              -DSPWKIT_PROFILE_END="$end" \
              -DSPWKIT_BUILD_CPP_TESTS=OFF \
              -DSPWKIT_BUILD_CPP_EXAMPLES=OFF
            cmake --build "$build" --target spwkit_profile_probe_smoke --parallel 2
            ctest --test-dir "$build" -R '^profiling_pair_smoke$' --output-on-failure
            index=$((index + 1))
          done

      - name: Commit atomic implementation
        shell: bash
        run: |
          set -euo pipefail
          # The branch bootstrap is temporary. Keep it unchanged here because
          # GITHUB_TOKEN cannot rewrite workflow files; it is removed after the
          # implementation commit through the repository integration.
          git checkout -- .github/workflows/profiling.yml
          rm -rf build-bootstrap-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt \
            src/profiling/profile.h \
            src/core/port.c \
            src/backends/driver/driver_backend.c \
            tests/profile_probe_smoke.c
          git commit -m "test(spwkit): instrument zero-copy profiling boundaries"
          git push origin HEAD:work/zero-copy-profiling
