name: Agent bridge patch

on:
  push:
    branches: [agent/develop]
    paths:
      - ".github/agent_bridge_patch.py"
      - ".github/workflows/agent-bridge-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply bridge patch
        run: python3 .github/agent_bridge_patch.py

      - name: Configure pure-C bridge profile
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-agent-bridge \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=ON \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-agent-bridge/CMakeCache.txt; then
            echo "bridge profile unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build
        run: cmake --build build-agent-bridge --parallel

      - name: Run bridge and protocol tests
        run: |
          ctest --test-dir build-agent-bridge -R '^(vspwd_udp_bridge_remote_restart|vspd_protocol_codec|spwctl_management_non_owning|spwmon_passive_push_observation)$' --output-on-failure --no-tests=error

      - name: Publish validated source
        run: |
          git config user.name "Robert A Incze"
          git config user.email "98164670+Inczert@users.noreply.github.com"
          git add src tests docs
          if git diff --cached --quiet; then
            echo "No source changes to publish"
            exit 0
          fi
          git commit -m "feat(spwkit): bridge vspwd over VSPW-TP/UDP"
          git push origin HEAD:agent/develop
