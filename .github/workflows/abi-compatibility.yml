name: ABI compatibility

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  shared-abi:
    name: Shared C ABI surface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build and install shared C library
        run: |
          cmake -S . -B build-abi \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-abi" \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_BUILD_CUSE=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF
          cmake --build build-abi --parallel
          cmake --install build-abi

      - name: Verify exported symbol manifest
        run: |
          lib="$(find install-abi -type f -name 'libspwkit.so*' ! -type l | head -n 1)"
          test -n "$lib"
          python3 tools/check_public_symbols.py "$lib" abi/public-symbols-1.x.txt

      - name: Build frozen installed-package consumer
        run: |
          cmake -S tests/compat/v1_consumer -B build-v1-consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-abi"
          cmake --build build-v1-consumer --parallel
          LD_LIBRARY_PATH="$PWD/install-abi/lib:${LD_LIBRARY_PATH:-}" \
            "$PWD/build-v1-consumer/spwkit_v1_consumer"
