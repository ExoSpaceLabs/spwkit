name: Installed device examples

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "src/core/port.c"
      - "src/backends/device/**"
      - "src/vspwd/**"
      - "examples/installed_device/**"
      - "examples/installed_device_cpp/**"
      - "docs/installed-device-examples.md"
      - ".github/workflows/installed-device-examples.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "src/core/port.c"
      - "src/backends/device/**"
      - "src/vspwd/**"
      - "examples/installed_device/**"
      - "examples/installed_device_cpp/**"
      - "docs/installed-device-examples.md"
      - ".github/workflows/installed-device-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-device-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-consumer:
    name: Installed C device / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v6

      - name: Configure installable pure-C device package
        env:
          CC: ${{ matrix.cc }}
          CXX: /bin/false
        run: |
          cmake -S . -B build-package \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-package/CMakeCache.txt; then
            echo "Pure-C package unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build and install package
        run: |
          cmake --build build-package --parallel
          cmake --install build-package --prefix "$PWD/install-device"
          test -x "$PWD/install-device/bin/vspwd"

      - name: Configure standalone C consumer
        env:
          CC: ${{ matrix.cc }}
          CXX: /bin/false
        run: |
          cmake -S examples/installed_device -B build-consumer-c \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-device" \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-consumer-c/CMakeCache.txt; then
            echo "Installed C consumer unexpectedly enabled CXX" >&2
            exit 1
          fi
          cmake --build build-consumer-c --parallel

      - name: Run installed C peer pair
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          socket="$tmpdir/vspwd.sock"
          daemon_pid=""
          peer0_pid=""
          cleanup() {
            set +e
            [[ -n "$peer0_pid" ]] && kill "$peer0_pid" 2>/dev/null || true
            [[ -n "$peer0_pid" ]] && wait "$peer0_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && kill -TERM "$daemon_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && wait "$daemon_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          "$PWD/install-device/bin/vspwd" --socket "$socket" >"$tmpdir/vspwd.log" 2>&1 & daemon_pid=$!
          for _ in $(seq 1 100); do [[ -S "$socket" ]] && break; sleep 0.02; done
          [[ -S "$socket" ]] || { cat "$tmpdir/vspwd.log"; exit 1; }

          timeout 10s "$PWD/build-consumer-c/spwkit_installed_device_c" "$socket" 0 >"$tmpdir/p0.log" 2>&1 & peer0_pid=$!
          sleep 0.05
          timeout 10s "$PWD/build-consumer-c/spwkit_installed_device_c" "$socket" 1 >"$tmpdir/p1.log" 2>&1 || {
            cat "$tmpdir/vspwd.log" "$tmpdir/p0.log" "$tmpdir/p1.log"
            exit 1
          }
          wait "$peer0_pid" || {
            cat "$tmpdir/vspwd.log" "$tmpdir/p0.log" "$tmpdir/p1.log"
            exit 1
          }
          peer0_pid=""

  cpp-consumer:
    name: Installed C++ wrapper and mixed peers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure wrapper-enabled device package
        run: |
          cmake -S . -B build-package \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-package --parallel
          cmake --install build-package --prefix "$PWD/install-device"
          test -x "$PWD/install-device/bin/vspwd"

      - name: Configure standalone C and C++ consumers
        run: |
          CC=gcc CXX=/bin/false cmake \
            -S examples/installed_device \
            -B build-consumer-c \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-device" \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-consumer-c/CMakeCache.txt; then
            echo "Mixed-test C consumer unexpectedly enabled CXX" >&2
            exit 1
          fi
          cmake --build build-consumer-c --parallel

          cmake \
            -S examples/installed_device_cpp \
            -B build-consumer-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-device" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-consumer-cpp --parallel

      - name: Run installed C++, C and mixed peer pairs
        shell: bash
        run: |
          set -euo pipefail

          run_pair() {
            local first="$1"
            local second="$2"
            local tag="$3"
            local tmpdir
            local socket
            local daemon_pid=""
            local peer0_pid=""

            tmpdir="$(mktemp -d)"
            socket="$tmpdir/vspwd.sock"

            "$PWD/install-device/bin/vspwd" --socket "$socket" >"$tmpdir/vspwd.log" 2>&1 & daemon_pid=$!
            for _ in $(seq 1 100); do [[ -S "$socket" ]] && break; sleep 0.02; done
            if [[ ! -S "$socket" ]]; then
              cat "$tmpdir/vspwd.log"
              kill -TERM "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              rm -rf "$tmpdir"
              return 1
            fi

            timeout 10s "$first" "$socket" 0 >"$tmpdir/p0.log" 2>&1 & peer0_pid=$!
            sleep 0.05
            if ! timeout 10s "$second" "$socket" 1 >"$tmpdir/p1.log" 2>&1; then
              echo "$tag pair: port 1 failed" >&2
              cat "$tmpdir/vspwd.log" "$tmpdir/p0.log" "$tmpdir/p1.log"
              kill "$peer0_pid" 2>/dev/null || true
              wait "$peer0_pid" 2>/dev/null || true
              kill -TERM "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              rm -rf "$tmpdir"
              return 1
            fi
            if ! wait "$peer0_pid"; then
              echo "$tag pair: port 0 failed" >&2
              cat "$tmpdir/vspwd.log" "$tmpdir/p0.log" "$tmpdir/p1.log"
              kill -TERM "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              rm -rf "$tmpdir"
              return 1
            fi

            kill -TERM "$daemon_pid"
            wait "$daemon_pid"
            cat "$tmpdir/p0.log" "$tmpdir/p1.log"
            rm -rf "$tmpdir"
          }

          c="$PWD/build-consumer-c/spwkit_installed_device_c"
          cpp="$PWD/build-consumer-cpp/spwkit_installed_device_cpp"
          run_pair "$c" "$c" "C/C"
          run_pair "$cpp" "$cpp" "C++/C++"
          run_pair "$c" "$cpp" "C/C++"
          run_pair "$cpp" "$c" "C++/C"
