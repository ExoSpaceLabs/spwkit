name: Patch fault docs

on:
  push:
    branches: [agent/v0.2-deterministic-fault-injection]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-deterministic-fault-injection
      - name: Refresh docs
        run: python3 .github/patch_fault_docs.py
      - name: Sanity checks
        run: |
          grep -q "Deterministic fault injection" docs/vspw-tp.md
          grep -q "spw_port_get_fault_statistics" docs/api.md
          grep -q "deterministic seeded VSPW-TP" docs/roadmap.md
          grep -q "ordinary transport" README.md
      - name: Commit docs
        run: |
          rm .github/patch_fault_docs.py .github/workflows/patch-fault-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Inczert@users.noreply.github.com"
          git add -A
          git commit -m "docs(spwkit): document deterministic fault injection #30"
          git push origin HEAD:agent/v0.2-deterministic-fault-injection
