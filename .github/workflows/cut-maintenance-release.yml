name: Cut v0.5 maintenance release

on:
  pull_request:
    branches: [release/0.5]
    paths:
      - "CMakeLists.txt"
      - "include/spwkit/**"
      - "examples/**"
      - "tests/**"
      - "docs/releases/**"
      - ".github/workflows/cut-maintenance-release.yml"
      - ".github/workflows/maintenance-release.yml"
  push:
    branches: [release/0.5]
    paths:
      - "CMakeLists.txt"
      - "include/spwkit/**"
      - "examples/**"
      - "tests/**"
      - "docs/releases/**"
      - ".github/workflows/cut-maintenance-release.yml"
      - ".github/workflows/maintenance-release.yml"

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: cut-v0.5-maintenance-release
  cancel-in-progress: false

jobs:
  cut:
    name: Validate and cut v0.5 maintenance tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ready: ${{ steps.tag.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate maintenance metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt | head -n1)"
          test -n "$version"
          [[ "$version" =~ ^0\.5\.[1-9][0-9]*$ ]]
          tag="v$version"
          test -f "docs/releases/$tag.md"
          api_patch="$(sed -nE 's/^#define SPWKIT_API_VERSION_PATCH ([0-9]+)u$/\1/p' include/spwkit/api.h)"
          test "$api_patch" = "${version##*.}"
          git merge-base --is-ancestor v0.5.0 HEAD
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or validate immutable tag
        if: ${{ github.event_name == 'push' }}
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin release/0.5 --tags
          branch_commit="$(git rev-parse origin/release/0.5)"
          test "$(git rev-parse HEAD)" = "$branch_commit"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-list -n1 "$RELEASE_TAG")"
            git merge-base --is-ancestor "$existing" "$branch_commit"
            if ! git diff --quiet "$existing".."$branch_commit" -- . ':(exclude).github/workflows/**'; then
              echo "$RELEASE_TAG exists at $existing but release/0.5 contains non-workflow changes after the tag" >&2
              exit 1
            fi
            echo "Reusing immutable tag $RELEASE_TAG at $existing after workflow-only maintenance fixes."
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
            echo "Created immutable tag $RELEASE_TAG at $GITHUB_SHA."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  release:
    name: Validate and publish maintenance release
    if: ${{ github.event_name == 'push' && needs.cut.outputs.ready == 'true' }}
    needs: cut
    uses: ./.github/workflows/maintenance-release.yml
    with:
      release_tag: ${{ needs.cut.outputs.tag }}
    secrets: inherit
