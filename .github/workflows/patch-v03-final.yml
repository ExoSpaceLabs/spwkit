name: Finalize v0.3 C runtime docs

on:
  push:
    branches: [agent/cpp-wrapper-packaging]
    paths:
      - ".github/workflows/patch-v03-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cpp-wrapper-packaging
          fetch-depth: 0

      - name: Reconcile C runtime names and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def required(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected {old!r}, found {actual}")
              p.write_text(text.replace(old, new, count))

          def optional(path, old, new):
              p = Path(path)
              p.write_text(p.read_text().replace(old, new))

          # Runtime factory selection is now C-to-C with no transition names.
          required(
              "src/core/port.c",
              '#include "backends/loopback/loopback_backend.h"\n',
              '#include "backends/loopback/loopback_backend.h"\n'
              '#ifdef SPWKIT_HAS_SIMULATOR\n'
              '#include "backends/virtual/simulator_backend.h"\n'
              '#endif\n'
              '#ifdef SPWKIT_HAS_UDP\n'
              '#include "backends/ethernet/udp_backend.h"\n'
              '#endif\n')
          required(
              "src/core/port.c",
              '#ifdef SPWKIT_HAS_SIMULATOR\n'
              'const spw_backend_factory_t* spw_cpp_simulator_backend_factory(void);\n'
              '#endif\n'
              '#ifdef SPWKIT_HAS_UDP\n'
              'const spw_backend_factory_t* spw_cpp_udp_backend_factory(void);\n'
              '#endif\n\n',
              '')
          required("src/core/port.c", "spw_cpp_simulator_backend_factory()", "spw_simulator_backend_factory()")
          required("src/core/port.c", "spw_cpp_udp_backend_factory()", "spw_udp_backend_factory()")
          required(
              "CMakeLists.txt",
              '        src/backends/virtual/simulator_backend.c\n'
              '        src/backends/virtual/simulator_factory_compat.c\n',
              '        src/backends/virtual/simulator_backend.c\n')
          required(
              "CMakeLists.txt",
              '        src/backends/ethernet/udp_backend.c\n'
              '        src/backends/ethernet/udp_factory_compat.c\n',
              '        src/backends/ethernet/udp_backend.c\n')

          # README release/language/build boundary.
          required(
              "README.md",
              'The v0.2 engineering scope is complete. Native Winsock UDP transport is intentionally deferred beyond this release and tracked separately in issue #42.\n',
              'The v0.2 engineering scope is complete. Native Winsock UDP transport is intentionally deferred beyond this release and tracked separately in issue #42.\n\n'
              '### v0.3.0 development line — C11 runtime\n\n'
              'The v0.3 engineering line converts the runtime implementation itself to C11 before Linux-device, RTOS and hardware backends expand the surface. `SpWKit::spwkit` now builds without a C++ compiler/runtime; `SPWKIT_ENABLE_CPP=ON` optionally installs a header-only C++17 `SpWKit::cpp` convenience target above the same C API. Static and shared builds use the standard `BUILD_SHARED_LIBS` switch. No `v0.3.0` tag is implied by the development version.\n')
          required(
              "README.md",
              '## No-throw policy\n\nThe `spwkit` library target is built with C++ exceptions and RTTI disabled on supported toolchains. Recoverable failures are reported through `spw_result_t`; library code does not depend on exception handling.\n\nThis is a project-wide portability property, not just a special no-heap CI configuration.\n',
              '## Language and error policy\n\n`libspwkit` is implemented in C11 and reports recoverable failures through `spw_result_t`. It does not require a C++ compiler, linker or runtime. The optional C++17 wrapper is exception-free, remains move/RAII convenience only, and delegates to the same C API.\n\nSee [C and C++ integration](docs/language-bindings.md) for C-only, wrapper-enabled, static/shared and embedded build profiles.\n')
          required("README.md", '  -DSPWKIT_BUILD_UDP=ON\n', '  -DSPWKIT_BUILD_UDP=ON \\\n  -DSPWKIT_ENABLE_CPP=OFF\n')
          required("README.md", 'Consumer CMake for v0.2.0:\n', 'Consumer CMake for the v0.3 development line:\n')
          required("README.md", 'find_package(SpWKit 0.2 CONFIG REQUIRED)\n', 'find_package(SpWKit 0.3 CONFIG REQUIRED)\n')
          required(
              "README.md",
              '- `examples/installed`: standalone installed-package consumer that also verifies exported UDP-runtime availability metadata;\n',
              '- `examples/installed`: standalone **C-only** installed-package consumer that verifies package/runtime metadata without enabling C++;\n'
              '- `examples/installed_cpp`: optional C++17 wrapper consumer built against `SpWKit::cpp`;\n')
          required(
              "README.md",
              '- [No-throw and portability contract](docs/portability.md)\n',
              '- [C and C++ integration](docs/language-bindings.md)\n'
              '- [Portability contract](docs/portability.md)\n')

          # Architecture language boundary.
          old_section = '''## C ABI and C++ use

The portability baseline is an implemented C ABI. This permits use from C flight software, C++ applications, hosted Linux software, and future bare-metal/RTOS integrations.

The library implementation is currently C++17, but public ABI types and operation signatures remain C-compatible. An idiomatic higher-level C++ wrapper may be expanded later without requiring backend changes.

```text
C / C++ application
       |
       v
stable C ABI
       |
       v
portable core
```
'''
          new_section = '''## C runtime and optional C++ use

The portability baseline is C11 end to end: the public ABI and `libspwkit` runtime are C. A project using only `SpWKit::spwkit` does not enable or link C++.

`SPWKIT_ENABLE_CPP=ON` adds the header-only C++17 `SpWKit::cpp` target. It provides move-only RAII/convenience syntax over the same C handles, structures and `spw_result_t` values; it contains no backend implementation.

```text
C application -----------------------------+
                                           |
C++ application -> optional SpWKit::cpp ---+--> stable C ABI --> C11 core/backends
```

See `docs/language-bindings.md` for the exact language/build contract.
'''
          required("docs/architecture.md", old_section, new_section)
          optional(
              "docs/architecture.md",
              'The internal C++ `Backend` abstraction currently owns lifecycle, copied packet I/O, time-code I/O, state/capability reporting, statistics, and optional zero-copy hooks.',
              'The internal C11 backend vtable/context contract owns lifecycle, copied packet I/O, time-code I/O, state/capability reporting, statistics, and optional zero-copy hooks.')
          optional(
              "docs/architecture.md",
              'The current implementation uses fixed `std::array` storage and standard mutex/condition-variable synchronization.',
              'The current implementation uses fixed C storage. Hosted simulator synchronization is private behind POSIX/Windows C adapters; the portable core has no thread dependency.')

          # Hard fail on stale implementation-language claims in primary docs.
          stale = {
              "README.md": ["library target is built with C++ exceptions", "Consumer CMake for v0.2.0"],
              "docs/architecture.md": ["library implementation is currently C++17", "internal C++ `Backend` abstraction"],
              "docs/portability.md": ["C++17 implementation baseline"],
          }
          for path, tokens in stale.items():
              text = Path(path).read_text()
              for token in tokens:
                  if token in text:
                      raise SystemExit(f"{path}: stale token remains: {token}")
          PY

          rm -f src/backends/virtual/simulator_factory_compat.c
          rm -f src/backends/ethernet/udp_factory_compat.c
          rm -f .github/workflows/patch-v03-final.yml

      - name: Commit final reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(spwkit): finalize C runtime packaging"
          git push origin HEAD:agent/cpp-wrapper-packaging
