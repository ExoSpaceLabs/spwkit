name: Patch session-header status docs

on:
  push:
    branches: [agent/v0.2-udp-reliability]
    paths:
      - .github/workflows/patch-session-doc-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-udp-reliability

      - name: Refresh short status documents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              '- versioned VSPW-TP v1 framing with a fixed 32-byte header;',
              '- versioned VSPW-TP v1 framing with a fixed 40-byte header carrying a 64-bit sender session ID;')
          text = text.replace(
              '- keepalive/session identity, peer timeout and restart recovery;',
              '- per-frame session identity, keepalive/peer timeout and restart recovery;')
          readme.write_text(text)

          roadmap = Path('docs/roadmap.md')
          text = roadmap.read_text()
          text = text.replace(
              '- versioned VSPW-TP v1 wire format with a stable 32-byte header;',
              '- versioned VSPW-TP v1 wire format with a 40-byte header carrying the sender session ID;')
          text = text.replace(
              '- 64-bit peer session KEEPALIVE semantics;',
              '- 64-bit sender session identity on every frame plus KEEPALIVE-driven session transitions;')
          roadmap.write_text(text)
          PY

          rm .github/workflows/patch-session-doc-status.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/roadmap.md .github/workflows/patch-session-doc-status.yml
          git commit -m "docs(spwkit): reflect VSPW-TP session header #26"
          git push origin HEAD:agent/v0.2-udp-reliability
