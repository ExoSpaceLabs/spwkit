name: C-only core

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/core/**"
      - "src/backends/loopback/**"
      - ".github/workflows/c-core.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/core/**"
      - "src/backends/loopback/**"
      - ".github/workflows/c-core.yml"

jobs:
  c-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure C-only static core
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-c \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-c"

          if grep -q '^CMAKE_CXX_COMPILER:' build-c/CMakeCache.txt; then
            echo "CXX language/compiler was enabled by the C-only profile" >&2
            exit 1
          fi

      - name: Build and install C-only static core
        run: |
          cmake --build build-c --parallel
          cmake --install build-c
          archive="$(find install-c -type f -name 'libspwkit.a' -print -quit)"
          test -n "$archive"
          if nm -u "$archive" | grep -Eq '(__cxa|_Z|libstdc\+\+|cxxabi)'; then
            echo "C-only archive contains C++ runtime/ABI references" >&2
            nm -u "$archive"
            exit 1
          fi

      - name: Build installed C-only consumer
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(spwkit_c_only_consumer LANGUAGES C)
          find_package(SpWKit CONFIG REQUIRED)
          add_executable(c_consumer main.c)
          target_link_libraries(c_consumer PRIVATE SpWKit::spwkit)
          set_target_properties(c_consumer PROPERTIES C_STANDARD 11 C_STANDARD_REQUIRED YES)
          CMAKE

          cat > consumer/main.c <<'C'
          #include <spwkit/port.h>
          #include <stdint.h>
          #include <string.h>

          int main(void) {
              spw_port_config_t config = SPW_PORT_CONFIG_INITIALIZER(SPW_BACKEND_LOOPBACK);
              spw_port_t* port = NULL;
              uint8_t tx_data[4] = {1u, 2u, 3u, 4u};
              uint8_t rx_data[4] = {0};
              spw_packet_t tx = {tx_data, sizeof(tx_data), sizeof(tx_data), SPW_TERMINATOR_EOP};
              spw_packet_t rx = {rx_data, 0u, sizeof(rx_data), SPW_TERMINATOR_EOP};

              if (spw_port_open(&config, &port) != SPW_OK || port == NULL) return 1;
              if (spw_port_start(port) != SPW_OK) return 2;
              if (spw_port_send(port, &tx, SPW_TIMEOUT_IMMEDIATE) != SPW_OK) return 3;
              if (spw_port_receive(port, &rx, SPW_TIMEOUT_IMMEDIATE) != SPW_OK) return 4;
              if (rx.length != sizeof(tx_data) || memcmp(tx_data, rx_data, sizeof(tx_data)) != 0) return 5;
              return spw_port_close(port) == SPW_OK ? 0 : 6;
          }
          C

          CC=gcc CXX=/bin/false cmake -S consumer -B consumer/build \
            -DCMAKE_PREFIX_PATH="$PWD/install-c"
          if grep -q '^CMAKE_CXX_COMPILER:' consumer/build/CMakeCache.txt; then
            echo "Installed C consumer enabled a C++ compiler" >&2
            exit 1
          fi
          cmake --build consumer/build --parallel
          ./consumer/build/c_consumer

      - name: Configure and build no-heap C-only core
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-c-noheap \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF
          if grep -q '^CMAKE_CXX_COMPILER:' build-c-noheap/CMakeCache.txt; then
            echo "No-heap C profile enabled a C++ compiler" >&2
            exit 1
          fi
          cmake --build build-c-noheap --parallel
