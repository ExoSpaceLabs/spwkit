name: C-only runtime

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/core/**"
      - "src/platform/**"
      - "src/backends/**"
      - "tests/**"
      - "examples/CMakeLists.txt"
      - "examples/*.c"
      - "examples/installed/**"
      - ".github/workflows/c-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/core/**"
      - "src/platform/**"
      - "src/backends/**"
      - "tests/**"
      - "examples/CMakeLists.txt"
      - "examples/*.c"
      - "examples/installed/**"
      - ".github/workflows/c-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-only:
    name: Pure C static/shared/runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure and test C-only static core
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-c \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-c"

          if grep -q '^CMAKE_CXX_COMPILER:' build-c/CMakeCache.txt; then
            echo "CXX language/compiler was enabled by the C-only profile" >&2
            exit 1
          fi
          cmake --build build-c --parallel
          ctest --test-dir build-c --output-on-failure --no-tests=error
          cmake --install build-c

          archive="$(find install-c -type f -name 'libspwkit.a' -print -quit)"
          test -n "$archive"
          if nm -u "$archive" | grep -Eq '(__cxa|_Z|libstdc\+\+|cxxabi)'; then
            echo "C-only archive contains C++ runtime/ABI references" >&2
            nm -u "$archive"
            exit 1
          fi
          test ! -f install-c/include/spwkit/spwkit.hpp

      - name: Build and run installed C-only consumer
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S examples/installed -B consumer/build \
            -DCMAKE_PREFIX_PATH="$PWD/install-c"
          if grep -q '^CMAKE_CXX_COMPILER:' consumer/build/CMakeCache.txt; then
            echo "Installed C consumer enabled a C++ compiler" >&2
            exit 1
          fi
          cmake --build consumer/build --parallel
          ctest --test-dir consumer/build --output-on-failure --no-tests=error

      - name: Configure and test complete C-only simulator/UDP runtime
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-c-runtime \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF
          if grep -q '^CMAKE_CXX_COMPILER:' build-c-runtime/CMakeCache.txt; then
            echo "Complete runtime profile enabled a C++ compiler" >&2
            exit 1
          fi
          cmake --build build-c-runtime --parallel
          ctest --test-dir build-c-runtime -L c --output-on-failure --no-tests=error
          archive="build-c-runtime/libspwkit.a"
          test -f "$archive"
          if nm -u "$archive" | grep -Eq '(__cxa|_Z|libstdc\+\+|cxxabi)'; then
            echo "Complete C runtime archive contains C++ runtime/ABI references" >&2
            nm -u "$archive"
            exit 1
          fi

      - name: Configure and test installed shared C runtime
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-c-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-shared"
          if grep -q '^CMAKE_CXX_COMPILER:' build-c-shared/CMakeCache.txt; then
            echo "Shared C runtime enabled a C++ compiler" >&2
            exit 1
          fi
          cmake --build build-c-shared --parallel
          cmake --install build-c-shared
          test -f install-shared/lib/libspwkit.so

          cmake -S examples/installed -B consumer-shared/build \
            -DCMAKE_PREFIX_PATH="$PWD/install-shared"
          if grep -q '^CMAKE_CXX_COMPILER:' consumer-shared/build/CMakeCache.txt; then
            echo "Shared installed C consumer enabled a C++ compiler" >&2
            exit 1
          fi
          cmake --build consumer-shared/build --parallel
          LD_LIBRARY_PATH="$PWD/install-shared/lib:${LD_LIBRARY_PATH:-}" \
            ctest --test-dir consumer-shared/build --output-on-failure --no-tests=error

      - name: Configure and test no-heap C-only core
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-c-noheap \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_CPP=OFF
          if grep -q '^CMAKE_CXX_COMPILER:' build-c-noheap/CMakeCache.txt; then
            echo "No-heap C profile enabled a C++ compiler" >&2
            exit 1
          fi
          cmake --build build-c-noheap --parallel
          ctest --test-dir build-c-noheap -L noheap --output-on-failure --no-tests=error
