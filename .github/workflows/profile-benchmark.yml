name: Profile benchmark

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Profiling cases: all or space/comma-separated names'
        required: true
        default: all
        type: string
      warmup:
        description: Warmup iterations per payload
        required: true
        default: '256'
        type: string
      iterations:
        description: Measured iterations per payload (1..4096)
        required: true
        default: '1024'
        type: string
      payloads:
        description: Space/comma-separated payload sizes in bytes (0..4096)
        required: true
        default: '0 1 8 64 256 1024 4096'
        type: string
      counter_hz:
        description: Optional architectural counter frequency override; 0 means unknown/platform-reported
        required: true
        default: '0'
        type: string
      settle_seconds:
        description: Seconds to settle after each clean build before timing
        required: true
        default: '1'
        type: string
  pull_request:
    branches: [develop, main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'benchmarks/**'
      - 'scripts/stm32h755_board_test.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/profile-benchmark.yml'
  push:
    branches: [develop]
    paths:
      - 'include/**'
      - 'src/**'
      - 'benchmarks/**'
      - 'scripts/stm32h755_board_test.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/profile-benchmark.yml'

permissions:
  contents: read

jobs:
  hosted-benchmark:
    name: Hosted benchmark campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BENCHMARK_CASES: ${{ github.event.inputs.cases || 'all' }}
      BENCHMARK_WARMUP: ${{ github.event.inputs.warmup || '64' }}
      BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '256' }}
      BENCHMARK_PAYLOADS: ${{ github.event.inputs.payloads || '0 64 1024 4096' }}
      BENCHMARK_COUNTER_HZ: ${{ github.event.inputs.counter_hz || '0' }}
      BENCHMARK_SETTLE_SECONDS: ${{ github.event.inputs.settle_seconds || '0' }}
      BENCHMARK_RESULT_TYPE: github-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run clean serial benchmark campaign
        shell: bash
        run: |
          set -euo pipefail
          rm -rf benchmark-results
          mkdir -p benchmark-results
          result_dir="$(benchmarks/run_profile_campaign.sh \
            --cases "${BENCHMARK_CASES}" \
            --warmup "${BENCHMARK_WARMUP}" \
            --iterations "${BENCHMARK_ITERATIONS}" \
            --payloads "${BENCHMARK_PAYLOADS}" \
            --counter-hz "${BENCHMARK_COUNTER_HZ}" \
            --settle-seconds "${BENCHMARK_SETTLE_SECONDS}" \
            --type "${BENCHMARK_RESULT_TYPE}" \
            --build-root build/profile-campaign \
            --output-root benchmark-results | tail -n 1)"
          [[ -d "$result_dir" ]] || {
            echo "benchmark result directory was not produced: $result_dir" >&2
            exit 1
          }
          printf 'BENCHMARK_RESULT_DIR=%s\n' "$result_dir" >> "$GITHUB_ENV"
          printf 'Benchmark result directory: %s\n' "$result_dir"

      - name: Validate machine-readable campaign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['BENCHMARK_RESULT_DIR'])
          metadata = json.loads((root / 'campaign.json').read_text())
          assert metadata['schema'] == 'spwkit.profile.campaign.v1'
          assert metadata['result_type'] == 'github-hosted'
          assert re.fullmatch(r'\d{8}T\d{6}Z', metadata['timestamp_utc'])
          assert re.fullmatch(r'[0-9a-f]{8,}', metadata['git_short_sha'])
          expected_name = f"{metadata['result_type']}-{metadata['timestamp_utc']}-{metadata['git_short_sha']}"
          assert metadata['result_directory_name'] == expected_name
          assert root.name == expected_name
          assert metadata['build_type'] == 'Release'
          assert metadata['clean_rebuild_per_case'] is True
          assert metadata['serial_execution'] is True
          assert metadata['counter_floor_calibration_per_case'] is True
          assert metadata['direct_native_comparison'] is True
          assert metadata['direct_native_comparison_case'] == 'tx_api_native'
          assert metadata['direct_native_comparison_cases'] == ['tx_api_native', 'rx_native_api']
          assert metadata['direct_native_counter_floor_subtracted'] is False
          assert metadata['summary_file'] == 'summary.txt'
          assert metadata['coverage_file'] == 'coverage.json'
          assert metadata['cases']

          rows = [json.loads(line) for line in (root / 'results.jsonl').read_text().splitlines() if line.strip()]
          calibrations = [json.loads(line) for line in (root / 'calibration.jsonl').read_text().splitlines() if line.strip()]
          tx_comparison_rows = [json.loads(line) for line in (root / 'comparison' / 'tx_api_native.jsonl').read_text().splitlines() if line.strip()]
          rx_comparison_rows = [json.loads(line) for line in (root / 'comparison' / 'rx_native_api.jsonl').read_text().splitlines() if line.strip()]
          tx_comparison_calibration = json.loads((root / 'comparison' / 'calibration.json').read_text())
          rx_comparison_calibration = json.loads((root / 'comparison' / 'rx_calibration.json').read_text())
          coverage = json.loads((root / 'coverage.json').read_text())
          summary = (root / 'summary.txt').read_text()

          if not rows:
              raise SystemExit('benchmark campaign emitted no result rows')
          if not tx_comparison_rows or not rx_comparison_rows:
              raise SystemExit('benchmark campaign emitted incomplete direct/native comparison rows')
          if len(calibrations) != len(metadata['cases']):
              raise SystemExit('benchmark campaign did not emit one calibration row per case')

          required_stats = {'min', 'median', 'mean', 'p95', 'p99', 'max', 'stddev'}
          for calibration in [*calibrations, tx_comparison_calibration, rx_comparison_calibration]:
              assert calibration['schema'] == 'spwkit.profile.calibration.v1'
              assert calibration['measurement_domain'] == 'instrumentation'
              assert calibration['unit'] == 'counter_ticks'
              assert calibration['method'] == 'back_to_back_counter_reads'
              assert required_stats == set(calibration['statistics'])
              assert calibration['counter']['width_bits'] in (32, 64)
              assert calibration['statistics']['min'] <= calibration['statistics']['median'] <= calibration['statistics']['max']

          for row in rows:
              assert row['schema'] == 'spwkit.profile.v1'
              assert row['measurement_domain'] == 'software'
              assert row['unit'] == 'counter_ticks'
              assert row['backend'] == 'driver'
              assert row['direction'] == 'tx'
              assert row['path'] == 'copied'
              assert row['heap_used'] is False
              assert row['sample_storage'] == 'fixed'
              assert 0 <= row['payload_bytes'] <= 4096
              assert 1 <= row['iterations'] <= 4096
              assert required_stats == set(row['statistics'])
              assert row['counter']['width_bits'] in (32, 64)
              assert isinstance(row['counter']['frequency_hz'], int)
              assert row['statistics']['min'] <= row['statistics']['median'] <= row['statistics']['max']
              assert row['statistics']['min'] <= row['statistics']['p95'] <= row['statistics']['max']
              assert row['statistics']['min'] <= row['statistics']['p99'] <= row['statistics']['max']

          def validate_comparison(row, direction, fixture):
              assert row['schema'] == 'spwkit.profile.comparison.v1'
              assert row['measurement_domain'] == 'software'
              assert row['unit'] == 'counter_ticks'
              assert row['backend'] == 'driver'
              assert row['direction'] == direction
              assert row['spwkit_path'] == 'copied'
              assert row['native_path'] == 'direct-provider-call'
              assert row['provider_fixture'] == fixture
              assert row['sample_order'] == 'alternating-per-iteration'
              assert row['counter_floor_subtracted'] is False
              assert 0 <= row['payload_bytes'] <= 4096
              assert 1 <= row['iterations'] <= 4096
              assert required_stats == set(row['native_statistics'])
              assert required_stats == set(row['spwkit_statistics'])
              assert row['delta']['definition'] == 'spwkit-minus-native'
              assert {'median_ticks', 'mean_ticks', 'p95_ticks', 'p99_ticks', 'median_percent', 'mean_percent'} <= set(row['delta'])
              for side in ('native_statistics', 'spwkit_statistics'):
                  stats = row[side]
                  assert stats['min'] <= stats['median'] <= stats['max']
                  assert stats['min'] <= stats['p95'] <= stats['max']
                  assert stats['min'] <= stats['p99'] <= stats['max']

          for row in tx_comparison_rows:
              validate_comparison(row, 'tx', 'shared-reference-provider-submit')
          for row in rx_comparison_rows:
              validate_comparison(row, 'rx', 'shared-reference-provider-receive')

          assert coverage['schema'] == 'spwkit.profile.coverage.v1'
          assert len(coverage['entries']) == 12
          measured = {
              (entry['backend'], entry['path'], entry['direction'])
              for entry in coverage['entries']
              if entry['status'] == 'measured'
          }
          assert ('driver', 'copied', 'tx') in measured
          assert ('driver', 'copied', 'rx') in measured
          assert coverage['counts']['measured'] >= 2

          assert 'SpWKit Host Profiling Summary' in summary
          assert 'DRIVER copied TX: direct/provider vs SpWKit' in summary
          assert 'DRIVER copied RX: direct/provider vs SpWKit' in summary
          assert 'Hosted-backend coverage' in summary
          assert 'Measured: 2/12' in summary

          per_case_files = sorted((root / 'cases').glob('*.jsonl'))
          calibration_files = sorted((root / 'calibration').glob('*.json'))
          assert len(per_case_files) == len(metadata['cases'])
          assert len(calibration_files) == len(metadata['cases'])
          print(
              f"validated {len(metadata['cases'])} clean-build case(s), "
              f"{len(rows)} layer row(s), {len(tx_comparison_rows)} TX comparison row(s), "
              f"{len(rx_comparison_rows)} RX comparison row(s), coverage and summary in {root.name}"
          )
          PY

      - name: Record runner metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['BENCHMARK_RESULT_DIR'])
          metadata = {
              'schema': 'spwkit.profile.run.v1',
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'github_event': os.environ['GITHUB_EVENT_NAME'],
              'runner': 'github-hosted/ubuntu-24.04',
              'result_directory_name': root.name,
              'authoritative_performance_result': False,
              'note': 'GitHub-hosted timing is informational; use controlled/local or physical-target campaigns for performance claims.'
          }
          (root / 'run-metadata.json').write_text(
              json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Publish summary
        shell: bash
        run: |
          {
            echo '### SpWKit hosted profiling campaign'
            echo
            echo '```text'
            cat "${BENCHMARK_RESULT_DIR}/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: spwkit-profile-results-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
