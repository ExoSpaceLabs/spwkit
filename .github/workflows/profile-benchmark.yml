name: Profile benchmark

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Profiling cases: all or space/comma-separated names'
        required: true
        default: all
        type: string
      warmup:
        description: Warmup iterations per payload
        required: true
        default: '256'
        type: string
      iterations:
        description: Measured iterations per payload (1..4096)
        required: true
        default: '1024'
        type: string
      payloads:
        description: Space/comma-separated payload sizes in bytes (0..4096)
        required: true
        default: '0 1 8 64 256 1024 4096'
        type: string
      counter_hz:
        description: Optional architectural counter frequency override; 0 means unknown/platform-reported
        required: true
        default: '0'
        type: string
      settle_seconds:
        description: Seconds to settle after each clean build before timing
        required: true
        default: '1'
        type: string
  pull_request:
    branches: [develop, main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'benchmarks/**'
      - 'scripts/stm32h755_board_test.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/profile-benchmark.yml'
  push:
    branches: [develop]
    paths:
      - 'include/**'
      - 'src/**'
      - 'benchmarks/**'
      - 'scripts/stm32h755_board_test.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/profile-benchmark.yml'

permissions:
  contents: read

jobs:
  hosted-benchmark:
    name: Hosted benchmark campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BENCHMARK_CASES: ${{ github.event.inputs.cases || 'all' }}
      BENCHMARK_WARMUP: ${{ github.event.inputs.warmup || '64' }}
      BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '256' }}
      BENCHMARK_PAYLOADS: ${{ github.event.inputs.payloads || '0 64 1024 4096' }}
      BENCHMARK_COUNTER_HZ: ${{ github.event.inputs.counter_hz || '0' }}
      BENCHMARK_SETTLE_SECONDS: ${{ github.event.inputs.settle_seconds || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run clean serial benchmark campaign
        shell: bash
        run: |
          set -euo pipefail
          benchmarks/run_profile_campaign.sh \
            --cases "${BENCHMARK_CASES}" \
            --warmup "${BENCHMARK_WARMUP}" \
            --iterations "${BENCHMARK_ITERATIONS}" \
            --payloads "${BENCHMARK_PAYLOADS}" \
            --counter-hz "${BENCHMARK_COUNTER_HZ}" \
            --settle-seconds "${BENCHMARK_SETTLE_SECONDS}" \
            --build-root build/profile-campaign \
            --output-dir benchmark-results

      - name: Validate machine-readable campaign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('benchmark-results')
          metadata = json.loads((root / 'campaign.json').read_text())
          assert metadata['schema'] == 'spwkit.profile.campaign.v1'
          assert metadata['build_type'] == 'Release'
          assert metadata['clean_rebuild_per_case'] is True
          assert metadata['serial_execution'] is True
          assert metadata['cases']

          rows = [json.loads(line) for line in (root / 'results.jsonl').read_text().splitlines() if line.strip()]
          if not rows:
              raise SystemExit('benchmark campaign emitted no result rows')

          required_stats = {'min', 'median', 'mean', 'p95', 'p99', 'max', 'stddev'}
          for row in rows:
              assert row['schema'] == 'spwkit.profile.v1'
              assert row['measurement_domain'] == 'software'
              assert row['unit'] == 'counter_ticks'
              assert row['backend'] == 'driver'
              assert row['direction'] == 'tx'
              assert row['path'] == 'copied'
              assert row['heap_used'] is False
              assert row['sample_storage'] == 'fixed'
              assert 0 <= row['payload_bytes'] <= 4096
              assert 1 <= row['iterations'] <= 4096
              assert required_stats == set(row['statistics'])
              assert row['counter']['width_bits'] in (32, 64)
              assert isinstance(row['counter']['frequency_hz'], int)
              assert row['statistics']['min'] <= row['statistics']['median'] <= row['statistics']['max']
              assert row['statistics']['min'] <= row['statistics']['p95'] <= row['statistics']['max']
              assert row['statistics']['min'] <= row['statistics']['p99'] <= row['statistics']['max']

          per_case_files = sorted((root / 'cases').glob('*.jsonl'))
          assert len(per_case_files) == len(metadata['cases'])
          print(f"validated {len(metadata['cases'])} clean-build case(s), {len(rows)} result row(s)")
          PY

      - name: Record runner metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              'schema': 'spwkit.profile.run.v1',
              'git_sha': os.environ['GITHUB_SHA'],
              'git_ref': os.environ['GITHUB_REF'],
              'github_event': os.environ['GITHUB_EVENT_NAME'],
              'runner': 'github-hosted/ubuntu-24.04',
              'authoritative_performance_result': False,
              'note': 'GitHub-hosted timing is informational; use controlled/local or physical-target campaigns for performance claims.'
          }
          Path('benchmark-results/run-metadata.json').write_text(
              json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Publish summary
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          root = Path('benchmark-results')
          campaign = json.loads((root / 'campaign.json').read_text())
          print('### SpWKit hosted profiling campaign')
          print()
          print('Each profiling configuration was configured and built from a clean directory and executed serially.')
          print('GitHub-hosted timing is **informational only**; controlled/local or physical-target runs are required for performance claims.')
          print()
          print(f"Cases: `{', '.join(campaign['cases'])}`")
          print()
          print('| Case | Payload (B) | Mean ticks | Median | p95 | p99 | Min | Max |')
          print('|---|---:|---:|---:|---:|---:|---:|---:|')
          for case_file in sorted((root / 'cases').glob('*.jsonl')):
              case_name = case_file.stem
              for line in case_file.read_text().splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  s = row['statistics']
                  print(f"| {case_name} | {row['payload_bytes']} | {s['mean']:.3f} | {s['median']:.3f} | {s['p95']} | {s['p99']} | {s['min']} | {s['max']} |")
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: spwkit-profile-results-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
