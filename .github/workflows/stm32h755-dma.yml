name: STM32H755 DMA evidence

on:
  push:
    branches: [main, develop]
    paths:
      - 'include/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'integrations/stm32h755_dma/**'
      - 'scripts/stm32h755_board_test.sh'
      - 'scripts/stm32h755_profile_campaign.sh'
      - 'scripts/stm32h755_native_compare_campaign.sh'
      - 'scripts/extract_stm32h755_profile.py'
      - 'scripts/extract_stm32h755_native_compare.py'
      - 'scripts/summarize_stm32h755_profile.py'
      - 'scripts/summarize_stm32h755_native_compare.py'
      - 'scripts/openocd_h755.cfg'
      - 'scripts/gdb/stm32h755_board_test.gdb'
      - 'scripts/gdb/stm32h755_profile.gdb'
      - 'scripts/gdb/stm32h755_native_compare.gdb'
      - '.github/workflows/stm32h755-dma.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'integrations/stm32h755_dma/**'
      - 'scripts/stm32h755_board_test.sh'
      - 'scripts/stm32h755_profile_campaign.sh'
      - 'scripts/stm32h755_native_compare_campaign.sh'
      - 'scripts/extract_stm32h755_profile.py'
      - 'scripts/extract_stm32h755_native_compare.py'
      - 'scripts/summarize_stm32h755_profile.py'
      - 'scripts/summarize_stm32h755_native_compare.py'
      - 'scripts/openocd_h755.cfg'
      - 'scripts/gdb/stm32h755_board_test.gdb'
      - 'scripts/gdb/stm32h755_profile.gdb'
      - 'scripts/gdb/stm32h755_native_compare.gdb'
      - '.github/workflows/stm32h755-dma.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    name: Cortex-M7 build/link
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      STM32_CUBE_H7_COMMIT: f5c0b7a2b1f6eb26fde150f72edb2d7deb647066

    steps:
      - name: Checkout SpWKit
        uses: actions/checkout@v4

      - name: Validate board runner syntax
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/stm32h755_board_test.sh
          test -x scripts/stm32h755_profile_campaign.sh
          test -x scripts/stm32h755_native_compare_campaign.sh
          bash -n scripts/stm32h755_board_test.sh
          bash -n scripts/stm32h755_profile_campaign.sh
          bash -n scripts/stm32h755_native_compare_campaign.sh
          python3 -m py_compile \
            scripts/extract_stm32h755_profile.py \
            scripts/extract_stm32h755_native_compare.py \
            scripts/summarize_stm32h755_profile.py \
            scripts/summarize_stm32h755_native_compare.py

      - name: Install Arm GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            git

      - name: Fetch pinned STM32 CMSIS headers
        shell: bash
        run: |
          set -euo pipefail
          cube="${RUNNER_TEMP}/STM32CubeH7"
          git clone --filter=blob:none --no-checkout \
            https://github.com/STMicroelectronics/STM32CubeH7.git "${cube}"
          git -C "${cube}" sparse-checkout init --cone
          git -C "${cube}" sparse-checkout set \
            Drivers/CMSIS/Include \
            Drivers/CMSIS/Device/ST/STM32H7xx
          git -C "${cube}" checkout "${STM32_CUBE_H7_COMMIT}"
          git -C "${cube}" submodule update --init --depth 1 \
            Drivers/CMSIS/Device/ST/STM32H7xx
          test -f "${cube}/Drivers/CMSIS/Include/core_cm7.h"
          test -f "${cube}/Drivers/CMSIS/Device/ST/STM32H7xx/Include/stm32h755xx.h"
          echo "STM32_CUBE_H7_DIR=${cube}" >> "${GITHUB_ENV}"

      - name: Cross-build and install SpWKit
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/stm32-spwkit \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build/stm32-install" \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF
          cmake --build build/stm32-spwkit --parallel 2
          cmake --install build/stm32-spwkit

      - name: Build STM32H755 evidence firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake -S integrations/stm32h755_dma -B build/stm32h755-dma \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stm32-install" \
            -DSTM32_CUBE_H7_DIR="${STM32_CUBE_H7_DIR}"
          cmake --build build/stm32h755-dma --parallel 2

      - name: Verify firmware evidence surface
        shell: bash
        run: |
          set -euo pipefail
          elf="build/stm32h755-dma/spwkit_stm32h755_dma.elf"
          test -s "${elf}"
          arm-none-eabi-nm -g "${elf}" | grep -q 'g_stm32h755_spwkit_evidence'
          if arm-none-eabi-nm -u "${elf}" | grep -Eq '(^|[[:space:]])(malloc|calloc|realloc|free|printf|puts|write|read)$'; then
            echo 'Unexpected hosted runtime symbol in STM32H755 evidence firmware' >&2
            arm-none-eabi-nm -u "${elf}" >&2
            exit 1
          fi
          arm-none-eabi-size "${elf}"
          arm-none-eabi-objdump -h "${elf}" | grep -E '(isr_vector|dma_buffer|text|data|bss)'

      - name: Cross-build representative Release profiling firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/stm32-profile-spwkit \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build/stm32-profile-install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_PROFILING=ON \
            -DSPWKIT_PROFILE_START=SPW_PROFILE_ID_TX_API_ENTRY \
            -DSPWKIT_PROFILE_END=SPW_PROFILE_ID_TX_PROVIDER_BOUNDARY \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF
          cmake --build build/stm32-profile-spwkit --parallel 2

          port_obj="build/stm32-profile-spwkit/CMakeFiles/spwkit.dir/src/core/port.c.obj"
          test -s "${port_obj}"
          if arm-none-eabi-readelf -r "${port_obj}" | grep -q 'GOT'; then
            echo 'Bare-metal Cortex-M7 SpWKit unexpectedly contains GOT relocations' >&2
            arm-none-eabi-readelf -r "${port_obj}" >&2
            exit 1
          fi

          cmake --install build/stm32-profile-spwkit

          cmake -S integrations/stm32h755_dma -B build/stm32h755-profile \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stm32-profile-install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTM32_CUBE_H7_DIR="${STM32_CUBE_H7_DIR}" \
            -DSPWKIT_STM32_PROFILE_FIRMWARE=ON \
            -DSPWKIT_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DSPWKIT_STM32_PROFILE_START=SPW_PROFILE_ID_TX_API_ENTRY \
            -DSPWKIT_STM32_PROFILE_END=SPW_PROFILE_ID_TX_PROVIDER_BOUNDARY \
            -DSPWKIT_STM32_PROFILE_CASE=1 \
            -DSPWKIT_STM32_PROFILE_WARMUP=2 \
            -DSPWKIT_STM32_PROFILE_ITERATIONS=4
          cmake --build build/stm32h755-profile \
            --target spwkit_stm32h755_profile --parallel 2

          elf="build/stm32h755-profile/spwkit_stm32h755_profile.elf"
          test -s "${elf}"
          arm-none-eabi-nm -g "${elf}" | grep -q 'g_stm32h755_spwkit_profile'
          if arm-none-eabi-readelf -SW "${elf}" | grep -Eq '[[:space:]]\.got(\.plt)?[[:space:]]'; then
            echo 'STM32H755 profile image exposes a standalone GOT section' >&2
            arm-none-eabi-readelf -SW "${elf}" >&2
            exit 1
          fi
          if arm-none-eabi-nm -u "${elf}" | grep -Eq '(^|[[:space:]])(malloc|calloc|realloc|free|printf|puts|write|read)$'; then
            echo 'Unexpected hosted runtime symbol in STM32H755 profile firmware' >&2
            arm-none-eabi-nm -u "${elf}" >&2
            exit 1
          fi
          arm-none-eabi-size "${elf}"

      - name: Cross-build representative native differential firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake -S integrations/stm32h755_dma -B build/stm32h755-native-compare \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/stm32-profile-install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTM32_CUBE_H7_DIR="${STM32_CUBE_H7_DIR}" \
            -DSPWKIT_STM32_PROFILE_FIRMWARE=ON \
            -DSPWKIT_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DSPWKIT_STM32_PROFILE_START=SPW_PROFILE_ID_TX_API_ENTRY \
            -DSPWKIT_STM32_PROFILE_END=SPW_PROFILE_ID_TX_PROVIDER_BOUNDARY \
            -DSPWKIT_STM32_PROFILE_CASE=9 \
            -DSPWKIT_STM32_PROFILE_WARMUP=2 \
            -DSPWKIT_STM32_PROFILE_ITERATIONS=4
          cmake --build build/stm32h755-native-compare \
            --target spwkit_stm32h755_profile --parallel 2

          elf="build/stm32h755-native-compare/spwkit_stm32h755_profile.elf"
          test -s "${elf}"
          arm-none-eabi-nm -g "${elf}" | grep -q 'g_stm32h755_spwkit_profile'
          if arm-none-eabi-readelf -SW "${elf}" | grep -Eq '[[:space:]]\.got(\.plt)?[[:space:]]'; then
            echo 'STM32H755 native differential image exposes a standalone GOT section' >&2
            arm-none-eabi-readelf -SW "${elf}" >&2
            exit 1
          fi
          if arm-none-eabi-nm -u "${elf}" | grep -Eq '(^|[[:space:]])(malloc|calloc|realloc|free|printf|puts|write|read)$'; then
            echo 'Unexpected hosted runtime symbol in STM32H755 native differential firmware' >&2
            arm-none-eabi-nm -u "${elf}" >&2
            exit 1
          fi
          arm-none-eabi-size "${elf}"
