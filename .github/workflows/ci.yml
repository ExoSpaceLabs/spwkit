name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate package metadata and stale markers
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt | head -n1)"
          test -n "$version"
          minor="${version%.*}"

          consumers=(
            examples/installed/CMakeLists.txt
            examples/installed_cpp/CMakeLists.txt
            examples/distributed/CMakeLists.txt
            examples/distributed_cpp/CMakeLists.txt
            examples/installed_device/CMakeLists.txt
            examples/installed_device_cpp/CMakeLists.txt
            integrations/hardrt_posix/CMakeLists.txt
            integrations/ccsdspack_v2/CMakeLists.txt
          )
          for consumer in "${consumers[@]}"; do
            [[ -f "$consumer" ]] || continue
            grep -q "find_package(SpWKit ${minor} CONFIG REQUIRED)" "$consumer" || {
              echo "$consumer must request current SpWKit minor ${minor}" >&2
              exit 1
            }
          done

          scopes=(CMakeLists.txt cmake docs examples integrations tests .github/workflows README.md)
          legacy_target="$(printf '%s%s' 'SpWKit:' ':')"
          legacy_linker="$(printf '%s%s' 'LINKER_LANGUAGE' ' CXX')"
          legacy_port="$(printf '%s%s' 'src/core/port.' 'cpp')"

          ! git grep -nF "$legacy_target" -- "${scopes[@]}" || {
            echo "Use lowercase exported CMake target namespaces." >&2
            exit 1
          }
          ! git grep -nF "$legacy_linker" -- "${scopes[@]}" || {
            echo "C consumers must not force a C++ linker." >&2
            exit 1
          }
          ! git grep -nF "$legacy_port" -- .github docs || {
            echo "A stale pre-C11 runtime source path remains." >&2
            exit 1
          }

      - name: Reject explicit exception syntax
        shell: bash
        run: |
          if git grep -nE '\b(throw|try|catch)\b' -- '*.cpp' '*.hpp'; then
            echo "SpWKit C++ wrapper/tests/examples must remain exception-free."
            exit 1
          fi

  host:
    name: Host / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2025
            cc: ""
            cxx: ""
          - name: macOS Clang
            os: macos-latest
            cc: ""
            cxx: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_CPP_EXAMPLES=ON
          -DSPWKIT_BUILD_SIMULATOR=OFF
          -DSPWKIT_BUILD_UDP=ON
          -DSPWKIT_BUILD_DEVICE=OFF
          -DSPWKIT_BUILD_VSPWD=OFF
          -DSPWKIT_BUILD_TOOLS=OFF
          -DSPWKIT_BUILD_CUSE=OFF
          -DSPWKIT_ENABLE_HEAP=ON
          -DSPWKIT_ENABLE_CPP=ON
      - name: Build and test
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Install and validate consumers
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/install"
          test -f "$PWD/install/share/doc/spwkit/LICENSE"
          test -f "$PWD/install/share/doc/spwkit/NOTICE"
          test -f "$PWD/install/include/spwkit/udp.h"

          cmake -S examples/installed -B installed-c -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build installed-c --config Release --parallel
          ctest --test-dir installed-c -C Release --output-on-failure --no-tests=error

          cmake -S examples/installed_cpp -B installed-cpp -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build installed-cpp --config Release --parallel
          ctest --test-dir installed-cpp -C Release --output-on-failure --no-tests=error

  portable-c:
    name: Pure C / static, shared, no-heap, freestanding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Static pure-C
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-c \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-c"
          ! grep -q '^CMAKE_CXX_COMPILER:' build-c/CMakeCache.txt
          cmake --build build-c --parallel
          ctest --test-dir build-c -L c --output-on-failure --no-tests=error
          cmake --install build-c
          archive="$(find install-c -type f -name 'libspwkit.a' -print -quit)"
          test -n "$archive"
          ! nm -u "$archive" | grep -Eq '(__cxa|_Z|libstdc\+\+|cxxabi)'

      - name: Shared pure-C
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF
          cmake --build build-shared --parallel

      - name: No-heap and freestanding
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-noheap \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_CPP=OFF
          cmake --build build-noheap --parallel
          ctest --test-dir build-noheap -L noheap --output-on-failure --no-tests=error

          cmake -S . -B build-freestanding \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-ffreestanding -fno-builtin -Wall -Wextra -Werror"
          cmake --build build-freestanding --parallel
          ! nm -u build-freestanding/libspwkit.a | grep -Eq '(pthread_|socket|sendto|recvfrom|poll|WSA|__cxa|_Z)'

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure, build and test
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=ON \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=ON \
            -DSPWKIT_BUILD_CUSE=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure --no-tests=error

  linux-integration:
    name: Linux integration / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v6
      - name: Build complete hosted stack
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build-hosted \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=ON \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=ON \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=ON \
            -DSPWKIT_BUILD_CUSE=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-hosted --parallel
          ctest --test-dir build-hosted --output-on-failure --no-tests=error
          cmake --install build-hosted --prefix "$PWD/install-hosted"
          export LD_LIBRARY_PATH="$PWD/install-hosted/lib:${LD_LIBRARY_PATH:-}"
          "$PWD/install-hosted/bin/vspwd" --help
          "$PWD/install-hosted/bin/spwctl" --help
          "$PWD/install-hosted/bin/spwmon" --help

          cmake -S examples/installed_device -B installed-device-c -DCMAKE_PREFIX_PATH="$PWD/install-hosted"
          cmake --build installed-device-c --parallel
          cmake -S examples/installed_device_cpp -B installed-device-cpp -DCMAKE_PREFIX_PATH="$PWD/install-hosted"
          cmake --build installed-device-cpp --parallel

      - name: Process and Compose transport contracts
        if: ${{ matrix.compiler == 'GCC' }}
        run: |
          cmake -S . -B build-d2d \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-d2d" \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=ON \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=ON
          cmake --build build-d2d --parallel
          ctest --test-dir build-d2d -L d2d --output-on-failure --no-tests=error
          cmake --install build-d2d

          CC=gcc CXX=/bin/false cmake -S examples/distributed -B distributed-c -DCMAKE_PREFIX_PATH="$PWD/install-d2d"
          cmake --build distributed-c --parallel
          cmake -S examples/distributed_cpp -B distributed-cpp -DCMAKE_PREFIX_PATH="$PWD/install-d2d"
          cmake --build distributed-cpp --parallel

          bash tests/d2d/run_multi_process.sh "$PWD/distributed-c/spwkit_udp_peer"
          bash tests/d2d/run_cross_language.sh \
            "$PWD/distributed-c/spwkit_udp_peer" \
            "$PWD/distributed-cpp/spwkit_udp_peer_cpp"
          if ! command -v ip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y iproute2
          fi
          bash tests/d2d/run_netns.sh "$PWD/distributed-c/spwkit_udp_peer"
          docker compose version
          bash tests/d2d/run_compose.sh

  cuse:
    name: Linux CUSE / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: GCC build
            cc: gcc
            live: false
          - mode: Clang build
            cc: clang
            live: false
          - mode: Live contract
            cc: gcc
            live: true
    steps:
      - uses: actions/checkout@v6
      - name: Install CUSE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev pkg-config kmod
          if [[ "${{ matrix.live }}" == "true" ]]; then
            sudo modprobe cuse
            test -c /dev/cuse
          fi
      - name: Configure and build
        env:
          CC: ${{ matrix.cc }}
          CXX: /bin/false
        run: |
          cmake -S . -B build-cuse \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_BUILD_CUSE=ON \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-cuse --parallel
          build-cuse/spwcuse --api-check
      - name: Live character-device contract
        if: ${{ matrix.live }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          socket="$tmpdir/vspwd.sock"
          device="vspw-ci-${GITHUB_RUN_ID}"
          device_path="/dev/$device"
          daemon_pid=""
          presenter_pid=""
          peer_pid=""
          cleanup() {
            set +e
            [[ -n "$peer_pid" ]] && kill "$peer_pid" 2>/dev/null || true
            [[ -n "$presenter_pid" ]] && sudo kill -TERM "$presenter_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && kill -TERM "$daemon_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          build-cuse/vspwd --socket "$socket" >"$tmpdir/vspwd.log" 2>&1 & daemon_pid=$!
          for _ in $(seq 1 100); do [[ -S "$socket" ]] && break; sleep 0.02; done
          [[ -S "$socket" ]]

          sudo -E build-cuse/spwcuse --socket "$socket" --port 0 --device "$device" >"$tmpdir/spwcuse.log" 2>&1 & presenter_pid=$!
          for _ in $(seq 1 150); do [[ -c "$device_path" ]] && break; sleep 0.02; done
          [[ -c "$device_path" ]]

          timeout 10s build-cuse/spwkit_cuse_vspd_peer "$socket" >"$tmpdir/peer.log" 2>&1 & peer_pid=$!
          sleep 0.05
          sudo timeout 10s build-cuse/spwkit_cuse_raw_client "$device_path"
          wait "$peer_pid"
          peer_pid=""

  windows-udp:
    name: Native Winsock VSPW-TP
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate Winsock transport
        shell: pwsh
        run: |
          cmake -S . -B build-winsock `
            -DCMAKE_BUILD_TYPE=Release `
            -DSPWKIT_BUILD_TESTS=ON `
            -DSPWKIT_BUILD_CPP_TESTS=ON `
            -DSPWKIT_BUILD_EXAMPLES=OFF `
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF `
            -DSPWKIT_BUILD_SIMULATOR=OFF `
            -DSPWKIT_BUILD_UDP=ON `
            -DSPWKIT_BUILD_DEVICE=OFF `
            -DSPWKIT_BUILD_VSPWD=OFF `
            -DSPWKIT_BUILD_TOOLS=OFF `
            -DSPWKIT_BUILD_CUSE=OFF `
            -DSPWKIT_ENABLE_HEAP=ON `
            -DSPWKIT_ENABLE_CPP=OFF
          cmake --build build-winsock --config Release --parallel
          ctest --test-dir build-winsock -C Release --output-on-failure `
            -R "udp_distributed_backend|udp_out_of_order_reassembly|udp_virtual_link_timing|udp_deterministic_faults|backend_contract_udp"
          cmake --install build-winsock --config Release --prefix "$PWD/install-winsock"

          $config = Get-Content -Raw "$PWD/install-winsock/lib/cmake/SpWKit/SpWKitConfig.cmake"
          if ($config -notmatch 'set\(SpWKit_UDP_RUNTIME_SUPPORTED ON\)') { throw "UDP runtime not advertised" }
          if ($config -notmatch 'set\(SpWKit_UDP_RUNTIME_SCOPE "Winsock"\)') { throw "Winsock scope not advertised" }

          cmake -S tests/windows_udp -B build-windows-peer `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$PWD/install-winsock"
          cmake --build build-windows-peer --config Release --parallel
          $base = 39000 + (($env:GITHUB_RUN_NUMBER -as [int]) % 100) * 2
          ./tests/windows_udp/run_restart.ps1 `
            -Peer "$PWD/build-windows-peer/Release/spwkit_windows_udp_peer.exe" `
            -BasePort $base

  hardrt-posix:
    name: HardRT POSIX / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ExoSpaceLabs/hardrt
          ref: 1b861393cd7967ce5d0b3ac6f45928828a2d63aa
          path: external/hardrt
      - name: Build installed integration
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          CC="${{ matrix.cc }}" CXX=/bin/false cmake -S . -B build-spwkit \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_CPP=OFF
          cmake --build build-spwkit --parallel
          cmake --install build-spwkit --prefix "$PWD/install-spwkit"

          cmake -S external/hardrt -B build-hardrt \
            -DCMAKE_BUILD_TYPE=Release \
            -DHARDRT_PORT=posix \
            -DHARDRT_ENABLE_CPP=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF \
            -DHARDRT_BUILD_TESTS=OFF
          cmake --build build-hardrt --parallel
          cmake --install build-hardrt --prefix "$PWD/install-hardrt"

          cmake -S integrations/hardrt_posix -B build-integration \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-spwkit;$PWD/install-hardrt"
          cmake --build build-integration --parallel
          timeout 15s "$PWD/build-integration/spwkit_hardrt_posix"

  hardrt-cortex-m7:
    name: HardRT Cortex-M7
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ExoSpaceLabs/hardrt
          ref: 1b861393cd7967ce5d0b3ac6f45928828a2d63aa
          path: external/hardrt
      - name: Cross-build and link firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi

          cmake -S . -B build-cortex-spwkit \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -ffreestanding -fno-builtin"
          cmake --build build-cortex-spwkit --parallel
          cmake --install build-cortex-spwkit --prefix "$PWD/install-spwkit"

          cmake -S external/hardrt -B build-cortex-hardrt \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DHARDRT_PORT=cortex_m \
            -DHARDRT_ENABLE_CPP=OFF \
            -DHARDRT_BUILD_EXAMPLES=OFF \
            -DHARDRT_BUILD_TESTS=OFF
          cmake --build build-cortex-hardrt --parallel
          cmake --install build-cortex-hardrt --prefix "$PWD/install-hardrt"

          cmake -S integrations/hardrt_cortex_m -B build-cortex-integration \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/arm-none-eabi-cortex-m7.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-spwkit;$PWD/install-hardrt"
          cmake --build build-cortex-integration --parallel
          elf="$PWD/build-cortex-integration/spwkit_hardrt_cortex_m7.elf"
          test -f "$elf"
          ! arm-none-eabi-nm -u "$elf" | grep -q .
          ! arm-none-eabi-nm "$elf" | grep -Eq '(pthread_|socket|sendto|recvfrom|poll|WSA|__cxa|_Z)'

  ccsdspack:
    name: CCSDSPack v2 transport
    if: ${{ github.ref_name == 'develop' || github.base_ref == 'develop' }}
    runs-on: ubuntu-24.04
    env:
      CCSDSPACK_TAG: v2.0.0
      CCSDSPACK_SHA: c2f318c330c564429bcc565a8acbff22728b2851
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ExoSpaceLabs/CCSDSPack
          ref: ${{ env.CCSDSPACK_TAG }}
          path: .deps/CCSDSPack
          fetch-depth: 1
      - name: Build and validate transport integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .deps/CCSDSPack rev-parse HEAD)" = "$CCSDSPACK_SHA"
          test -f integrations/ccsdspack_v2/CMakeLists.txt

          cmake -S .deps/CCSDSPack -B build-ccsdspack -DCMAKE_BUILD_TYPE=Release -DCCSDSPACK_BUILD_MCU=OFF
          cmake --build build-ccsdspack --parallel
          cmake --install build-ccsdspack --prefix "$PWD/install-ccsdspack"

          cmake -S . -B build-spwkit \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_BUILD_CUSE=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=ON
          cmake --build build-spwkit --parallel
          cmake --install build-spwkit --prefix "$PWD/install-spwkit"

          cmake -S integrations/ccsdspack_v2 -B build-integration \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-spwkit;$PWD/install-ccsdspack"
          cmake --build build-integration --parallel
          export LD_LIBRARY_PATH="$PWD/install-spwkit/lib:$PWD/install-ccsdspack/lib:${LD_LIBRARY_PATH:-}"
          peer="$PWD/build-integration/spwkit_ccsdspack_v2_peer"

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          timeout 20s "$peer" udp A 24190 24191 >"$tmpdir/a.log" 2>&1 & a_pid=$!
          sleep 0.10
          timeout 20s "$peer" udp B 24191 24190 >"$tmpdir/b.log" 2>&1
          wait "$a_pid"
          grep -q 'PASS backend=udp' "$tmpdir/a.log"
          grep -q 'PASS backend=udp' "$tmpdir/b.log"

  tooling:
    name: Wireshark dissector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate VSPW-TP dissector
        run: |
          if ! command -v tshark >/dev/null 2>&1; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          fi
          python3 tools/wireshark/validate_dissector.py
