name: CI

on:
  push:
    branches: [main, release/0.5]
  pull_request:
    branches: [main, release/0.5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject stale runtime/package markers
        shell: bash
        run: |
          scopes=(CMakeLists.txt cmake docs examples integrations tests .github/workflows README.md)
          current_version_scopes=(examples integrations tests/d2d/README.md)
          legacy_target="$(printf '%s%s' 'SpWKit:' ':')"
          legacy_linker="$(printf '%s%s' 'LINKER_LANGUAGE' ' CXX')"
          legacy_port="$(printf '%s%s' 'src/core/port.' 'cpp')"

          if git grep -nF "$legacy_target" -- "${scopes[@]}"; then
            echo "Use lowercase exported CMake target namespaces." >&2
            exit 1
          fi
          if git grep -nF "$legacy_linker" -- "${scopes[@]}"; then
            echo "C consumers must not force a C++ linker." >&2
            exit 1
          fi
          for stale_version in 0.1 0.2 0.3 0.4; do
            legacy_package="$(printf '%s%s' 'find_package(SpWKit ' "$stale_version")"
            if git grep -nF "$legacy_package" -- "${current_version_scopes[@]}"; then
              echo "Current v0.5 executable examples/integrations must request SpWKit 0.5." >&2
              exit 1
            fi
          done
          if git grep -nF "$legacy_port" -- .github/workflows docs; then
            echo "A stale pre-C11 runtime source path remains." >&2
            exit 1
          fi

      - name: Reject explicit exception syntax
        shell: bash
        run: |
          if git grep -nE '\b(throw|try|catch)\b' -- '*.cpp' '*.hpp'; then
            echo "SpWKit C++ wrapper/tests/examples must remain exception-free."
            exit 1
          fi

  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2025
            cc: ""
            cxx: ""
          - name: macOS Clang
            os: macos-latest
            cc: ""
            cxx: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_CPP_EXAMPLES=ON
          -DSPWKIT_BUILD_SIMULATOR=OFF
          -DSPWKIT_BUILD_TOOLS=OFF
          -DSPWKIT_ENABLE_HEAP=ON
          -DSPWKIT_ENABLE_CPP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install package
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/install"
          test -f "$PWD/install/share/doc/spwkit/LICENSE"
          test -f "$PWD/install/share/doc/spwkit/NOTICE"
          test -f "$PWD/install/include/spwkit/udp.h"

      - name: Configure installed C-only consumer
        shell: bash
        run: >-
          cmake -S examples/installed -B build-installed-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/install"

      - name: Build installed C-only consumer
        run: cmake --build build-installed-consumer --config Release --parallel

      - name: Test installed C-only consumer
        run: ctest --test-dir build-installed-consumer -C Release --output-on-failure --no-tests=error

      - name: Configure installed C++ wrapper consumer
        shell: bash
        run: >-
          cmake -S examples/installed_cpp -B build-installed-cpp-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/install"

      - name: Build installed C++ wrapper consumer
        run: cmake --build build-installed-cpp-consumer --config Release --parallel

      - name: Test installed C++ wrapper consumer
        run: ctest --test-dir build-installed-cpp-consumer -C Release --output-on-failure --no-tests=error

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_CPP_EXAMPLES=ON
          -DSPWKIT_ENABLE_HEAP=ON
          -DSPWKIT_ENABLE_CPP=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure

  no-heap-cpp:
    name: Linux no-heap C++ fixture
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure no-heap C++ development profile
        run: >-
          cmake -S . -B build-noheap
          -DCMAKE_BUILD_TYPE=Debug
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=OFF
          -DSPWKIT_BUILD_CPP_EXAMPLES=OFF
          -DSPWKIT_BUILD_SIMULATOR=OFF
          -DSPWKIT_BUILD_TOOLS=OFF
          -DSPWKIT_ENABLE_HEAP=OFF
          -DSPWKIT_ENABLE_CPP=OFF

      - name: Build no-heap profile
        run: cmake --build build-noheap --parallel

      - name: Run allocation-free contract
        run: >-
          ctest --test-dir build-noheap
          -L noheap
          --output-on-failure
          --no-tests=error
