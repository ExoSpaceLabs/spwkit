name: Verify v0.3 language boundary

on:
  push:
    branches:
      - agent/cpp-wrapper-packaging
    paths:
      - .github/workflows/verify-v03-language.yml

permissions:
  contents: write

jobs:
  c-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Reject migration debris and stale docs
        run: |
          test ! -e .github/workflows/patch-v03-final.yml
          test ! -e .github/workflows/patch-v03-final2.yml
          test ! -e .github/scripts/patch_v03_final.py
          test ! -e src/backends/virtual/simulator_factory_compat.c
          test ! -e src/backends/ethernet/udp_factory_compat.c
          ! grep -q 'library implementation is currently C++17' docs/architecture.md
          ! grep -q 'library target is built with C++ exceptions' README.md
          grep -q 'v0.3.0 development line' README.md
          grep -q 'SpWKit::cpp' docs/language-bindings.md

      - name: Build complete static runtime without CXX
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-static"
          ! grep -q '^CMAKE_CXX_COMPILER:' build-static/CMakeCache.txt
          cmake --build build-static --parallel
          cmake --install build-static
          ! nm -u build-static/libspwkit.a | grep -Eq '(__cxa|_Z|libstdc\+\+|cxxabi)'
          test ! -e install-static/include/spwkit/spwkit.hpp
          cmake -S examples/installed -B consumer-static \
            -DCMAKE_PREFIX_PATH="$PWD/install-static"
          ! grep -q '^CMAKE_CXX_COMPILER:' consumer-static/CMakeCache.txt
          cmake --build consumer-static --parallel
          ctest --test-dir consumer-static --output-on-failure --no-tests=error

      - name: Build complete shared runtime without CXX
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/install-shared"
          ! grep -q '^CMAKE_CXX_COMPILER:' build-shared/CMakeCache.txt
          cmake --build build-shared --parallel
          cmake --install build-shared
          test -f install-shared/lib/libspwkit.so
          cmake -S examples/installed -B consumer-shared \
            -DCMAKE_PREFIX_PATH="$PWD/install-shared"
          ! grep -q '^CMAKE_CXX_COMPILER:' consumer-shared/CMakeCache.txt
          cmake --build consumer-shared --parallel
          LD_LIBRARY_PATH="$PWD/install-shared/lib:${LD_LIBRARY_PATH:-}" \
            ctest --test-dir consumer-shared --output-on-failure --no-tests=error

  wrapper-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure wrapper package
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_SIMULATOR=OFF
          -DSPWKIT_ENABLE_CPP=ON
          -DCMAKE_INSTALL_PREFIX="$PWD/install"
      - name: Build and test
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        shell: bash
        run: cmake --install build --config Release --prefix "$PWD/install"
      - name: Build installed C consumer
        shell: bash
        run: |
          cmake -S examples/installed -B consumer-c -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer-c --config Release --parallel
          ctest --test-dir consumer-c -C Release --output-on-failure --no-tests=error
      - name: Build installed C++ wrapper consumer
        shell: bash
        run: |
          cmake -S examples/installed_cpp -B consumer-cpp -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer-cpp --config Release --parallel
          ctest --test-dir consumer-cpp -C Release --output-on-failure --no-tests=error

  verified:
    needs: [c-runtime, wrapper-matrix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cpp-wrapper-packaging
          fetch-depth: 0
      - name: Record successful verification and remove helper
        run: |
          printf 'v0.3 C runtime/C++ wrapper verification passed\n' > .v03-language-verified
          rm -f .github/workflows/verify-v03-language.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(spwkit): record v0.3 language verification"
          git push origin HEAD:agent/cpp-wrapper-packaging
