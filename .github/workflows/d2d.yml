name: Device-to-device

on:
  push:
    branches: [main]
    paths:
      - "include/spwkit/udp.h"
      - "src/backends/ethernet/**"
      - "src/core/port.cpp"
      - "tests/udp*.cpp"
      - "tests/contract/**"
      - "tests/CMakeLists.txt"
      - ".github/workflows/d2d.yml"
  pull_request:
    branches: [main]
    paths:
      - "include/spwkit/udp.h"
      - "src/backends/ethernet/**"
      - "src/core/port.cpp"
      - "tests/udp*.cpp"
      - "tests/contract/**"
      - "tests/CMakeLists.txt"
      - ".github/workflows/d2d.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d2d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  udp-d2d:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build-d2d
          -DCMAKE_BUILD_TYPE=Release
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=OFF
          -DSPWKIT_BUILD_SIMULATOR=ON
          -DSPWKIT_BUILD_UDP=ON
          -DSPWKIT_ENABLE_HEAP=ON

      - name: Build
        run: cmake --build build-d2d --parallel

      - name: Run distributed transport tests
        run: ctest --test-dir build-d2d --output-on-failure -L d2d
