name: Device-to-device

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "src/backends/ethernet/**"
      - "src/core/port.c"
      - "tests/udp*.cpp"
      - "tests/contract/**"
      - "tests/d2d/**"
      - "tests/CMakeLists.txt"
      - "examples/distributed/**"
      - "examples/distributed_cpp/**"
      - "examples/installed/**"
      - ".github/workflows/d2d.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "src/backends/ethernet/**"
      - "src/core/port.c"
      - "tests/udp*.cpp"
      - "tests/contract/**"
      - "tests/d2d/**"
      - "tests/CMakeLists.txt"
      - "examples/distributed/**"
      - "examples/distributed_cpp/**"
      - "examples/installed/**"
      - ".github/workflows/d2d.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d2d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  udp-d2d:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build-d2d
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build-d2d/install
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=OFF
          -DSPWKIT_BUILD_CPP_EXAMPLES=OFF
          -DSPWKIT_BUILD_SIMULATOR=ON
          -DSPWKIT_BUILD_UDP=ON
          -DSPWKIT_ENABLE_HEAP=ON
          -DSPWKIT_ENABLE_CPP=ON

      - name: Build
        run: cmake --build build-d2d --parallel

      - name: Run distributed transport tests
        run: ctest --test-dir build-d2d --output-on-failure -L d2d

      - name: Install SpWKit
        run: cmake --install build-d2d

      - name: Configure installed C-only distributed peer
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S examples/distributed -B build-distributed \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-d2d/install
          if grep -q '^CMAKE_CXX_COMPILER:' build-distributed/CMakeCache.txt; then
            echo "Distributed C example unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build installed C distributed peer
        run: cmake --build build-distributed --parallel

      - name: Configure and build installed C++ distributed peer
        run: |
          cmake -S examples/distributed_cpp -B build-distributed-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build-d2d/install \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-distributed-cpp --parallel

      - name: Run two-process C restart scenario
        run: bash tests/d2d/run_multi_process.sh "${{ github.workspace }}/build-distributed/spwkit_udp_peer"

      - name: Run C/C++ cross-language process matrix
        run: >-
          bash tests/d2d/run_cross_language.sh
          "${{ github.workspace }}/build-distributed/spwkit_udp_peer"
          "${{ github.workspace }}/build-distributed-cpp/spwkit_udp_peer_cpp"

      - name: Ensure network namespace tooling
        run: |
          if ! command -v ip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y iproute2
          fi
          sudo -n true

      - name: Run network-namespace restart scenario
        run: bash tests/d2d/run_netns.sh "${{ github.workspace }}/build-distributed/spwkit_udp_peer"

      - name: Validate Docker Compose availability
        run: docker compose version

      - name: Run two-container C/C++ Compose matrix
        run: bash tests/d2d/run_compose.sh
