name: STM32 Cortex-M7 PIC fix bootstrap

on:
  push:
    branches: [test/stm32h755-physical-profiling]
    paths:
      - 'scripts/apply_stm32_pic_fix.py'
      - '.github/workflows/stm32-pic-fix-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/stm32h755-physical-profiling
          fetch-depth: 0

      - name: Apply Cortex-M7 PIC fix
        run: python3 scripts/apply_stm32_pic_fix.py

      - name: Validate patch
        run: |
          set -euo pipefail
          bash -n scripts/stm32h755_profile_campaign.sh
          git diff --check
          grep -q 'POSITION_INDEPENDENT_CODE ${SPWKIT_TARGET_PIC}' CMakeLists.txt
          grep -q '\*(.got\*)' integrations/stm32h755_dma/linker.ld
          ! grep -q 'stm32_profile_last_sample_direct' integrations/stm32h755_dma/firmware.c

      - name: Commit permanent non-workflow fix
        run: |
          git config user.name 'Robert A Incze'
          git config user.email '98164670+Inczert@users.noreply.github.com'
          git add CMakeLists.txt integrations/stm32h755_dma/linker.ld integrations/stm32h755_dma/firmware.c
          git commit -m 'fix(spwkit): make Cortex-M7 startup position-independent safe'
          git push origin HEAD:test/stm32h755-physical-profiling
