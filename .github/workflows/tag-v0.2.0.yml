name: Tag v0.2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-v0.2.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create v0.2.0 tag
        run: |
          target="4c7caeae3fa79268a8bfbf7b27a0709b81b57df7"

          if git rev-parse -q --verify refs/tags/v0.2.0 >/dev/null; then
            actual="$(git rev-list -n1 refs/tags/v0.2.0)"
            if [ "$actual" != "$target" ]; then
              echo "v0.2.0 already exists at $actual, expected $target" >&2
              exit 1
            fi
            echo "v0.2.0 already points to $target"
            exit 0
          fi

          git tag v0.2.0 "$target"
          git push origin refs/tags/v0.2.0
