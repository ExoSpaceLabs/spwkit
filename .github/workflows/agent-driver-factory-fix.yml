name: Agent driver factory fix

on:
  push:
    branches: [agent/driver-dma]
    paths: [.github/workflows/agent-driver-factory-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/driver-dma
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'src/backends/loopback/loopback_backend.c': ('    &LOOPBACK_OPS\n};', '    &LOOPBACK_OPS,\n    NULL\n};'),
              'src/backends/virtual/simulator_backend.c': ('    &SIMULATOR_OPS\n};', '    &SIMULATOR_OPS,\n    NULL\n};'),
              'src/backends/device/device_backend.c': ('    &DEVICE_OPS};', '    &DEVICE_OPS,\n    NULL};'),
              'src/backends/ethernet/udp_backend.c': ('    &UDP_OPS\n};', '    &UDP_OPS,\n    NULL\n};'),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern missing: {path}')
              p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backends/loopback/loopback_backend.c \
                  src/backends/virtual/simulator_backend.c \
                  src/backends/device/device_backend.c \
                  src/backends/ethernet/udp_backend.c
          git commit -m "fix(spwkit): initialize static backend sizing hooks"
          git push origin HEAD:agent/driver-dma
