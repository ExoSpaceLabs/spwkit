name: Bootstrap DEVICE benchmark fairness fix

# One-shot guarded benchmark patch; removed before review.
on:
  pull_request:
    branches:
      - develop
    paths:
      - scripts/bootstrap_device_benchmark_fairness.py
      - .github/workflows/bootstrap-device-benchmark-fairness.yml
  push:
    branches:
      - perf/device-readiness-fast-path
    paths:
      - scripts/bootstrap_device_benchmark_fairness.py
      - .github/workflows/bootstrap-device-benchmark-fairness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: perf/device-readiness-fast-path
      - name: Apply guarded comparator patch
        shell: bash
        run: |
          if [[ ! -f scripts/bootstrap_device_benchmark_fairness.py ]]; then
            echo "Patch script already consumed."
            exit 0
          fi
          python3 scripts/bootstrap_device_benchmark_fairness.py
          git diff --check
      - name: Commit benchmark fix
        shell: bash
        run: |
          if [[ ! -f scripts/bootstrap_device_benchmark_fairness.py ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/profile_device_comparison.c
          git rm scripts/bootstrap_device_benchmark_fairness.py
          git commit -m "test(spwkit): keep DEVICE native comparison fair"
          git push origin HEAD:perf/device-readiness-fast-path
