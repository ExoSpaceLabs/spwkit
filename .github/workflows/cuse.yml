name: CUSE feasibility

on:
  push:
    branches: [main]
    paths:
      - "src/cuse/**"
      - "tests/cuse_record_protocol.c"
      - "tools/cuse-probe/**"
      - "docs/cuse-feasibility.md"
      - ".github/workflows/cuse.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/cuse/**"
      - "tests/cuse_record_protocol.c"
      - "tools/cuse-probe/**"
      - "docs/cuse-feasibility.md"
      - ".github/workflows/cuse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuse-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: record codec + libfuse3 / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v6

      - name: Install libfuse3 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config
          pkg-config --modversion fuse3

      - name: Build and run private packet-record codec
        env:
          CC: ${{ matrix.cc }}
        run: |
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic \
            -Isrc \
            tests/cuse_record_protocol.c \
            src/cuse/vspw_cuse_record.c \
            -o cuse-record-test
          ./cuse-record-test

      - name: Configure standalone pure-C CUSE probe
        env:
          CC: ${{ matrix.cc }}
          CXX: /bin/false
        run: |
          cmake -S tools/cuse-probe -B build-cuse-probe \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-cuse-probe/CMakeCache.txt; then
            echo "CUSE probe unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build and validate linked CUSE API surface
        run: |
          cmake --build build-cuse-probe --parallel
          build-cuse-probe/spwcuse_probe --api-check

      - name: Report runtime CUSE availability
        shell: bash
        run: |
          if [[ -c /dev/cuse ]]; then
            echo "/dev/cuse is present on this runner; full device creation is intentionally not a release gate yet."
          else
            echo "/dev/cuse is not exposed by this hosted runner; compile/API feasibility remains validated."
          fi
