name: Agent readiness patch

on:
  push:
    branches: [agent/develop]
    paths:
      - ".github/workflows/agent-readiness-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/develop
          fetch-depth: 0

      - name: Apply targeted readiness implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # Device backend: preserve existing packet/time-code caches and expose
          # them through a level-triggered, non-consuming wait operation.
          device = "src/backends/device/device_backend.c"
          marker = """static spw_result_t device_get_statistics(const void* raw,
                                          spw_statistics_t* out_statistics) {
"""
          readiness = r'''static spw_ready_events_t device_ready_events(
    const device_context_t* context,
    spw_ready_events_t interests) {
    spw_ready_events_t ready = SPW_READY_NONE;
    if ((interests & SPW_READY_RX_PACKET) != 0u && context->rx_ready) {
        ready |= SPW_READY_RX_PACKET;
    }
    if ((interests & SPW_READY_RX_TIME_CODE) != 0u &&
        context->time_code_count != 0u) {
        ready |= SPW_READY_RX_TIME_CODE;
    }
    return ready;
}

static spw_result_t device_service_event(device_context_t* context,
                                         uint64_t deadline) {
    uint8_t frame[VSPD_HEADER_SIZE + VSPD_MAX_FRAME_PAYLOAD];
    vspd_header_t header;
    const uint8_t* payload;
    size_t frame_size = 0u;
    spw_result_t result = receive_record(context,
                                         frame,
                                         sizeof(frame),
                                         &frame_size,
                                         deadline);
    if (result != SPW_OK) {
        return result;
    }
    if (vspd_validate_frame(frame, frame_size, &header) != VSPD_CODEC_OK ||
        (header.flags & VSPD_FLAG_RESPONSE) != 0u) {
        mark_disconnected(context);
        return SPW_ERR_BACKEND;
    }
    payload = header.payload_size == 0u ? NULL : frame + VSPD_HEADER_SIZE;
    return process_event(context, &header, payload);
}

static spw_result_t device_wait(void* raw,
                                spw_ready_events_t interests,
                                spw_timeout_us_t timeout_us,
                                spw_ready_events_t* out_ready) {
    device_context_t* context = (device_context_t*)raw;
    uint64_t deadline = deadline_for(timeout_us);
    spw_ready_events_t ready = device_ready_events(context, interests);
    spw_result_t result;

    *out_ready = SPW_READY_NONE;
    if (ready != SPW_READY_NONE) {
        *out_ready = ready;
        return SPW_OK;
    }

    result = ensure_connected(context, deadline);
    if (result != SPW_OK) {
        return result;
    }

    for (;;) {
        result = device_service_event(context, deadline);
        if (result != SPW_OK) {
            return result;
        }
        ready = device_ready_events(context, interests);
        if (ready != SPW_READY_NONE) {
            *out_ready = ready;
            return SPW_OK;
        }
    }
}

'''
          replace_once(device, marker, readiness + marker)
          replace_once(
              device,
              """    unsupported_acquire_rx,
    unsupported_release_rx};
""",
              """    unsupported_acquire_rx,
    unsupported_release_rx,
    device_wait};
""",
          )

          # Optional C++ wrapper delegates to exactly the same C API.
          replace_once(
              "include/spwkit/spwkit.hpp",
              """    Result capabilities(spw_capabilities_t& capabilities) const noexcept {
        return handle_ != nullptr
                   ? spw_port_get_capabilities(handle_, &capabilities)
                   : SPW_ERR_INVALID_STATE;
    }

""",
              """    Result capabilities(spw_capabilities_t& capabilities) const noexcept {
        return handle_ != nullptr
                   ? spw_port_get_capabilities(handle_, &capabilities)
                   : SPW_ERR_INVALID_STATE;
    }

    Result wait(spw_ready_events_t interests,
                spw_ready_events_t& ready,
                Timeout timeout = immediate) noexcept {
        return handle_ != nullptr
                   ? spw_port_wait(handle_, interests, timeout, &ready)
                   : SPW_ERR_INVALID_STATE;
    }

""",
          )

          # Core C edge validation: readiness is unsupported on loopback, but
          # input validation and deterministic output clearing are universal.
          replace_once(
              "tests/public_edge_cases.c",
              """    spw_statistics_t stats = {0};
    uint8_t byte = 0x42u;
""",
              """    spw_statistics_t stats = {0};
    spw_ready_events_t ready = SPW_READY_ALL;
    uint8_t byte = 0x42u;
""",
          )
          replace_once(
              "tests/public_edge_cases.c",
              """    assert(spw_port_get_capabilities(NULL, &caps) == SPW_ERR_INVALID_ARGUMENT);
    assert(spw_port_get_capabilities(port, NULL) == SPW_ERR_INVALID_ARGUMENT);
""",
              """    assert(spw_port_get_capabilities(NULL, &caps) == SPW_ERR_INVALID_ARGUMENT);
    assert(spw_port_get_capabilities(port, NULL) == SPW_ERR_INVALID_ARGUMENT);
    assert(spw_port_wait(NULL, SPW_READY_RX_PACKET, 0u, &ready) == SPW_ERR_INVALID_ARGUMENT);
    assert(spw_port_wait(port, SPW_READY_NONE, 0u, &ready) == SPW_ERR_INVALID_ARGUMENT);
    assert(spw_port_wait(port, (spw_ready_events_t)(1u << 31), 0u, &ready) == SPW_ERR_INVALID_ARGUMENT);
    assert(spw_port_wait(port, SPW_READY_RX_PACKET, 0u, NULL) == SPW_ERR_INVALID_ARGUMENT);
""",
          )
          replace_once(
              "tests/public_edge_cases.c",
              """    assert(spw_port_get_capabilities(port, &caps) == SPW_OK);
    assert(caps.max_packet_size > 0u && caps.max_packet_size <= TEST_STORAGE_SIZE);
""",
              """    assert(spw_port_get_capabilities(port, &caps) == SPW_OK);
    assert(caps.max_packet_size > 0u && caps.max_packet_size <= TEST_STORAGE_SIZE);
    assert((caps.bits & SPW_CAP_READINESS) == 0u);
    ready = SPW_READY_ALL;
    assert(spw_port_wait(port, SPW_READY_RX_PACKET, SPW_TIMEOUT_IMMEDIATE, &ready) ==
           SPW_ERR_UNSUPPORTED);
    assert(ready == SPW_READY_NONE);
""",
          )

          # Shared contract: capability-gated readiness must be non-consuming
          # for both packets and time codes.
          contract = "tests/contract/contract_suite.cpp"
          bounded_marker = """void test_bounded_queue(BackendContractFixture& fixture,
"""
          readiness_test = r'''void test_readiness(BackendContractFixture& fixture,
                    const spw_capabilities_t& caps_a,
                    const spw_capabilities_t& caps_b) {
    constexpr const char* test = "readiness";
    if ((caps_a.bits & SPW_CAP_READINESS) == 0u ||
        (caps_b.bits & SPW_CAP_READINESS) == 0u) {
        std::cout << "[contract][SKIP] " << test
                  << ": capability not advertised\n";
        return;
    }

    prepare_running(fixture, test);

    spw_ready_events_t ready = SPW_READY_ALL;
    require_result(spw_port_wait(fixture.endpoint_b(), SPW_READY_RX_PACKET,
                                 SPW_TIMEOUT_IMMEDIATE, &ready),
                   SPW_ERR_TIMEOUT, test,
                   "empty packet readiness did not time out");
    require(ready == SPW_READY_NONE, test,
            "timeout returned spurious readiness bits");

    std::uint8_t tx[] = {0x52u, 0x44u, 0x59u};
    std::uint8_t rx[sizeof(tx)]{};
    send_packet(fixture.endpoint_a(), tx, sizeof(tx), SPW_TERMINATOR_EOP, test);

    require_result(spw_port_wait(fixture.endpoint_b(), SPW_READY_RX_PACKET,
                                 g_transfer_timeout_us, &ready),
                   SPW_OK, test, "packet readiness wait failed");
    require(ready == SPW_READY_RX_PACKET, test,
            "packet readiness returned wrong event bits");

    ready = SPW_READY_NONE;
    require_result(spw_port_wait(fixture.endpoint_b(), SPW_READY_RX_PACKET,
                                 SPW_TIMEOUT_IMMEDIATE, &ready),
                   SPW_OK, test, "packet readiness was consumed by wait");
    require(ready == SPW_READY_RX_PACKET, test,
            "level-triggered packet readiness was not preserved");

    receive_packet(fixture.endpoint_b(), rx, sizeof(rx), sizeof(tx),
                   SPW_TERMINATOR_EOP, test);
    require(std::memcmp(tx, rx, sizeof(tx)) == 0, test,
            "readiness packet payload mismatch");

    ready = SPW_READY_ALL;
    require_result(spw_port_wait(fixture.endpoint_b(), SPW_READY_RX_PACKET,
                                 SPW_TIMEOUT_IMMEDIATE, &ready),
                   SPW_ERR_TIMEOUT, test,
                   "packet readiness remained set after receive");
    require(ready == SPW_READY_NONE, test,
            "drained packet reported readiness");

    if ((caps_a.bits & SPW_CAP_TIME_CODE) != 0u &&
        (caps_b.bits & SPW_CAP_TIME_CODE) != 0u) {
        spw_time_code_t sent{23u, 0u};
        spw_time_code_t received{};
        require_result(spw_port_send_time_code(fixture.endpoint_a(), &sent,
                                               g_transfer_timeout_us),
                       SPW_OK, test, "time-code send failed");

        require_result(spw_port_wait(fixture.endpoint_b(), SPW_READY_RX_TIME_CODE,
                                     g_transfer_timeout_us, &ready),
                       SPW_OK, test, "time-code readiness wait failed");
        require(ready == SPW_READY_RX_TIME_CODE, test,
                "time-code readiness returned wrong event bits");

        ready = SPW_READY_NONE;
        require_result(spw_port_wait(fixture.endpoint_b(), SPW_READY_RX_TIME_CODE,
                                     SPW_TIMEOUT_IMMEDIATE, &ready),
                       SPW_OK, test, "time-code readiness was consumed by wait");
        require(ready == SPW_READY_RX_TIME_CODE, test,
                "level-triggered time-code readiness was not preserved");

        require_result(spw_port_receive_time_code(fixture.endpoint_b(), &received,
                                                  g_transfer_timeout_us),
                       SPW_OK, test, "time-code receive failed after wait");
        require(received.time_count == sent.time_count &&
                    received.control_flags == sent.control_flags,
                test, "readiness time-code content mismatch");
    }
}

'''
          replace_once(contract, bounded_marker, readiness_test + bounded_marker)
          replace_once(
              contract,
              """    test_timeout_and_nonblocking(fixture);
    test_bounded_queue(fixture, caps_a, caps_b);
""",
              """    test_timeout_and_nonblocking(fixture);
    test_readiness(fixture, caps_a, caps_b);
    test_bounded_queue(fixture, caps_a, caps_b);
""",
          )

          # Keep the device workflow sensitive to public readiness and shared
          # contract changes, not merely device-specific fixture changes.
          p = Path(".github/workflows/device.yml")
          text = p.read_text()
          old = '      - "include/spwkit/config.h"\n'
          if text.count(old) != 2:
              raise SystemExit("device workflow: unexpected config.h path count")
          text = text.replace(
              old,
              old + '      - "include/spwkit/port.h"\n      - "include/spwkit/types.h"\n',
          )
          old = '      - "tests/contract/device_contract.cpp"\n'
          if text.count(old) != 2:
              raise SystemExit("device workflow: unexpected device contract path count")
          text = text.replace(
              old,
              '      - "tests/contract/contract_suite.cpp"\n'
              '      - "tests/contract/contract_suite.hpp"\n' + old,
          )
          p.write_text(text)

          # Document the abstraction boundary: public readiness, private poll().
          replace_once(
              "README.md",
              """The device path preserves logical packet boundaries, EOP/EEP, zero-length packets, time codes, receive-too-small retry, statistics, peer loss and fresh-process restart recovery. CI runs the full path using pure C with `CXX=/bin/false`, plus the optional C++ wrapper over the exact same backend.
""",
              """The device path preserves logical packet boundaries, EOP/EEP, zero-length packets, time codes, receive-too-small retry, statistics, peer loss and fresh-process restart recovery. It also advertises `SPW_CAP_READINESS`: `spw_port_wait()` can wait for packet/time-code receive readiness without consuming the pending event and without exposing a file descriptor or Linux polling type. CI runs the full path using pure C with `CXX=/bin/false`, plus the optional C++ wrapper over the exact same backend.
""",
          )
          replace_once(
              "docs/vspwd.md",
              """- `spw_port_send_time_code/receive_time_code()` -> VSPD time-code events;
- statistics -> daemon per-port statistics;
""",
              """- `spw_port_send_time_code/receive_time_code()` -> VSPD time-code events;
- `spw_port_wait()` -> level-triggered, non-consuming packet/time-code readiness;
- statistics -> daemon per-port statistics;
""",
          )
          replace_once(
              "docs/vspwd.md",
              """The backend is cooperative and has no mandatory worker thread. Synchronous requests may receive asynchronous DATA/TIME_CODE/LINK_STATE events first; those are serviced internally until the requested operation can complete.
""",
              """The backend is cooperative and has no mandatory worker thread. Synchronous requests may receive asynchronous DATA/TIME_CODE/LINK_STATE events first; those are serviced internally until the requested operation can complete. Readiness uses the same bounded event service path and existing packet/time-code caches: `spw_port_wait()` reports only requested receive events, leaves them available to the normal receive APIs, and keeps Linux `poll()`/socket descriptors private to the backend.
""",
          )
          PY

      - name: Remove patch workflow and publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-readiness-patch.yml
          git config user.name "Robert A Incze"
          git config user.email "98164670+Inczert@users.noreply.github.com"
          git add src/backends/device/device_backend.c \
                  include/spwkit/spwkit.hpp \
                  tests/public_edge_cases.c \
                  tests/contract/contract_suite.cpp \
                  .github/workflows/device.yml \
                  README.md docs/vspwd.md
          git commit -m "feat(spwkit): implement backend-neutral receive readiness"
          git push origin HEAD:agent/develop
