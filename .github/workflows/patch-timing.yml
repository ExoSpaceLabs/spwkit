name: Patch virtual link timing

on:
  push:
    branches: [agent/v0.2-virtual-link-timing]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v0.2-virtual-link-timing
      - name: Patch UDP backend
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Build and test
        shell: bash
        run: |
          cmake -S . -B build -DSPWKIT_BUILD_TESTS=ON -DSPWKIT_BUILD_EXAMPLES=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit backend integration
        shell: bash
        run: |
          rm .github/workflows/patch-timing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(spwkit): integrate virtual link timing #29"
          git push origin HEAD:agent/v0.2-virtual-link-timing
