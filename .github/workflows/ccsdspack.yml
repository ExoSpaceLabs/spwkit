name: CCSDSPack 2.x integration

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "src/**"
      - "integrations/ccsdspack_v2/**"
      - ".github/workflows/ccsdspack.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "src/**"
      - "integrations/ccsdspack_v2/**"
      - ".github/workflows/ccsdspack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-packet-transport:
    name: Installed CCSDSPack v2 + SpWKit transport
    runs-on: ubuntu-24.04
    env:
      CCSDSPACK_TAG: v2.0.0
      CCSDSPACK_SHA: c2f318c330c564429bcc565a8acbff22728b2851

    steps:
      - name: Checkout SpWKit
        uses: actions/checkout@v6

      - name: Checkout immutable CCSDSPack release
        uses: actions/checkout@v6
        with:
          repository: ExoSpaceLabs/CCSDSPack
          ref: ${{ env.CCSDSPACK_TAG }}
          path: .deps/CCSDSPack
          fetch-depth: 1

      - name: Verify CCSDSPack release pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .deps/CCSDSPack rev-parse HEAD)" = "$CCSDSPACK_SHA"
          grep -q 'set(MAJOR "2")' .deps/CCSDSPack/CMakeLists.txt
          grep -q 'set(MINOR "0")' .deps/CCSDSPack/CMakeLists.txt
          grep -q 'set(PATCH "0")' .deps/CCSDSPack/CMakeLists.txt

      - name: Build and install CCSDSPack v2
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .deps/CCSDSPack -B build-ccsdspack \
            -DCMAKE_BUILD_TYPE=Release \
            -DCCSDSPACK_BUILD_MCU=OFF
          cmake --build build-ccsdspack --parallel
          cmake --install build-ccsdspack --prefix "$PWD/install-ccsdspack"

      - name: Build and install SpWKit hosted integration profile
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-spwkit \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_BUILD_CUSE=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=ON
          cmake --build build-spwkit --parallel
          cmake --install build-spwkit --prefix "$PWD/install-spwkit"
          test -x "$PWD/install-spwkit/bin/vspwd"

      - name: Build standalone installed-package integration peer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S integrations/ccsdspack_v2 -B build-integration \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-spwkit;$PWD/install-ccsdspack"
          cmake --build build-integration --parallel

      - name: Transport PUS-C TC/TM bytes over independent UDP peers
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/install-spwkit/lib:$PWD/install-ccsdspack/lib:${LD_LIBRARY_PATH:-}"
          peer="$PWD/build-integration/spwkit_ccsdspack_v2_peer"
          tmpdir="$(mktemp -d)"
          a_pid=""
          cleanup() {
            set +e
            [[ -n "$a_pid" ]] && kill "$a_pid" 2>/dev/null || true
            [[ -n "$a_pid" ]] && wait "$a_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          timeout 20s "$peer" udp A 24190 24191 >"$tmpdir/a.log" 2>&1 & a_pid=$!
          sleep 0.10
          timeout 20s "$peer" udp B 24191 24190 >"$tmpdir/b.log" 2>&1 || {
            cat "$tmpdir/a.log" "$tmpdir/b.log"
            exit 1
          }
          wait "$a_pid" || {
            cat "$tmpdir/a.log" "$tmpdir/b.log"
            exit 1
          }
          a_pid=""
          cat "$tmpdir/a.log" "$tmpdir/b.log"
          grep -q 'PASS backend=udp id=A tx=PUS:revC:TC rx=PUS:revC:TM' "$tmpdir/a.log"
          grep -q 'PASS backend=udp id=B tx=PUS:revC:TM rx=PUS:revC:TC' "$tmpdir/b.log"

      - name: Transport the same PUS-C bytes over Linux DEVICE/VSPD
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/install-spwkit/lib:$PWD/install-ccsdspack/lib:${LD_LIBRARY_PATH:-}"
          peer="$PWD/build-integration/spwkit_ccsdspack_v2_peer"
          daemon="$PWD/install-spwkit/bin/vspwd"
          tmpdir="$(mktemp -d)"
          socket="$tmpdir/vspwd.sock"
          daemon_pid=""
          a_pid=""
          cleanup() {
            set +e
            [[ -n "$a_pid" ]] && kill "$a_pid" 2>/dev/null || true
            [[ -n "$a_pid" ]] && wait "$a_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && kill -TERM "$daemon_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && wait "$daemon_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          "$daemon" --socket "$socket" >"$tmpdir/vspwd.log" 2>&1 & daemon_pid=$!
          for _ in $(seq 1 100); do
            [[ -S "$socket" ]] && break
            sleep 0.02
          done
          [[ -S "$socket" ]] || {
            cat "$tmpdir/vspwd.log"
            exit 1
          }

          timeout 20s "$peer" device A "$socket" >"$tmpdir/a.log" 2>&1 & a_pid=$!
          sleep 0.10
          timeout 20s "$peer" device B "$socket" >"$tmpdir/b.log" 2>&1 || {
            cat "$tmpdir/vspwd.log" "$tmpdir/a.log" "$tmpdir/b.log"
            exit 1
          }
          wait "$a_pid" || {
            cat "$tmpdir/vspwd.log" "$tmpdir/a.log" "$tmpdir/b.log"
            exit 1
          }
          a_pid=""
          cat "$tmpdir/a.log" "$tmpdir/b.log"
          grep -q 'PASS backend=device id=A tx=PUS:revC:TC rx=PUS:revC:TM' "$tmpdir/a.log"
          grep -q 'PASS backend=device id=B tx=PUS:revC:TM rx=PUS:revC:TC' "$tmpdir/b.log"
