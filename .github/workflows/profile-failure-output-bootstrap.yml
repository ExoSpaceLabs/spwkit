name: Profile campaign failure-output bootstrap

on:
  push:
    branches:
      - fix/profile-campaign-failure-output
    paths:
      - .github/workflows/profile-failure-output-bootstrap.yml
      - scripts/apply_profile_failure_output.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/profile-campaign-failure-output
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_profile_failure_output.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          bash -n benchmarks/run_profile_campaign.sh
          grep -q 'run_campaign_step "UDP $direction comparison"' benchmarks/run_profile_campaign.sh
          grep -q 'Partial results preserved at:' benchmarks/run_profile_campaign.sh
          if grep -q '> /dev/null' benchmarks/run_profile_campaign.sh; then exit 1; fi

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/run_profile_campaign.sh
          git commit -m "fix(spwkit): report profiling campaign failures"
          git push origin HEAD:fix/profile-campaign-failure-output
