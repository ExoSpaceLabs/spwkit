name: Bootstrap UDP readiness portability fix

on:
  pull_request:
    branches:
      - develop
    paths:
      - scripts/bootstrap_udp_readiness_portability.py
      - .github/workflows/bootstrap-udp-readiness-portability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: perf/udp-readiness-fast-path
      - name: Apply guarded portability patch
        shell: bash
        run: |
          if [[ ! -f scripts/bootstrap_udp_readiness_portability.py ]]; then
            echo "Patch script already consumed."
            exit 0
          fi
          python3 scripts/bootstrap_udp_readiness_portability.py
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          if [[ ! -f scripts/bootstrap_udp_readiness_portability.py ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backends/ethernet/udp_backend.c
          git rm scripts/bootstrap_udp_readiness_portability.py
          git commit -m "fix(spwkit): preserve portable UDP readiness semantics"
          git push origin HEAD:perf/udp-readiness-fast-path
