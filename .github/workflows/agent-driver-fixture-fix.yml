name: Agent driver fixture fix

on:
  push:
    branches: [agent/driver-dma]
    paths: [.github/workflows/agent-driver-fixture-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/driver-dma
          fetch-depth: 0
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/driver_backend.c')
          text = p.read_text()
          text = text.replace(
              '    fake_get_statistics, fake_clear_statistics,\n    fake_wait\n};',
              '    fake_get_statistics, fake_clear_statistics,\n    fake_wait,\n    NULL, NULL, NULL, NULL, NULL, NULL, NULL\n};',
              1)
          text = text.replace(
              '    fake_get_statistics, fake_clear_statistics,\n    NULL\n};',
              '    fake_get_statistics, fake_clear_statistics,\n    NULL,\n    NULL, NULL, NULL, NULL, NULL, NULL, NULL\n};',
              1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/driver_backend.c
          git commit -m "fix(spwkit): initialize driver dma fixture callbacks"
          git push origin HEAD:agent/driver-dma
