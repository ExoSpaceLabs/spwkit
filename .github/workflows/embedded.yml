name: Embedded portability

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/core/**"
      - "src/backends/loopback/**"
      - "src/backends/device/**"
      - "tests/embedded/**"
      - ".github/workflows/embedded.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/core/**"
      - "src/backends/loopback/**"
      - "src/backends/device/**"
      - "tests/embedded/**"
      - ".github/workflows/embedded.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freestanding-c:
    name: Freestanding C/no-heap compile
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure freestanding C profile
        env:
          CC: gcc
          CXX: /bin/false
        run: |
          cmake -S . -B build-embedded-smoke \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=OFF \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=OFF \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-ffreestanding -fno-builtin -Wall -Wextra -Werror"

          if grep -q '^CMAKE_CXX_COMPILER:' build-embedded-smoke/CMakeCache.txt; then
            echo "Embedded C profile unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build freestanding C archive
        run: cmake --build build-embedded-smoke --parallel

      - name: Reject hosted runtime references in portable core archive
        run: |
          archive="build-embedded-smoke/libspwkit.a"
          test -f "$archive"
          if nm -u "$archive" | grep -Eq '(pthread_|socket|sendto|recvfrom|poll|WSA|__cxa|_Z)'; then
            echo "Portable embedded profile contains hosted/C++ runtime references" >&2
            nm -u "$archive"
            exit 1
          fi

      - name: Note real-target boundary
        run: |
          echo "### Embedded portability" >> "$GITHUB_STEP_SUMMARY"
          echo "This gate is a real freestanding C/no-heap compile, not target-HIL evidence." >> "$GITHUB_STEP_SUMMARY"
          echo "The VSPD codec is included because protocol encoding must remain portable C; the Linux socket transport and vspwd service are explicitly disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "ARM/HardRT target toolchains remain v0.5 work and will be added as separate jobs." >> "$GITHUB_STEP_SUMMARY"
