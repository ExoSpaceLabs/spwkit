                  src/core/port.c src/backends/driver CMakeLists.txt tests/CMakeLists.txt \
                  tests/driver_backend.c docs/driver-backend.md CHANGELOG.md
          git commit -m "feat(spwkit): add portable hardware driver backend"
          git push origin HEAD:agent/driver-backend
