name: Agent driver backend patch

on:
  push:
    branches:
      - agent/driver-backend
    paths:
      - .github/workflows/agent-driver-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/driver-backend
          fetch-depth: 0
      - name: Apply driver backend patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "include/spwkit/config.h",
              "#define SPW_BACKEND_DEVICE    ((spw_backend_id_t)4u)\n",
              "#define SPW_BACKEND_DEVICE    ((spw_backend_id_t)4u)\n#define SPW_BACKEND_DRIVER    ((spw_backend_id_t)5u)\n")

          replace(
              "include/spwkit/spwkit.h",
              "#include \"spwkit/device.h\"\n",
              "#include \"spwkit/device.h\"\n#include \"spwkit/driver.h\"\n")

          replace(
              "src/core/port.c",
              "#include <spwkit/device.h>\n",
              "#include <spwkit/device.h>\n#include <spwkit/driver.h>\n")
          replace(
              "src/core/port.c",
              "#include \"backends/loopback/loopback_backend.h\"\n",
              "#include \"backends/driver/driver_backend.h\"\n#include \"backends/loopback/loopback_backend.h\"\n")
          replace(
              "src/core/port.c",
              "static spw_result_t validate_simulator_config(const spw_port_config_t* config) {\n",
              "static spw_result_t validate_driver_config(const spw_port_config_t* config) {\n"
              "    const spw_driver_config_t* driver;\n"
              "    const spw_driver_ops_t* ops;\n"
              "    if (config->backend_config == NULL ||\n"
              "        config->backend_config_size < sizeof(spw_driver_config_t)) {\n"
              "        return SPW_ERR_INVALID_ARGUMENT;\n"
              "    }\n"
              "    driver = (const spw_driver_config_t*)config->backend_config;\n"
              "    if (driver->struct_size < sizeof(spw_driver_config_t)) {\n"
              "        return SPW_ERR_INVALID_ARGUMENT;\n"
              "    }\n"
              "    if (driver->version != SPW_DRIVER_CONFIG_VERSION) {\n"
              "        return SPW_ERR_UNSUPPORTED;\n"
              "    }\n"
              "    if (driver->reserved != 0u || driver->ops == NULL) {\n"
              "        return SPW_ERR_INVALID_ARGUMENT;\n"
              "    }\n"
              "    ops = driver->ops;\n"
              "    if (ops->struct_size < sizeof(spw_driver_ops_t)) {\n"
              "        return SPW_ERR_INVALID_ARGUMENT;\n"
              "    }\n"
              "    if (ops->version != SPW_DRIVER_OPS_VERSION) {\n"
              "        return SPW_ERR_UNSUPPORTED;\n"
              "    }\n"
              "    if (ops->start == NULL || ops->stop == NULL || ops->reset == NULL ||\n"
              "        ops->get_link_state == NULL || ops->get_capabilities == NULL ||\n"
              "        ops->send == NULL || ops->receive == NULL) {\n"
              "        return SPW_ERR_INVALID_ARGUMENT;\n"
              "    }\n"
              "    return SPW_OK;\n"
              "}\n\n"
              "static spw_result_t validate_simulator_config(const spw_port_config_t* config) {\n")
          replace(
              "src/core/port.c",
              "    case SPW_BACKEND_DEVICE:\n"
              "        result = validate_device_config(config);\n"
              "        if (result != SPW_OK) {\n"
              "            return result;\n"
              "        }\n"
              "#ifdef SPWKIT_HAS_DEVICE\n"
              "        *out_factory = spw_device_backend_factory();\n"
              "        return SPW_OK;\n"
              "#else\n"
              "        return SPW_ERR_UNSUPPORTED;\n"
              "#endif\n\n"
              "    default:\n",
              "    case SPW_BACKEND_DEVICE:\n"
              "        result = validate_device_config(config);\n"
              "        if (result != SPW_OK) {\n"
              "            return result;\n"
              "        }\n"
              "#ifdef SPWKIT_HAS_DEVICE\n"
              "        *out_factory = spw_device_backend_factory();\n"
              "        return SPW_OK;\n"
              "#else\n"
              "        return SPW_ERR_UNSUPPORTED;\n"
              "#endif\n\n"
              "    case SPW_BACKEND_DRIVER: {\n"
              "        const spw_driver_config_t* driver;\n"
              "        result = validate_driver_config(config);\n"
              "        if (result != SPW_OK) {\n"
              "            return result;\n"
              "        }\n"
              "        driver = (const spw_driver_config_t*)config->backend_config;\n"
              "        *out_factory = spw_driver_backend_factory(driver->ops->wait != NULL);\n"
              "        return SPW_OK;\n"
              "    }\n\n"
              "    default:\n")

          replace(
              "CMakeLists.txt",
              "    src/core/port.c\n    src/backends/loopback/loopback_backend.c\n",
              "    src/core/port.c\n    src/backends/driver/driver_backend.c\n    src/backends/loopback/loopback_backend.c\n")

          with Path("tests/CMakeLists.txt").open("a") as f:
              f.write("\n# Portable hardware-driver adapter contract.\n")
              f.write("add_executable(spwkit_driver_backend driver_backend.c)\n")
              f.write("target_link_libraries(spwkit_driver_backend PRIVATE spwkit::spwkit)\n")
              f.write("target_compile_features(spwkit_driver_backend PRIVATE c_std_11)\n")
              f.write("set_target_properties(spwkit_driver_backend PROPERTIES C_STANDARD 11 C_STANDARD_REQUIRED YES C_EXTENSIONS OFF)\n")
              f.write("add_test(NAME driver_backend COMMAND spwkit_driver_backend)\n")

          replace(
              "CHANGELOG.md",
              "### Added\n\n",
              "### Added\n\n- portable `SPW_BACKEND_DRIVER` callback boundary for caller/vendor-owned SpaceWire hardware drivers, preserving the normal `spw_port_*` lifecycle and copied packet/time-code/readiness/statistics semantics without exposing native handles (#110);\n")
          PY

          mkdir -p src/backends/driver

          cat > include/spwkit/driver.h <<'EOF'
          // SPDX-License-Identifier: Apache-2.0
          #ifndef SPWKIT_DRIVER_H
          #define SPWKIT_DRIVER_H

          #include <stddef.h>
          #include <stdint.h>

          #include "spwkit/types.h"

          #ifdef __cplusplus
          extern "C" {
          #endif

          #define SPW_DRIVER_OPS_VERSION 1u
          #define SPW_DRIVER_CONFIG_VERSION 1u

          /**
           * Portable hardware-driver callback table.
           *
           * The callback table and driver_context are owned by the caller/vendor
           * driver and must remain valid until the SpWKit port is closed. No POSIX,
           * Winsock, MMIO, DMA or interrupt handle type appears in this ABI.
           *
           * Lifecycle, copied packet I/O, link state and capabilities are required.
           * Time-code, statistics and readiness callbacks are optional and must agree
           * with the capability bits returned by get_capabilities().
           */
          typedef struct spw_driver_ops {
              uint32_t struct_size;
              uint32_t version;

              spw_result_t (*start)(void* driver_context);
              spw_result_t (*stop)(void* driver_context);
              spw_result_t (*reset)(void* driver_context);

              spw_result_t (*get_link_state)(const void* driver_context,
                                             spw_link_state_t* out_state);
              spw_result_t (*get_capabilities)(const void* driver_context,
                                               spw_capabilities_t* out_capabilities);

              spw_result_t (*send)(void* driver_context,
                                   const spw_packet_t* packet,
                                   spw_timeout_us_t timeout_us);
              spw_result_t (*receive)(void* driver_context,
                                      spw_packet_t* packet,
                                      spw_timeout_us_t timeout_us);

              spw_result_t (*send_time_code)(void* driver_context,
                                             const spw_time_code_t* time_code,
                                             spw_timeout_us_t timeout_us);
              spw_result_t (*receive_time_code)(void* driver_context,
                                                spw_time_code_t* time_code,
                                                spw_timeout_us_t timeout_us);

              spw_result_t (*get_statistics)(const void* driver_context,
                                             spw_statistics_t* out_statistics);
              spw_result_t (*clear_statistics)(void* driver_context);

              /** Optional level-triggered, non-consuming receive readiness. */
              spw_result_t (*wait)(void* driver_context,
                                   spw_ready_events_t interests,
                                   spw_timeout_us_t timeout_us,
                                   spw_ready_events_t* out_ready);
          } spw_driver_ops_t;

          typedef struct spw_driver_config {
              uint32_t struct_size;
              uint32_t version;
              const spw_driver_ops_t* ops;
              void* driver_context;
              uint32_t reserved;
          } spw_driver_config_t;

          #define SPW_DRIVER_OPS_INITIALIZER \
              { sizeof(spw_driver_ops_t), SPW_DRIVER_OPS_VERSION }

          #define SPW_DRIVER_CONFIG_INITIALIZER(ops_, context_) \
              { sizeof(spw_driver_config_t), SPW_DRIVER_CONFIG_VERSION, \
                (ops_), (context_), 0u }

          #ifdef __cplusplus
          } /* extern "C" */
          #endif

          #endif /* SPWKIT_DRIVER_H */
          EOF

          cat > src/backends/driver/driver_backend.h <<'EOF'
          // SPDX-License-Identifier: Apache-2.0
          #ifndef SPWKIT_INTERNAL_DRIVER_BACKEND_H
          #define SPWKIT_INTERNAL_DRIVER_BACKEND_H

          #include <stdbool.h>

          #include "core/backend_c.h"

          const spw_backend_factory_t* spw_driver_backend_factory(bool enable_wait);

          #endif /* SPWKIT_INTERNAL_DRIVER_BACKEND_H */
          EOF

          cat > src/backends/driver/driver_backend.c <<'EOF'
          // SPDX-License-Identifier: Apache-2.0

          #include "backends/driver/driver_backend.h"

          #include <spwkit/driver.h>

          #include <stdalign.h>
          #include <string.h>

          typedef struct spw_driver_backend {
              const spw_driver_ops_t* ops;
              void* driver_context;
          } spw_driver_backend_t;

          static spw_result_t driver_construct(void* raw,
                                               const spw_port_config_t* config) {
              spw_driver_backend_t* backend = (spw_driver_backend_t*)raw;
              const spw_driver_config_t* driver =
                  (const spw_driver_config_t*)config->backend_config;
              memset(backend, 0, sizeof(*backend));
              backend->ops = driver->ops;
              backend->driver_context = driver->driver_context;
              return SPW_OK;
          }

          static void driver_destroy(void* raw) {
              spw_driver_backend_t* backend = (spw_driver_backend_t*)raw;
              backend->ops = NULL;
              backend->driver_context = NULL;
          }

          static spw_result_t driver_start(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->start(b->driver_context);
          }

          static spw_result_t driver_stop(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->stop(b->driver_context);
          }

          static spw_result_t driver_reset(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->reset(b->driver_context);
          }

          static spw_result_t driver_get_link_state(const void* raw,
                                                    spw_link_state_t* out_state) {
              const spw_driver_backend_t* b = (const spw_driver_backend_t*)raw;
              return b->ops->get_link_state(b->driver_context, out_state);
          }

          static spw_result_t driver_get_capabilities(
              const void* raw,
              spw_capabilities_t* out_capabilities) {
              const spw_driver_backend_t* b = (const spw_driver_backend_t*)raw;
              spw_result_t result =
                  b->ops->get_capabilities(b->driver_context, out_capabilities);
              if (result != SPW_OK) {
                  return result;
              }
              if ((out_capabilities->bits & SPW_CAP_ZERO_COPY) != 0u) {
                  /* DMA/zero-copy mapping is the next driver-contract slice. */
                  return SPW_ERR_UNSUPPORTED;
              }
              if ((out_capabilities->bits & SPW_CAP_FAULT_INJECTION) != 0u) {
                  return SPW_ERR_UNSUPPORTED;
              }
              if ((out_capabilities->bits & SPW_CAP_TIME_CODE) != 0u &&
                  (b->ops->send_time_code == NULL ||
                   b->ops->receive_time_code == NULL)) {
                  return SPW_ERR_BACKEND;
              }
              if ((out_capabilities->bits & SPW_CAP_STATISTICS) != 0u &&
                  (b->ops->get_statistics == NULL ||
                   b->ops->clear_statistics == NULL)) {
                  return SPW_ERR_BACKEND;
              }
              if ((out_capabilities->bits & SPW_CAP_READINESS) != 0u &&
                  b->ops->wait == NULL) {
                  return SPW_ERR_BACKEND;
              }
              if (b->ops->wait == NULL) {
                  out_capabilities->bits &= ~SPW_CAP_READINESS;
              }
              return SPW_OK;
          }

          static bool driver_supports_zero_copy(const void* raw) {
              (void)raw;
              return false;
          }

          static spw_result_t driver_send(void* raw,
                                          const spw_packet_t* packet,
                                          spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->send(b->driver_context, packet, timeout_us);
          }

          static spw_result_t driver_receive(void* raw,
                                             spw_packet_t* packet,
                                             spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->receive(b->driver_context, packet, timeout_us);
          }

          static spw_result_t driver_send_time_code(void* raw,
                                                    const spw_time_code_t* code,
                                                    spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->send_time_code != NULL
                         ? b->ops->send_time_code(b->driver_context, code, timeout_us)
                         : SPW_ERR_UNSUPPORTED;
          }

          static spw_result_t driver_receive_time_code(void* raw,
                                                       spw_time_code_t* code,
                                                       spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->receive_time_code != NULL
                         ? b->ops->receive_time_code(b->driver_context, code, timeout_us)
                         : SPW_ERR_UNSUPPORTED;
          }

          static spw_result_t driver_get_statistics(
              const void* raw,
              spw_statistics_t* out_statistics) {
              const spw_driver_backend_t* b = (const spw_driver_backend_t*)raw;
              if (b->ops->get_statistics == NULL) {
                  memset(out_statistics, 0, sizeof(*out_statistics));
                  return SPW_ERR_UNSUPPORTED;
              }
              return b->ops->get_statistics(b->driver_context, out_statistics);
          }

          static spw_result_t driver_clear_statistics(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->clear_statistics != NULL
                         ? b->ops->clear_statistics(b->driver_context)
                         : SPW_ERR_UNSUPPORTED;
          }

          static spw_result_t driver_wait(void* raw,
                                          spw_ready_events_t interests,
                                          spw_timeout_us_t timeout_us,
                                          spw_ready_events_t* out_ready) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->wait != NULL
                         ? b->ops->wait(b->driver_context,
                                        interests,
                                        timeout_us,
                                        out_ready)
                         : SPW_ERR_UNSUPPORTED;
          }

          #define DRIVER_COMMON_OPS(wait_) \
              { driver_start, driver_stop, driver_reset, driver_get_link_state, \
                driver_get_capabilities, driver_supports_zero_copy, driver_send, \
                driver_receive, driver_send_time_code, driver_receive_time_code, \
                driver_get_statistics, driver_clear_statistics, NULL, NULL, NULL, \
                NULL, NULL, NULL, NULL, NULL, (wait_) }

          static const spw_backend_ops_t DRIVER_OPS = DRIVER_COMMON_OPS(NULL);
          static const spw_backend_ops_t DRIVER_WAIT_OPS =
              DRIVER_COMMON_OPS(driver_wait);

          static const spw_backend_factory_t DRIVER_FACTORY = {
              sizeof(spw_driver_backend_t),
              alignof(spw_driver_backend_t),
              driver_construct,
              driver_destroy,
              &DRIVER_OPS
          };

          static const spw_backend_factory_t DRIVER_WAIT_FACTORY = {
              sizeof(spw_driver_backend_t),
              alignof(spw_driver_backend_t),
              driver_construct,
              driver_destroy,
              &DRIVER_WAIT_OPS
          };

          const spw_backend_factory_t* spw_driver_backend_factory(bool enable_wait) {
              return enable_wait ? &DRIVER_WAIT_FACTORY : &DRIVER_FACTORY;
          }
          EOF

          cat > tests/driver_backend.c <<'EOF'
          // SPDX-License-Identifier: Apache-2.0

          #include <spwkit/spwkit.h>

          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>

          typedef struct fake_driver {
              spw_link_state_t state;
              bool advertise_readiness;
              bool packet_ready;
              bool time_code_ready;
              uint8_t packet[256];
              size_t packet_length;
              spw_terminator_t packet_terminator;
              spw_time_code_t time_code;
              spw_statistics_t statistics;
          } fake_driver_t;

          #define CHECK(expr) \
              do { \
                  if (!(expr)) { \
                      fprintf(stderr, "CHECK failed at %s:%d: %s\n", \
                              __FILE__, __LINE__, #expr); \
                      return 1; \
                  } \
              } while (0)

          static spw_result_t fake_start(void* raw) {
              fake_driver_t* d = (fake_driver_t*)raw;
              d->state = SPW_LINK_RUN;
              return SPW_OK;
          }

          static spw_result_t fake_stop(void* raw) {
              fake_driver_t* d = (fake_driver_t*)raw;
              d->state = SPW_LINK_READY;
              return SPW_OK;
          }

          static spw_result_t fake_reset(void* raw) {
              fake_driver_t* d = (fake_driver_t*)raw;
              d->state = SPW_LINK_ERROR_RESET;
              d->packet_ready = false;
              d->time_code_ready = false;
              return SPW_OK;
          }

          static spw_result_t fake_get_link_state(const void* raw,
                                                  spw_link_state_t* out_state) {
              const fake_driver_t* d = (const fake_driver_t*)raw;
              *out_state = d->state;
              return SPW_OK;
          }

          static spw_result_t fake_get_capabilities(
              const void* raw,
              spw_capabilities_t* out_capabilities) {
              const fake_driver_t* d = (const fake_driver_t*)raw;
              memset(out_capabilities, 0, sizeof(*out_capabilities));
              out_capabilities->bits = SPW_CAP_EEP | SPW_CAP_TIME_CODE |
                                       SPW_CAP_LINK_CONTROL | SPW_CAP_STATISTICS;
              if (d->advertise_readiness) {
                  out_capabilities->bits |= SPW_CAP_READINESS;
              }
              out_capabilities->max_packet_size = sizeof(d->packet);
              out_capabilities->tx_queue_depth = 1u;
              out_capabilities->rx_queue_depth = 1u;
              out_capabilities->buffer_alignment = 1u;
              return SPW_OK;
          }

          static spw_result_t fake_send(void* raw,
                                        const spw_packet_t* packet,
                                        spw_timeout_us_t timeout_us) {
              fake_driver_t* d = (fake_driver_t*)raw;
              (void)timeout_us;
              if (d->state != SPW_LINK_RUN) {
                  return SPW_ERR_INVALID_STATE;
              }
              if (d->packet_ready) {
                  return SPW_ERR_RESOURCE_EXHAUSTED;
              }
              if (packet->length > sizeof(d->packet)) {
                  return SPW_ERR_INVALID_PACKET;
              }
              if (packet->length != 0u && packet->data == NULL) {
                  return SPW_ERR_INVALID_ARGUMENT;
              }
              if (packet->length != 0u) {
                  memcpy(d->packet, packet->data, packet->length);
              }
              d->packet_length = packet->length;
              d->packet_terminator = packet->terminator;
              d->packet_ready = true;
              ++d->statistics.tx_packets;
              d->statistics.tx_bytes += packet->length;
              if (packet->terminator == SPW_TERMINATOR_EEP) {
                  ++d->statistics.eep_packets;
              }
              return SPW_OK;
          }

          static spw_result_t fake_receive(void* raw,
                                           spw_packet_t* packet,
                                           spw_timeout_us_t timeout_us) {
              fake_driver_t* d = (fake_driver_t*)raw;
              (void)timeout_us;
              if (d->state != SPW_LINK_RUN) {
                  return SPW_ERR_INVALID_STATE;
              }
              if (!d->packet_ready) {
                  return SPW_ERR_TIMEOUT;
              }
              packet->length = d->packet_length;
              packet->terminator = d->packet_terminator;
              if (packet->capacity < d->packet_length) {
                  return SPW_ERR_BUFFER_TOO_SMALL;
              }
              if (d->packet_length != 0u && packet->data == NULL) {
                  return SPW_ERR_INVALID_ARGUMENT;
              }
              if (d->packet_length != 0u) {
                  memcpy(packet->data, d->packet, d->packet_length);
              }
              d->packet_ready = false;
              ++d->statistics.rx_packets;
              d->statistics.rx_bytes += d->packet_length;
              return SPW_OK;
          }

          static spw_result_t fake_send_time_code(void* raw,
                                                  const spw_time_code_t* code,
                                                  spw_timeout_us_t timeout_us) {
              fake_driver_t* d = (fake_driver_t*)raw;
              (void)timeout_us;
              if (d->state != SPW_LINK_RUN) {
                  return SPW_ERR_INVALID_STATE;
              }
              if (d->time_code_ready) {
                  return SPW_ERR_RESOURCE_EXHAUSTED;
              }
              d->time_code = *code;
              d->time_code_ready = true;
              ++d->statistics.tx_time_codes;
              return SPW_OK;
          }

          static spw_result_t fake_receive_time_code(void* raw,
                                                     spw_time_code_t* code,
                                                     spw_timeout_us_t timeout_us) {
              fake_driver_t* d = (fake_driver_t*)raw;
              (void)timeout_us;
              if (d->state != SPW_LINK_RUN) {
                  return SPW_ERR_INVALID_STATE;
              }
              if (!d->time_code_ready) {
                  return SPW_ERR_TIMEOUT;
              }
              *code = d->time_code;
              d->time_code_ready = false;
              ++d->statistics.rx_time_codes;
              return SPW_OK;
          }

          static spw_result_t fake_get_statistics(
              const void* raw,
              spw_statistics_t* out_statistics) {
              const fake_driver_t* d = (const fake_driver_t*)raw;
              *out_statistics = d->statistics;
              return SPW_OK;
          }

          static spw_result_t fake_clear_statistics(void* raw) {
              fake_driver_t* d = (fake_driver_t*)raw;
              memset(&d->statistics, 0, sizeof(d->statistics));
              return SPW_OK;
          }

          static spw_result_t fake_wait(void* raw,
                                        spw_ready_events_t interests,
                                        spw_timeout_us_t timeout_us,
                                        spw_ready_events_t* out_ready) {
              fake_driver_t* d = (fake_driver_t*)raw;
              spw_ready_events_t ready = SPW_READY_NONE;
              (void)timeout_us;
              if (d->packet_ready) {
                  ready |= SPW_READY_RX_PACKET;
              }
              if (d->time_code_ready) {
                  ready |= SPW_READY_RX_TIME_CODE;
              }
              *out_ready = ready & interests;
              return *out_ready != SPW_READY_NONE ? SPW_OK : SPW_ERR_TIMEOUT;
          }

          static const spw_driver_ops_t FAKE_OPS = {
              sizeof(spw_driver_ops_t), SPW_DRIVER_OPS_VERSION,
              fake_start, fake_stop, fake_reset,
              fake_get_link_state, fake_get_capabilities,
              fake_send, fake_receive,
              fake_send_time_code, fake_receive_time_code,
              fake_get_statistics, fake_clear_statistics,
              fake_wait
          };

          static const spw_driver_ops_t FAKE_OPS_NO_WAIT = {
              sizeof(spw_driver_ops_t), SPW_DRIVER_OPS_VERSION,
              fake_start, fake_stop, fake_reset,
              fake_get_link_state, fake_get_capabilities,
              fake_send, fake_receive,
              fake_send_time_code, fake_receive_time_code,
              fake_get_statistics, fake_clear_statistics,
              NULL
          };

          typedef union workspace_storage {
              long double align_long_double;
              void* align_pointer;
              uint64_t align_integer;
              unsigned char bytes[2048];
          } workspace_storage_t;

          static int run_driver(bool with_wait) {
              fake_driver_t driver;
              spw_driver_config_t driver_config;
              spw_port_config_t config = SPW_PORT_CONFIG_INITIALIZER(SPW_BACKEND_DRIVER);
              spw_port_workspace_requirements_t requirements;
              workspace_storage_t workspace;
              spw_port_t* port = NULL;
              spw_capabilities_t capabilities;
              const uint8_t tx_data[] = {0x10u, 0x20u, 0x30u};
              uint8_t rx_data[3] = {0u, 0u, 0u};
              uint8_t short_data[2] = {0u, 0u};
              spw_packet_t tx = {(uint8_t*)tx_data, sizeof(tx_data), sizeof(tx_data),
                                 SPW_TERMINATOR_EEP};
              spw_packet_t short_rx = {short_data, 0u, sizeof(short_data),
                                       SPW_TERMINATOR_EOP};
              spw_packet_t rx = {rx_data, 0u, sizeof(rx_data), SPW_TERMINATOR_EOP};
              spw_time_code_t tx_code = {17u, 0u};
              spw_time_code_t rx_code = {0u, 0u};
              spw_statistics_t statistics;
              spw_ready_events_t ready = SPW_READY_NONE;

              memset(&driver, 0, sizeof(driver));
              driver.state = SPW_LINK_ERROR_RESET;
              driver.advertise_readiness = with_wait;
              driver_config = (spw_driver_config_t)
                  SPW_DRIVER_CONFIG_INITIALIZER(with_wait ? &FAKE_OPS : &FAKE_OPS_NO_WAIT,
                                                &driver);
              config.backend_config = &driver_config;
              config.backend_config_size = sizeof(driver_config);

              CHECK(spw_port_workspace_requirements(&config, &requirements) == SPW_OK);
              CHECK(requirements.size <= sizeof(workspace.bytes));
              CHECK(spw_port_open_in_place(&config,
                                           workspace.bytes,
                                           sizeof(workspace.bytes),
                                           &port) == SPW_OK);
              CHECK(port != NULL);
              CHECK(spw_port_start(port) == SPW_OK);
              CHECK(spw_port_get_capabilities(port, &capabilities) == SPW_OK);
              CHECK((capabilities.bits & SPW_CAP_TIME_CODE) != 0u);
              CHECK((capabilities.bits & SPW_CAP_STATISTICS) != 0u);
              CHECK(((capabilities.bits & SPW_CAP_READINESS) != 0u) == with_wait);

              CHECK(spw_port_send(port, &tx, SPW_TIMEOUT_IMMEDIATE) == SPW_OK);
              if (with_wait) {
                  CHECK(spw_port_wait(port,
                                      SPW_READY_RX_PACKET,
                                      SPW_TIMEOUT_IMMEDIATE,
                                      &ready) == SPW_OK);
                  CHECK(ready == SPW_READY_RX_PACKET);
              } else {
                  CHECK(spw_port_wait(port,
                                      SPW_READY_RX_PACKET,
                                      SPW_TIMEOUT_IMMEDIATE,
                                      &ready) == SPW_ERR_UNSUPPORTED);
              }
              CHECK(spw_port_receive(port, &short_rx, SPW_TIMEOUT_IMMEDIATE) ==
                    SPW_ERR_BUFFER_TOO_SMALL);
              CHECK(short_rx.length == sizeof(tx_data));
              CHECK(spw_port_receive(port, &rx, SPW_TIMEOUT_IMMEDIATE) == SPW_OK);
              CHECK(rx.length == sizeof(tx_data));
              CHECK(rx.terminator == SPW_TERMINATOR_EEP);
              CHECK(memcmp(rx.data, tx_data, sizeof(tx_data)) == 0);

              CHECK(spw_port_send_time_code(port,
                                            &tx_code,
                                            SPW_TIMEOUT_IMMEDIATE) == SPW_OK);
              if (with_wait) {
                  CHECK(spw_port_wait(port,
                                      SPW_READY_RX_TIME_CODE,
                                      SPW_TIMEOUT_IMMEDIATE,
                                      &ready) == SPW_OK);
                  CHECK(ready == SPW_READY_RX_TIME_CODE);
              }
              CHECK(spw_port_receive_time_code(port,
                                               &rx_code,
                                               SPW_TIMEOUT_IMMEDIATE) == SPW_OK);
              CHECK(rx_code.time_count == tx_code.time_count);
              CHECK(rx_code.control_flags == tx_code.control_flags);

              CHECK(spw_port_get_statistics(port, &statistics) == SPW_OK);
              CHECK(statistics.tx_packets == 1u);
              CHECK(statistics.rx_packets == 1u);
              CHECK(statistics.tx_bytes == sizeof(tx_data));
              CHECK(statistics.rx_bytes == sizeof(tx_data));
              CHECK(statistics.tx_time_codes == 1u);
              CHECK(statistics.rx_time_codes == 1u);
              CHECK(statistics.eep_packets == 1u);
              CHECK(spw_port_clear_statistics(port) == SPW_OK);
              CHECK(spw_port_get_statistics(port, &statistics) == SPW_OK);
              CHECK(statistics.tx_packets == 0u);

              CHECK(spw_port_stop(port) == SPW_OK);
              CHECK(spw_port_send(port, &tx, SPW_TIMEOUT_IMMEDIATE) ==
                    SPW_ERR_INVALID_STATE);
              CHECK(spw_port_reset(port) == SPW_OK);
              CHECK(spw_port_close(port) == SPW_OK);
              return 0;
          }

          int main(void) {
              CHECK(run_driver(true) == 0);
              CHECK(run_driver(false) == 0);
              return 0;
          }
          EOF

          cat > docs/driver-backend.md <<'EOF'
          # Portable hardware driver backend

          `SPW_BACKEND_DRIVER` is the v0.6 software boundary between the public
          SpWKit port API and a platform/vendor SpaceWire driver.

          The application continues to use `spw_port_start()`, packet I/O, EOP/EEP,
          time codes, readiness, statistics and the normal timeout/result model. The
          backend delegates those operations through `spw_driver_ops_t` to a caller-
          owned driver context.

          ## Ownership

          SpWKit does not create or destroy the vendor driver object. The
          `spw_driver_ops_t` table and `driver_context` referenced by
          `spw_driver_config_t` must remain valid until `spw_port_close()` returns.
          This allows the context to represent a Linux kernel/user driver object, a
          bare-metal register block, an RTOS device object, or a future FPGA/DMA
          adapter without exposing any such native type in the SpWKit ABI.

          ## Required callbacks

          A v1 driver provides lifecycle (`start`, `stop`, `reset`), link state,
          capability discovery and copied packet `send`/`receive`. Time-code,
          statistics and readiness callbacks are optional; if the corresponding
          capability is advertised, both sides of that optional contract must be
          implemented.

          Readiness remains level-triggered and non-consuming. A driver with no
          `wait` callback does not expose `SPW_CAP_READINESS`, so polling drivers are
          valid without pretending to have an interrupt/event facility.

          ## DMA boundary

          v1 copied I/O intentionally does not expose DMA descriptors, physical
          addresses, AXI types or cache operations. DMA-capable buffer ownership is
          layered onto the existing opaque `spw_buffer_t` API in #111. That later
          mapping will preserve application-facing ownership while keeping hardware
          descriptors private to the vendor driver.

          ## FPGA stop line

          This backend is not an HDL definition. Register maps, DMA descriptor
          layout, interrupt routing, clock/reset domains and actual SpaceWire RTL are
          explicitly deferred to the future FPGA interface specification (#113).
          EOF

