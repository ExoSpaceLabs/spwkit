name: Simulator

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "src/backends/virtual/**"
      - "src/core/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/simulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "simulator/**"
      - "src/backends/virtual/**"
      - "src/core/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Local virtual SpaceWire link
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure simulator
        run: >-
          cmake -S . -B build-simulator
          -DCMAKE_BUILD_TYPE=Debug
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_SIMULATOR=ON
          -DSPWKIT_BUILD_TOOLS=OFF

      - name: Build simulator
        run: cmake --build build-simulator --parallel

      - name: Run simulator tests
        run: >-
          ctest --test-dir build-simulator
          -L simulator
          --output-on-failure
          --no-tests=error

      - name: Run public contract tests with simulator enabled
        run: >-
          ctest --test-dir build-simulator
          -L contract
          --output-on-failure
          --no-tests=error
