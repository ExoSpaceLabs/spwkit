name: Release audit

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata and version boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify package, API and documentation version alignment
        shell: bash
        run: |
          set -euo pipefail

          cmake_version="$(sed -nE 's/^project\(spwkit VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          api_major="$(sed -nE 's/^#define SPWKIT_API_VERSION_MAJOR ([0-9]+)u$/\1/p' include/spwkit/api.h)"
          api_minor="$(sed -nE 's/^#define SPWKIT_API_VERSION_MINOR ([0-9]+)u$/\1/p' include/spwkit/api.h)"
          api_patch="$(sed -nE 's/^#define SPWKIT_API_VERSION_PATCH ([0-9]+)u$/\1/p' include/spwkit/api.h)"
          api_version="${api_major}.${api_minor}.${api_patch}"

          test -n "$cmake_version"
          test "$api_version" = "$cmake_version"
          grep -q "^## v${cmake_version} — unreleased$" CHANGELOG.md
          grep -q "find_package(SpWKit ${api_major}.${api_minor} CONFIG REQUIRED)" examples/installed/CMakeLists.txt
          grep -q "find_package(SpWKit ${api_major}.${api_minor} CONFIG REQUIRED)" examples/distributed/CMakeLists.txt
          grep -q "find_package(SpWKit ${api_major}.${api_minor} CONFIG REQUIRED)" examples/installed_device/CMakeLists.txt
          test -f LICENSE
          test -f NOTICE

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v${cmake_version}"
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          fi

      - name: Record release boundary
        shell: bash
        run: |
          {
            echo '### SpWKit release boundary'
            echo
            echo '- Project/API version: 0.4.0'
            echo '- Linux device/service feature set: release candidate'
            echo '- Production CUSE (#78): deferred'
            echo '- Native Winsock VSPW-TP (#42): deferred'
            echo '- Physical HIL: manual/non-blocking until hardware exists'
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Exact-SHA release CI evidence
    if: ${{ github.ref_type == 'tag' }}
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require every automated release gate green on the tagged commit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          expected = [
              'CI',
              'C-only runtime',
              'Simulator',
              'Device-to-device',
              'Embedded portability',
              'Virtual device',
              'Tools',
              'Installed device examples',
              'Tooling',
          ]

          url = f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']

          by_name = {}
          for run in runs:
              by_name.setdefault(run['name'], []).append(run)

          missing = []
          for name in expected:
              candidates = by_name.get(name, [])
              good = [r for r in candidates
                      if r.get('status') == 'completed' and r.get('conclusion') == 'success']
              if not good:
                  states = ', '.join(
                      f"{r.get('event')}:{r.get('status')}:{r.get('conclusion')}"
                      for r in candidates
                  ) or 'no run found'
                  missing.append(f'{name}: {states}')

          if missing:
              print('Tagged commit lacks green release evidence:', file=sys.stderr)
              for item in missing:
                  print(f'  - {item}', file=sys.stderr)
              print('Re-run or complete the missing workflow(s), then rerun Release audit.', file=sys.stderr)
              sys.exit(1)

          print('All automated v0.4 release gates are green for', sha)
          print('HIL is intentionally excluded: v0.4 makes no physical-hardware claim.')
          PY
