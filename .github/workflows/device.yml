name: Virtual device

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/api.h"
      - "include/spwkit/config.h"
      - "include/spwkit/device.h"
      - "include/spwkit/udp.h"
      - "include/spwkit/spwkit.h"
      - "include/spwkit/spwkit.hpp"
      - "src/core/port.c"
      - "src/backends/device/**"
      - "src/backends/ethernet/**"
      - "src/vspwd/**"
      - "examples/c_device_peer.c"
      - "examples/cpp_device_peer.cpp"
      - "examples/distributed/**"
      - "examples/CMakeLists.txt"
      - "tests/vspw_device_protocol.c"
      - "tests/vspw_seqpacket.c"
      - "tests/vspwd_*.c"
      - "tests/device_public_peer.c"
      - "tests/device_bridge_peer.c"
      - "tests/contract/device_contract.cpp"
      - "tests/device/**"
      - "tests/CMakeLists.txt"
      - "docs/vspw-device-protocol.md"
      - "docs/vspwd.md"
      - ".github/workflows/device.yml"
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/spwkit/api.h"
      - "include/spwkit/config.h"
      - "include/spwkit/device.h"
      - "include/spwkit/udp.h"
      - "include/spwkit/spwkit.h"
      - "include/spwkit/spwkit.hpp"
      - "src/core/port.c"
      - "src/backends/device/**"
      - "src/backends/ethernet/**"
      - "src/vspwd/**"
      - "examples/c_device_peer.c"
      - "examples/cpp_device_peer.cpp"
      - "examples/distributed/**"
      - "examples/CMakeLists.txt"
      - "tests/vspw_device_protocol.c"
      - "tests/vspw_seqpacket.c"
      - "tests/vspwd_*.c"
      - "tests/device_public_peer.c"
      - "tests/device_bridge_peer.c"
      - "tests/contract/device_contract.cpp"
      - "tests/device/**"
      - "tests/CMakeLists.txt"
      - "docs/vspw-device-protocol.md"
      - "docs/vspwd.md"
      - ".github/workflows/device.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon-core:
    name: VSPD + vspwd core / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v6

      - name: Configure daemon-only pure-C profile
        env:
          CC: ${{ matrix.cc }}
          CXX: /bin/false
        run: |
          cmake -S . -B build-daemon \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=OFF \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=OFF \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-daemon/CMakeCache.txt; then
            echo "Daemon profile unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build protocol, daemon and raw clients
        run: cmake --build build-daemon --parallel

      - name: Run raw VSPD daemon tests
        run: ctest --test-dir build-daemon -R '^vspwd_' --output-on-failure --no-tests=error

      - name: Smoke installed daemon CLI
        run: |
          build-daemon/vspwd --help
          cmake --install build-daemon --prefix "$PWD/install-daemon"
          test -x "$PWD/install-daemon/bin/vspwd"
          "$PWD/install-daemon/bin/vspwd" --help

      - name: Verify daemon-only library stays hosted/C++ free
        run: |
          archive="build-daemon/libspwkit.a"
          test -f "$archive"
          if nm -u "$archive" | grep -Eq '(socket|send|recv|poll|pthread_|__cxa|_Z)'; then
            echo "Daemon-only portable archive introduced hosted/C++ runtime references" >&2
            nm -u "$archive"
            exit 1
          fi

  public-c:
    name: Public device C API / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v6

      - name: Configure hosted pure-C device profile
        env:
          CC: ${{ matrix.cc }}
          CXX: /bin/false
        run: |
          cmake -S . -B build-device \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-device/CMakeCache.txt; then
            echo "Public device profile unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build public backend, daemon and C example
        run: cmake --build build-device --parallel

      - name: Run public API process contract
        run: ctest --test-dir build-device -R '^device_public_api_' --output-on-failure --no-tests=error

      - name: Run pure-C public example pair
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          socket="$tmpdir/vspwd.sock"
          daemon_pid=""
          peer0_pid=""
          cleanup() {
            set +e
            [[ -n "$peer0_pid" ]] && kill "$peer0_pid" 2>/dev/null || true
            [[ -n "$peer0_pid" ]] && wait "$peer0_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && kill -TERM "$daemon_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && wait "$daemon_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT
          build-device/vspwd --socket "$socket" >"$tmpdir/vspwd.log" 2>&1 & daemon_pid=$!
          for _ in $(seq 1 100); do [[ -S "$socket" ]] && break; sleep 0.02; done
          [[ -S "$socket" ]] || { cat "$tmpdir/vspwd.log"; exit 1; }
          timeout 10s build-device/examples/spwkit_example_c_device_peer "$socket" 0 >"$tmpdir/p0.log" 2>&1 & peer0_pid=$!
          sleep 0.05
          timeout 10s build-device/examples/spwkit_example_c_device_peer "$socket" 1 >"$tmpdir/p1.log" 2>&1 || { cat "$tmpdir/p0.log" "$tmpdir/p1.log"; exit 1; }
          wait "$peer0_pid" || { cat "$tmpdir/p0.log" "$tmpdir/p1.log"; exit 1; }
          peer0_pid=""

      - name: Verify package metadata
        run: |
          cmake --install build-device --prefix "$PWD/install-device"
          grep -q 'SpWKit_DEVICE_RUNTIME_SUPPORTED ON' "$PWD/install-device/lib/cmake/SpWKit/SpWKitConfig.cmake"
          test -f "$PWD/install-device/include/spwkit/device.h"

  udp-bridge:
    name: vspwd VSPW-TP bridge / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v6

      - name: Configure pure-C bridge profile
        env:
          CC: ${{ matrix.cc }}
          CXX: /bin/false
        run: |
          cmake -S . -B build-bridge \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=ON \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=ON \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          if grep -q '^CMAKE_CXX_COMPILER:' build-bridge/CMakeCache.txt; then
            echo "Bridge profile unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build bridge, public device peer and distributed UDP peer
        run: cmake --build build-bridge --parallel

      - name: Run remote loss/restart bridge contract
        run: ctest --test-dir build-bridge -R '^vspwd_udp_bridge_remote_restart$' --output-on-failure --no-tests=error

      - name: Run management regressions with VSPD 1.3 bridge metadata
        run: ctest --test-dir build-bridge -R '^(spwctl_management_non_owning|spwmon_passive_push_observation|vspd_protocol_codec)$' --output-on-failure --no-tests=error

  public-cpp:
    name: Optional C++ device wrapper + shared contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure wrapper-enabled hosted device profile
        run: |
          cmake -S . -B build-device-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=ON \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=ON \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build daemon, wrapper example and contract fixture
        run: cmake --build build-device-cpp --parallel

      - name: Run shared device backend contract
        run: ctest --test-dir build-device-cpp -R '^backend_contract_device$' --output-on-failure --no-tests=error

      - name: Run optional C++ wrapper example pair
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          socket="$tmpdir/vspwd.sock"
          daemon_pid=""
          peer0_pid=""
          cleanup() {
            set +e
            [[ -n "$peer0_pid" ]] && kill "$peer0_pid" 2>/dev/null || true
            [[ -n "$peer0_pid" ]] && wait "$peer0_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && kill -TERM "$daemon_pid" 2>/dev/null || true
            [[ -n "$daemon_pid" ]] && wait "$daemon_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT
          build-device-cpp/vspwd --socket "$socket" >"$tmpdir/vspwd.log" 2>&1 & daemon_pid=$!
          for _ in $(seq 1 100); do [[ -S "$socket" ]] && break; sleep 0.02; done
          [[ -S "$socket" ]] || { cat "$tmpdir/vspwd.log"; exit 1; }
          timeout 10s build-device-cpp/examples/spwkit_example_cpp_device_peer "$socket" 0 >"$tmpdir/p0.log" 2>&1 & peer0_pid=$!
          sleep 0.05
          timeout 10s build-device-cpp/examples/spwkit_example_cpp_device_peer "$socket" 1 >"$tmpdir/p1.log" 2>&1 || { cat "$tmpdir/p0.log" "$tmpdir/p1.log"; exit 1; }
          wait "$peer0_pid" || { cat "$tmpdir/p0.log" "$tmpdir/p1.log"; exit 1; }
          peer0_pid=""

  sanitizers:
    name: Public device + vspwd ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure sanitized pure-C device profile
        env:
          CC: clang
          CXX: /bin/false
        run: |
          cmake -S . -B build-device-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=OFF \
            -DSPWKIT_BUILD_EXAMPLES=OFF \
            -DSPWKIT_BUILD_CPP_EXAMPLES=OFF \
            -DSPWKIT_BUILD_SIMULATOR=OFF \
            -DSPWKIT_BUILD_UDP=OFF \
            -DSPWKIT_BUILD_DEVICE=ON \
            -DSPWKIT_BUILD_VSPWD=ON \
            -DSPWKIT_BUILD_TOOLS=OFF \
            -DSPWKIT_ENABLE_HEAP=ON \
            -DSPWKIT_ENABLE_CPP=OFF \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          if grep -q '^CMAKE_CXX_COMPILER:' build-device-san/CMakeCache.txt; then
            echo "Sanitized device profile unexpectedly enabled CXX" >&2
            exit 1
          fi

      - name: Build
        run: cmake --build build-device-san --parallel

      - name: Run all device tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-device-san -L device --output-on-failure --no-tests=error
