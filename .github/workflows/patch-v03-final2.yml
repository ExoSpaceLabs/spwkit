name: Finalize v0.3 C runtime docs 2

on:
  push:
    branches:
      - agent/cpp-wrapper-packaging
    paths:
      - .github/workflows/patch-v03-final2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/cpp-wrapper-packaging
          fetch-depth: 0

      - name: Apply reconciliation
        run: python3 .github/scripts/patch_v03_final.py

      - name: Commit reconciliation
        run: |
          rm -f .github/workflows/patch-v03-final2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(spwkit): finalize C runtime packaging"
          git push origin HEAD:agent/cpp-wrapper-packaging
