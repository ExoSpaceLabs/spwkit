name: Bootstrap DEVICE readiness optimization

on:
  push:
    branches:
      - perf/device-readiness-fast-path
    paths:
      - scripts/bootstrap_device_readiness.py
      - .github/workflows/bootstrap-device-readiness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: perf/device-readiness-fast-path
      - name: Apply guarded patch
        shell: bash
        run: |
          if [[ ! -f scripts/bootstrap_device_readiness.py ]]; then
            echo "Patch script already consumed."
            exit 0
          fi
          python3 scripts/bootstrap_device_readiness.py
          git diff --check
      - name: Commit production change
        shell: bash
        run: |
          if [[ ! -f scripts/bootstrap_device_readiness.py ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backends/device/device_backend.c
          git rm scripts/bootstrap_device_readiness.py
          git commit -m "perf(spwkit): optimize DEVICE readiness"
          git push origin HEAD:perf/device-readiness-fast-path
