name: Zero-copy benchmark bootstrap

on:
  push:
    branches: [work/zero-copy-benchmark]
    paths:
      - scripts/apply_zero_copy_campaign.py
      - .github/workflows/zero-copy-benchmark-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: work/zero-copy-benchmark
          fetch-depth: 0

      - name: Apply campaign integration
        run: python3 scripts/apply_zero_copy_campaign.py

      - name: Validate standalone zero-copy comparison
        shell: bash
        run: |
          set -euo pipefail
          bash benchmarks/run_zero_copy_comparison.sh \
            --warmup 8 \
            --iterations 32 \
            --payloads "0 64 1024 4096" \
            --settle-seconds 0 \
            --build-dir build/bootstrap-zero-copy \
            --output build/bootstrap-zero-copy-results.jsonl \
            --calibration-output build/bootstrap-zero-copy-calibration.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('build/bootstrap-zero-copy-results.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows) == 4
          for row in rows:
              assert row['schema'] == 'spwkit.profile.zero-copy-comparison.v1'
              assert row['provider_storage_shared'] is True
              assert row['delta']['definition'] == 'zero-copy-minus-copied'
              assert set(row['ownership_statistics']) == {'acquire', 'submit', 'reclaim', 'release'}
          PY

      - name: Validate complete hosted campaign contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/bootstrap-campaign build/bootstrap-results
          result_dir="$(bash benchmarks/run_profile_campaign.sh \
            --warmup 2 \
            --iterations 8 \
            --payloads "0 64 1024 4096" \
            --settle-seconds 0 \
            --type bootstrap \
            --build-root build/bootstrap-campaign \
            --output-root build/bootstrap-results | tail -n 1)"
          python3 benchmarks/validate_profile_campaign.py \
            "$result_dir" \
            --expected-type bootstrap \
            --expected-measured 11
          grep -q 'Measured: 11/12' "$result_dir/summary.txt"

      - name: Commit campaign integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/run_profile_campaign.sh \
            benchmarks/summarize_profile_campaign.py \
            benchmarks/validate_profile_campaign.py
          git commit -m "test(spwkit): integrate zero-copy TX benchmark campaign"
          git push origin HEAD:work/zero-copy-benchmark
