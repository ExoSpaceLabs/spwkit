name: v0.5 maintenance release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: read

env:
  SPWKIT_RELEASE_DEB_ARCHES: "amd64 arm64 armhf riscv64"
  SPWKIT_RELEASE_PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64"

jobs:
  metadata:
    name: Validate v0.5 maintenance boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate tag, version and ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt | head -n1)"
          api_major="$(sed -nE 's/^#define SPWKIT_API_VERSION_MAJOR ([0-9]+)u$/\1/p' include/spwkit/api.h)"
          api_minor="$(sed -nE 's/^#define SPWKIT_API_VERSION_MINOR ([0-9]+)u$/\1/p' include/spwkit/api.h)"
          api_patch="$(sed -nE 's/^#define SPWKIT_API_VERSION_PATCH ([0-9]+)u$/\1/p' include/spwkit/api.h)"
          test "$RELEASE_TAG" = "v$version"
          test "$api_major.$api_minor.$api_patch" = "$version"
          [[ "$version" =~ ^0\.5\.[1-9][0-9]*$ ]]
          test -f "docs/releases/$RELEASE_TAG.md"
          git fetch origin release/0.5 --tags
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          branch_commit="$(git rev-parse origin/release/0.5)"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git merge-base --is-ancestor v0.5.0 "$tag_commit"
          git merge-base --is-ancestor "$tag_commit" "$branch_commit"
          if ! git diff --quiet "$tag_commit".."$branch_commit" -- . ':(exclude).github/workflows/**'; then
            echo "release/0.5 moved beyond the tag with non-workflow changes; refusing to publish stale source" >&2
            exit 1
          fi

  hosted:
    name: Hosted / ${{ matrix.name }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2025
            cc: ""
            cxx: ""
          - name: macOS Clang
            os: macos-latest
            cc: ""
            cxx: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_CPP_EXAMPLES=ON
          -DSPWKIT_BUILD_SIMULATOR=ON
          -DSPWKIT_BUILD_UDP=ON
          -DSPWKIT_BUILD_TOOLS=OFF
          -DSPWKIT_ENABLE_HEAP=ON
          -DSPWKIT_ENABLE_CPP=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Install
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/install"
          test -f "$PWD/install/include/spwkit/spwkit.hpp"
          test -f "$PWD/install/share/doc/spwkit/LICENSE"
      - name: Build installed C consumer
        shell: bash
        run: |
          cmake -S examples/installed -B build-installed-c -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-installed-c --config Release --parallel
      - name: Build installed C++ consumer
        shell: bash
        run: |
          cmake -S examples/installed_cpp -B build-installed-cpp -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-installed-cpp --config Release --parallel

  cpp-zero-copy:
    name: C++ wrapper zero-copy runtime
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure and build wrapper example
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPWKIT_BUILD_TESTS=ON \
            -DSPWKIT_BUILD_CPP_TESTS=ON \
            -DSPWKIT_BUILD_EXAMPLES=ON \
            -DSPWKIT_BUILD_CPP_EXAMPLES=ON \
            -DSPWKIT_BUILD_SIMULATOR=ON \
            -DSPWKIT_ENABLE_CPP=ON
          cmake --build build --target spwkit_example_cpp_wrapper_simulator_zero_copy --parallel
      - name: Execute zero-copy ownership path
        run: ./build/examples/spwkit_example_cpp_wrapper_simulator_zero_copy

  pure-c:
    name: Pure C / no-heap
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure C-only hosted profile
        env:
          CC: gcc
          CXX: /bin/false
        run: >-
          cmake -S . -B build-c
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=OFF
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_CPP_EXAMPLES=OFF
          -DSPWKIT_BUILD_SIMULATOR=ON
          -DSPWKIT_BUILD_UDP=ON
          -DSPWKIT_ENABLE_HEAP=ON
          -DSPWKIT_ENABLE_CPP=OFF
      - name: Build and test C-only hosted profile
        run: |
          cmake --build build-c --parallel
          ctest --test-dir build-c --output-on-failure --no-tests=error
      - name: Configure no-heap C-only profile
        env:
          CC: gcc
          CXX: /bin/false
        run: >-
          cmake -S . -B build-noheap-c
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=OFF
          -DSPWKIT_BUILD_EXAMPLES=OFF
          -DSPWKIT_BUILD_CPP_EXAMPLES=OFF
          -DSPWKIT_BUILD_SIMULATOR=OFF
          -DSPWKIT_BUILD_UDP=OFF
          -DSPWKIT_ENABLE_HEAP=OFF
          -DSPWKIT_ENABLE_CPP=OFF
      - name: Build and run allocation-free C contract
        run: |
          cmake --build build-noheap-c --parallel
          ctest --test-dir build-noheap-c -L noheap --output-on-failure --no-tests=error

  sanitizers:
    name: Linux ASan + UBSan
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure
        run: >-
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DSPWKIT_BUILD_TESTS=ON
          -DSPWKIT_BUILD_CPP_TESTS=ON
          -DSPWKIT_BUILD_EXAMPLES=ON
          -DSPWKIT_BUILD_CPP_EXAMPLES=ON
          -DSPWKIT_BUILD_SIMULATOR=ON
          -DSPWKIT_ENABLE_CPP=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure --no-tests=error
          ./build-san/examples/spwkit_example_cpp_wrapper_simulator_zero_copy

  deb:
    name: DEB / ${{ matrix.arch }}
    needs: [hosted, cpp-zero-copy, pure-c, sanitizers]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
          - arch: riscv64
            platform: linux/riscv64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Enable QEMU architectures
        run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: Create buildx builder
        run: |
          docker buildx create --name spwkit-maint-${{ matrix.arch }} --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Validate target package and installed consumers
        run: >-
          docker buildx build
          --builder spwkit-maint-${{ matrix.arch }}
          --platform ${{ matrix.platform }}
          --file packaging/Dockerfile
          --target consumer-validate
          --progress plain
          .
      - name: Export DEB
        run: |
          mkdir -p "dist/${{ matrix.arch }}"
          docker buildx build \
            --builder spwkit-maint-${{ matrix.arch }} \
            --platform "${{ matrix.platform }}" \
            --file packaging/Dockerfile \
            --target package-export \
            --output "type=local,dest=dist/${{ matrix.arch }}" \
            --progress plain \
            .
          package="$(find "dist/${{ matrix.arch }}" -maxdepth 1 -name 'spwkit_*.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = "${{ matrix.arch }}"
          test "$(dpkg-deb -f "$package" Version)" = "0.5.1-1"
          package_dir="$(dirname "$package")"
          package_name="$(basename "$package")"
          (cd "$package_dir" && sha256sum "$package_name" > "$package_name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: spwkit-deb-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.deb
            dist/${{ matrix.arch }}/*.sha256
          if-no-files-found: error

  multiarch-image:
    name: Multi-arch runtime image
    needs: [hosted, cpp-zero-copy, pure-c, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Enable QEMU architectures
        run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: Build OCI image for all release platforms
        run: |
          docker buildx create --name spwkit-maint-image --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --builder spwkit-maint-image \
            --platform "$SPWKIT_RELEASE_PLATFORMS" \
            --file packaging/Dockerfile \
            --target runtime \
            --build-arg VERSION=0.5.1 \
            --output type=oci,dest=/tmp/spwkit-runtime.oci.tar \
            --progress plain \
            .
          test -s /tmp/spwkit-runtime.oci.tar
          tar -tf /tmp/spwkit-runtime.oci.tar | grep -q index.json

  publish:
    name: Publish v0.5.1
    needs: [deb, multiarch-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: spwkit-deb-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'spwkit_*.deb' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -name 'spwkit_*.deb.sha256' | wc -l)" -eq 4
          (cd dist && sha256sum -c *.sha256)
      - name: Enable QEMU architectures
        run: docker run --privileged --rm tonistiigi/binfmt --install all
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish multi-arch GHCR image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --name spwkit-maint-publish --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --builder spwkit-maint-publish \
            --platform "$SPWKIT_RELEASE_PLATFORMS" \
            --file packaging/Dockerfile \
            --target runtime \
            --build-arg VERSION=0.5.1 \
            --tag "$image:$RELEASE_TAG" \
            --tag "$image:0.5" \
            --tag "$image:latest" \
            --push \
            --progress plain \
            .
          docker buildx imagetools inspect "$image:$RELEASE_TAG"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.sha256' \) -print | sort)
          test "${#assets[@]}" -eq 8
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --verify-tag \
            --title "SpWKit $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
