name: Patch device backend dispatch
on:
  workflow_dispatch:
  push:
    branches:
      - agent/v04-device-backend
    paths:
      - .github/patch_device.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v04-device-backend
          fetch-depth: 0
      - run: python3 .github/patch_device.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(spwkit): wire device backend dispatch"
          git push origin HEAD:agent/v04-device-backend
