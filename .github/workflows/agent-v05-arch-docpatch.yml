name: Agent v0.5 architecture documentation patch

on:
  push:
    branches: [agent/develop]
    paths:
      - ".github/workflows/agent-v05-arch-docpatch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/develop
          fetch-depth: 0

      - name: Promote validated v0.5 architecture evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          old = '''### In development

- production event-driven CUSE `/dev/vspwX` presentation (#78);
- native Windows/Winsock VSPW-TP runtime parity (#42);
- evidence-backed hosted release expansion beyond `amd64` and `arm64`/AArch64, starting with `armhf` and `riscv64` candidates (#88);
- generic embedded/RTOS integration boundaries demonstrated first with HardRT POSIX and Cortex-M, without introducing a HardRT dependency into `libspwkit` (#89);
- optional downstream CCSDSPack 2.x packet-transport integration after a validated CCSDSPack release is available (#90).
'''
          new = '''### Added / validated so far

- HardRT POSIX integration through installed packages under GCC and Clang, with two scheduler tasks exercising independent no-heap SpWKit ports;
- `arm-none-eabi` Cortex-M7/Thumb/soft-float HardRT + SpWKit firmware cross-build/link evidence, including final ELF/map inspection and hosted-runtime leakage checks (#89);
- hosted package/runtime validation for `amd64`, `arm64`/AArch64, `armhf`/Armv7 and `riscv64`, including clean target-userspace DEB installation and installed tool execution under native/QEMU execution as appropriate (#88).

### In development

- production event-driven CUSE `/dev/vspwX` presentation (#78);
- native Windows/Winsock VSPW-TP runtime parity (#42);
- optional downstream CCSDSPack 2.x packet-transport integration after a validated CCSDSPack release is available (#90).
'''
          if old not in text:
              raise SystemExit('expected v0.5 changelog block not found')
          changelog.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old_bullet = '- evidence-backed hosted binary expansion (#88). `arm64` is AArch64 and is already released in v0.4; 32-bit ARM (`armhf`) and `riscv64` are the next hosted candidates;'
          new_bullet = '- evidence-backed hosted binary expansion (#88): `amd64`, `arm64`/AArch64, `armhf`/Armv7 and `riscv64` now build/install/execute in the v0.5 package gate;'
          if old_bullet not in text:
              raise SystemExit('expected README architecture bullet not found')
          text = text.replace(old_bullet, new_bullet, 1)
          old_rt = '- generic RTOS/bare-metal integration demonstrated first with HardRT POSIX and Cortex-M (#89), without making HardRT a `libspwkit` dependency;'
          new_rt = '- generic RTOS/bare-metal integration demonstrated with HardRT POSIX runtime execution plus a linked `arm-none-eabi` Cortex-M7 firmware contract (#89), without making HardRT a `libspwkit` dependency;'
          if old_rt not in text:
              raise SystemExit('expected README HardRT bullet not found')
          readme.write_text(text.replace(old_rt, new_rt, 1), encoding='utf-8')
          PY

          git rm .github/workflows/agent-v05-arch-docpatch.yml

      - name: Commit promoted architecture documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md .github/workflows/agent-v05-arch-docpatch.yml
          git diff --cached --check
          git commit -m "docs(spwkit): record v0.5 architecture evidence"
          git push origin HEAD:agent/develop
