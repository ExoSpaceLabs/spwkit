name: Agent v0.5 documentation patch

on:
  push:
    branches: [agent/develop]
    paths:
      - ".github/workflows/agent-v05-docpatch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/develop
          fetch-depth: 0

      - name: Update development documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          heading = '### v0.5.0 — Hosted platform and embedded/RTOS integration (development)'
          if heading not in text:
              anchor = '## Release status\n\n'
              section = '''### v0.5.0 — Hosted platform and embedded/RTOS integration (development)\n\n`main` now targets v0.5.0. The released v0.4.0 tag and binary artifacts remain immutable while v0.5 expands the same public C API into additional hosted and embedded environments.\n\nPlanned v0.5 work includes:\n\n- production event-driven CUSE `/dev/vspwX` presentation (#78);\n- native Windows/Winsock VSPW-TP runtime parity (#42);\n- evidence-backed hosted binary expansion (#88). `arm64` is AArch64 and is already released in v0.4; 32-bit ARM (`armhf`) and `riscv64` are the next hosted candidates;\n- generic RTOS/bare-metal integration demonstrated first with HardRT POSIX and Cortex-M (#89), without making HardRT a `libspwkit` dependency;\n- optional CCSDSPack 2.x producer/consumer integration after a validated CCSDSPack 2.x release is available (#90).\n\nBare-metal artifacts are treated as target-toolchain SDK/static builds, not Debian or OCI packages. Physical SpaceWire interoperability remains a separate HIL claim until hardware exists.\n\n'''
              text = text.replace(anchor, anchor + section, 1)
          text = text.replace('Consumer CMake for v0.4:', 'Consumer CMake for v0.5 development:')
          text = text.replace('find_package(SpWKit 0.4 CONFIG REQUIRED)',
                              'find_package(SpWKit 0.5 CONFIG REQUIRED)')
          doc_link = '- [HardRT POSIX integration](integrations/hardrt_posix/README.md)\n'
          if doc_link not in text:
              text = text.replace('- [Portability contract](docs/portability.md)\n',
                                  '- [Portability contract](docs/portability.md)\n' + doc_link)
          readme.write_text(text, encoding='utf-8')

          for name in [
              'docs/getting-started.md',
              'docs/platform-support.md',
              'docs/testing.md',
              'docs/language-bindings.md',
              'tests/d2d/README.md',
          ]:
              path = Path(name)
              body = path.read_text(encoding='utf-8')
              body = body.replace('find_package(SpWKit 0.4', 'find_package(SpWKit 0.5')
              path.write_text(body, encoding='utf-8')
          PY

      - name: Commit documentation patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/getting-started.md docs/platform-support.md docs/testing.md docs/language-bindings.md tests/d2d/README.md
          git diff --cached --check
          git commit -m "docs(spwkit): document v0.5 development"
          git push origin HEAD:agent/develop
