name: Agent driver DMA patch

on:
  push:
    branches:
      - agent/driver-dma
    paths:
      - .github/workflows/agent-driver-dma-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/driver-dma
          fetch-depth: 0
      - name: Apply driver DMA patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/core/backend_c.h",
              "    const spw_backend_ops_t* ops;\n} spw_backend_factory_t;\n",
              "    const spw_backend_ops_t* ops;\n"
              "    /* Optional configuration-dependent context size. */\n"
              "    spw_result_t (*context_size_for_config)(\n"
              "        const spw_port_config_t* config,\n"
              "        size_t* out_context_size);\n"
              "} spw_backend_factory_t;\n")

          old_req = '''static spw_port_workspace_requirements_t requirements_for(\n    const spw_backend_factory_t* factory) {\n    const size_t port_alignment = alignof(spw_port_t);\n    const size_t required_alignment =\n        factory->context_alignment > port_alignment\n            ? factory->context_alignment\n            : port_alignment;\n    const size_t context_offset =\n        align_up(sizeof(spw_port_t), factory->context_alignment);\n    spw_port_workspace_requirements_t requirements;\n    requirements.size = context_offset + factory->context_size;\n    requirements.alignment = required_alignment;\n    return requirements;\n}\n'''
          new_req = '''static bool is_power_of_two(size_t value) {\n    return value != 0u && (value & (value - 1u)) == 0u;\n}\n\nstatic spw_result_t requirements_for(\n    const spw_port_config_t* config,\n    const spw_backend_factory_t* factory,\n    spw_port_workspace_requirements_t* out_requirements) {\n    const size_t port_alignment = alignof(spw_port_t);\n    size_t context_size = factory->context_size;\n    size_t context_offset;\n    size_t required_alignment;\n    spw_result_t result;\n\n    if (factory->context_alignment == 0u ||\n        !is_power_of_two(factory->context_alignment)) {\n        return SPW_ERR_BACKEND;\n    }\n    if (factory->context_size_for_config != NULL) {\n        result = factory->context_size_for_config(config, &context_size);\n        if (result != SPW_OK) {\n            return result;\n        }\n    }\n    if (context_size == 0u) {\n        return SPW_ERR_BACKEND;\n    }\n\n    required_alignment = factory->context_alignment > port_alignment\n                             ? factory->context_alignment\n                             : port_alignment;\n    context_offset = align_up(sizeof(spw_port_t), factory->context_alignment);\n    if (context_size > SIZE_MAX - context_offset) {\n        return SPW_ERR_RESOURCE_EXHAUSTED;\n    }\n    out_requirements->size = context_offset + context_size;\n    out_requirements->alignment = required_alignment;\n    return SPW_OK;\n}\n'''
          replace("src/core/port.c", old_req, new_req)

          replace(
              "src/core/port.c",
              "    *out_requirements = requirements_for(factory);\n    return SPW_OK;\n",
              "    return requirements_for(config, factory, out_requirements);\n")
          replace(
              "src/core/port.c",
              "    requirements = requirements_for(factory);\n\n    if (workspace == NULL) {\n",
              "    result = requirements_for(config, factory, &requirements);\n"
              "    if (result != SPW_OK) {\n"
              "        return result;\n"
              "    }\n\n"
              "    if (workspace == NULL) {\n")

          replace(
              "src/core/port.c",
              "    if (ops->start == NULL || ops->stop == NULL || ops->reset == NULL ||\n"
              "        ops->get_link_state == NULL || ops->get_capabilities == NULL ||\n"
              "        ops->send == NULL || ops->receive == NULL) {\n"
              "        return SPW_ERR_INVALID_ARGUMENT;\n"
              "    }\n"
              "    return SPW_OK;\n"
              "}\n",
              "    if (ops->start == NULL || ops->stop == NULL || ops->reset == NULL ||\n"
              "        ops->get_link_state == NULL || ops->get_capabilities == NULL ||\n"
              "        ops->send == NULL || ops->receive == NULL) {\n"
              "        return SPW_ERR_INVALID_ARGUMENT;\n"
              "    }\n"
              "    {\n"
              "        const bool any_dma = ops->acquire_tx_buffer != NULL ||\n"
              "                             ops->submit_tx_buffer != NULL ||\n"
              "                             ops->reclaim_tx_buffer != NULL ||\n"
              "                             ops->release_tx_buffer != NULL ||\n"
              "                             ops->acquire_rx_buffer != NULL ||\n"
              "                             ops->release_rx_buffer != NULL;\n"
              "        const bool all_dma = ops->acquire_tx_buffer != NULL &&\n"
              "                             ops->submit_tx_buffer != NULL &&\n"
              "                             ops->reclaim_tx_buffer != NULL &&\n"
              "                             ops->release_tx_buffer != NULL &&\n"
              "                             ops->acquire_rx_buffer != NULL &&\n"
              "                             ops->release_rx_buffer != NULL;\n"
              "        if (any_dma != all_dma) {\n"
              "            return SPW_ERR_INVALID_ARGUMENT;\n"
              "        }\n"
              "        if ((driver->tx_buffer_slots > SPW_DRIVER_MAX_BUFFER_SLOTS ||\n"
              "             driver->rx_buffer_slots > SPW_DRIVER_MAX_BUFFER_SLOTS) ||\n"
              "            ((driver->tx_buffer_slots != 0u ||\n"
              "              driver->rx_buffer_slots != 0u) && !all_dma)) {\n"
              "            return SPW_ERR_INVALID_ARGUMENT;\n"
              "        }\n"
              "    }\n"
              "    return SPW_OK;\n"
              "}\n")

          replace(
              "src/core/port.c",
              "        driver = (const spw_driver_config_t*)config->backend_config;\n"
              "        *out_factory = spw_driver_backend_factory(driver->ops->wait != NULL);\n"
              "        return SPW_OK;\n",
              "        driver = (const spw_driver_config_t*)config->backend_config;\n"
              "        *out_factory = spw_driver_backend_factory(\n"
              "            driver->ops->wait != NULL,\n"
              "            driver->ops->acquire_tx_buffer != NULL &&\n"
              "                driver->tx_buffer_slots != 0u &&\n"
              "                driver->rx_buffer_slots != 0u);\n"
              "        return SPW_OK;\n")

          replace(
              "tests/CMakeLists.txt",
              "add_test(NAME driver_backend COMMAND spwkit_driver_backend)\n",
              "add_test(NAME driver_backend COMMAND spwkit_driver_backend)\n\n"
              "add_executable(spwkit_driver_dma driver_dma.c)\n"
              "target_link_libraries(spwkit_driver_dma PRIVATE spwkit::spwkit)\n"
              "target_compile_features(spwkit_driver_dma PRIVATE c_std_11)\n"
              "set_target_properties(spwkit_driver_dma PROPERTIES C_STANDARD 11 C_STANDARD_REQUIRED YES C_EXTENSIONS OFF)\n"
              "add_test(NAME driver_dma COMMAND spwkit_driver_dma)\n")

          replace(
              "CHANGELOG.md",
              "- portable `SPW_BACKEND_DRIVER` callback boundary for caller/vendor-owned SpaceWire hardware drivers, preserving the normal `spw_port_*` lifecycle and copied packet/time-code/readiness/statistics semantics without exposing native handles (#110);\n",
              "- portable `SPW_BACKEND_DRIVER` callback boundary for caller/vendor-owned SpaceWire hardware drivers, preserving the normal `spw_port_*` lifecycle and copied packet/time-code/readiness/statistics semantics without exposing native handles (#110);\n"
              "- DMA-capable driver buffer descriptors mapped onto the existing opaque SpWKit zero-copy ownership API, with opaque driver tokens, configurable no-heap wrapper slots and optional cache/coherency synchronization hooks (#111);\n")
          PY

          cat > include/spwkit/driver.h <<'EOF'
          // SPDX-License-Identifier: Apache-2.0
          #ifndef SPWKIT_DRIVER_H
          #define SPWKIT_DRIVER_H

          #include <stddef.h>
          #include <stdint.h>

          #include "spwkit/types.h"

          #ifdef __cplusplus
          extern "C" {
          #endif

          /* v1 was development-only; v2 adds the DMA ownership contract. */
          #define SPW_DRIVER_OPS_VERSION 2u
          #define SPW_DRIVER_CONFIG_VERSION 2u
          #define SPW_DRIVER_MAX_BUFFER_SLOTS 64u

          typedef uint64_t spw_driver_buffer_token_t;

          typedef struct spw_driver_buffer {
              uint8_t* data;
              size_t length;
              size_t capacity;
              spw_terminator_t terminator;
              spw_driver_buffer_token_t token;
          } spw_driver_buffer_t;

          typedef uint32_t spw_driver_sync_direction_t;
          #define SPW_DRIVER_SYNC_TO_DEVICE   ((spw_driver_sync_direction_t)1u)
          #define SPW_DRIVER_SYNC_FROM_DEVICE ((spw_driver_sync_direction_t)2u)

          /**
           * Portable hardware-driver callback table.
           *
           * The callback table and driver_context are owned by the caller/vendor
           * driver and must remain valid until the SpWKit port is closed. No POSIX,
           * Winsock, MMIO, physical-address, AXI, DMA-descriptor or interrupt handle
           * type appears in this ABI.
           *
           * Lifecycle, copied packet I/O, link state and capabilities are required.
           * Time-code, statistics and readiness callbacks are optional and must agree
           * with the capability bits returned by get_capabilities().
           *
           * DMA/zero-copy support is optional but atomic: when any DMA ownership
           * callback is supplied, all six ownership callbacks must be supplied.
           */
          typedef struct spw_driver_ops {
              uint32_t struct_size;
              uint32_t version;

              spw_result_t (*start)(void* driver_context);
              spw_result_t (*stop)(void* driver_context);
              spw_result_t (*reset)(void* driver_context);

              spw_result_t (*get_link_state)(const void* driver_context,
                                             spw_link_state_t* out_state);
              spw_result_t (*get_capabilities)(const void* driver_context,
                                               spw_capabilities_t* out_capabilities);

              spw_result_t (*send)(void* driver_context,
                                   const spw_packet_t* packet,
                                   spw_timeout_us_t timeout_us);
              spw_result_t (*receive)(void* driver_context,
                                      spw_packet_t* packet,
                                      spw_timeout_us_t timeout_us);

              spw_result_t (*send_time_code)(void* driver_context,
                                             const spw_time_code_t* time_code,
                                             spw_timeout_us_t timeout_us);
              spw_result_t (*receive_time_code)(void* driver_context,
                                                spw_time_code_t* time_code,
                                                spw_timeout_us_t timeout_us);

              spw_result_t (*get_statistics)(const void* driver_context,
                                             spw_statistics_t* out_statistics);
              spw_result_t (*clear_statistics)(void* driver_context);

              /** Optional level-triggered, non-consuming receive readiness. */
              spw_result_t (*wait)(void* driver_context,
                                   spw_ready_events_t interests,
                                   spw_timeout_us_t timeout_us,
                                   spw_ready_events_t* out_ready);

              spw_result_t (*acquire_tx_buffer)(
                  void* driver_context,
                  size_t min_capacity,
                  spw_timeout_us_t timeout_us,
                  spw_driver_buffer_t* out_buffer);
              spw_result_t (*submit_tx_buffer)(
                  void* driver_context,
                  const spw_driver_buffer_t* buffer,
                  spw_timeout_us_t timeout_us);
              spw_result_t (*reclaim_tx_buffer)(
                  void* driver_context,
                  spw_timeout_us_t timeout_us,
                  spw_driver_buffer_t* out_buffer);
              spw_result_t (*release_tx_buffer)(
                  void* driver_context,
                  const spw_driver_buffer_t* buffer);
              spw_result_t (*acquire_rx_buffer)(
                  void* driver_context,
                  spw_timeout_us_t timeout_us,
                  spw_driver_buffer_t* out_buffer);
              spw_result_t (*release_rx_buffer)(
                  void* driver_context,
                  const spw_driver_buffer_t* buffer);

              /**
               * Optional cache/coherency synchronization hook.
               *
               * TO_DEVICE runs immediately before TX ownership is submitted to the
               * driver. FROM_DEVICE runs after RX ownership is acquired and before
               * application access. NULL means the memory is coherent or the vendor
               * ownership callbacks already perform the required maintenance.
               */
              spw_result_t (*sync_buffer)(
                  void* driver_context,
                  const spw_driver_buffer_t* buffer,
                  spw_driver_sync_direction_t direction);
          } spw_driver_ops_t;

          typedef struct spw_driver_config {
              uint32_t struct_size;
              uint32_t version;
              const spw_driver_ops_t* ops;
              void* driver_context;
              uint32_t reserved;
              size_t tx_buffer_slots;
              size_t rx_buffer_slots;
          } spw_driver_config_t;

          #define SPW_DRIVER_OPS_INITIALIZER \
              { sizeof(spw_driver_ops_t), SPW_DRIVER_OPS_VERSION }

          #define SPW_DRIVER_CONFIG_INITIALIZER(ops_, context_) \
              { sizeof(spw_driver_config_t), SPW_DRIVER_CONFIG_VERSION, \
                (ops_), (context_), 0u, 0u, 0u }

          #ifdef __cplusplus
          } /* extern "C" */
          #endif

          #endif /* SPWKIT_DRIVER_H */
          EOF

          cat > src/backends/driver/driver_backend.h <<'EOF'
          // SPDX-License-Identifier: Apache-2.0
          #ifndef SPWKIT_INTERNAL_DRIVER_BACKEND_H
          #define SPWKIT_INTERNAL_DRIVER_BACKEND_H

          #include <stdbool.h>

          #include "core/backend_c.h"

          const spw_backend_factory_t* spw_driver_backend_factory(
              bool enable_wait,
              bool enable_zero_copy);

          #endif /* SPWKIT_INTERNAL_DRIVER_BACKEND_H */
          EOF

          cat > src/backends/driver/driver_backend.c <<'EOF'
          // SPDX-License-Identifier: Apache-2.0

          #include "backends/driver/driver_backend.h"

          #include <spwkit/driver.h>

          #include "core/buffer_internal.h"

          #include <stdbool.h>
          #include <stdalign.h>
          #include <stdint.h>
          #include <string.h>

          typedef struct spw_driver_buffer_slot {
              struct spw_buffer buffer;
              spw_driver_buffer_t driver_buffer;
              bool active;
          } spw_driver_buffer_slot_t;

          typedef struct spw_driver_backend {
              const spw_driver_ops_t* ops;
              void* driver_context;
              size_t tx_slot_count;
              size_t rx_slot_count;
              spw_driver_buffer_slot_t slots[];
          } spw_driver_backend_t;

          static bool valid_terminator(spw_terminator_t terminator) {
              return terminator == SPW_TERMINATOR_EOP ||
                     terminator == SPW_TERMINATOR_EEP;
          }

          static bool complete_dma_ops(const spw_driver_ops_t* ops) {
              return ops->acquire_tx_buffer != NULL &&
                     ops->submit_tx_buffer != NULL &&
                     ops->reclaim_tx_buffer != NULL &&
                     ops->release_tx_buffer != NULL &&
                     ops->acquire_rx_buffer != NULL &&
                     ops->release_rx_buffer != NULL;
          }

          static bool zero_copy_enabled_config(const spw_driver_config_t* config) {
              return complete_dma_ops(config->ops) &&
                     config->tx_buffer_slots != 0u &&
                     config->rx_buffer_slots != 0u;
          }

          static spw_result_t driver_context_size_for_config(
              const spw_port_config_t* config,
              size_t* out_context_size) {
              const spw_driver_config_t* driver =
                  (const spw_driver_config_t*)config->backend_config;
              size_t total_slots = 0u;
              size_t slots_size = 0u;
              if (out_context_size == NULL || driver == NULL) {
                  return SPW_ERR_INVALID_ARGUMENT;
              }
              if (zero_copy_enabled_config(driver)) {
                  if (driver->tx_buffer_slots > SIZE_MAX - driver->rx_buffer_slots) {
                      return SPW_ERR_RESOURCE_EXHAUSTED;
                  }
                  total_slots = driver->tx_buffer_slots + driver->rx_buffer_slots;
                  if (total_slots > SIZE_MAX / sizeof(spw_driver_buffer_slot_t)) {
                      return SPW_ERR_RESOURCE_EXHAUSTED;
                  }
                  slots_size = total_slots * sizeof(spw_driver_buffer_slot_t);
              }
              if (slots_size > SIZE_MAX - sizeof(spw_driver_backend_t)) {
                  return SPW_ERR_RESOURCE_EXHAUSTED;
              }
              *out_context_size = sizeof(spw_driver_backend_t) + slots_size;
              return SPW_OK;
          }

          static void clear_slot(spw_driver_buffer_slot_t* slot) {
              memset(slot, 0, sizeof(*slot));
              slot->buffer.state = SPW_BUFFER_STATE_FREE;
          }

          static void clear_slots(spw_driver_backend_t* backend) {
              size_t i;
              for (i = 0u; i < backend->tx_slot_count + backend->rx_slot_count; ++i) {
                  clear_slot(&backend->slots[i]);
              }
          }

          static spw_result_t driver_construct(void* raw,
                                               const spw_port_config_t* config) {
              spw_driver_backend_t* backend = (spw_driver_backend_t*)raw;
              const spw_driver_config_t* driver =
                  (const spw_driver_config_t*)config->backend_config;
              const size_t size = sizeof(*backend) +
                  (zero_copy_enabled_config(driver)
                       ? (driver->tx_buffer_slots + driver->rx_buffer_slots) *
                             sizeof(spw_driver_buffer_slot_t)
                       : 0u);
              memset(backend, 0, size);
              backend->ops = driver->ops;
              backend->driver_context = driver->driver_context;
              if (zero_copy_enabled_config(driver)) {
                  backend->tx_slot_count = driver->tx_buffer_slots;
                  backend->rx_slot_count = driver->rx_buffer_slots;
                  clear_slots(backend);
              }
              return SPW_OK;
          }

          static void driver_destroy(void* raw) {
              spw_driver_backend_t* backend = (spw_driver_backend_t*)raw;
              clear_slots(backend);
              backend->ops = NULL;
              backend->driver_context = NULL;
              backend->tx_slot_count = 0u;
              backend->rx_slot_count = 0u;
          }

          static spw_result_t driver_start(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->start(b->driver_context);
          }

          static spw_result_t driver_stop(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->stop(b->driver_context);
          }

          static spw_result_t driver_reset(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              spw_result_t result = b->ops->reset(b->driver_context);
              if (result == SPW_OK) {
                  clear_slots(b);
              }
              return result;
          }

          static spw_result_t driver_get_link_state(const void* raw,
                                                    spw_link_state_t* out_state) {
              const spw_driver_backend_t* b = (const spw_driver_backend_t*)raw;
              return b->ops->get_link_state(b->driver_context, out_state);
          }

          static spw_result_t driver_get_capabilities(
              const void* raw,
              spw_capabilities_t* out_capabilities) {
              const spw_driver_backend_t* b = (const spw_driver_backend_t*)raw;
              const bool zero_copy = b->tx_slot_count != 0u &&
                                     b->rx_slot_count != 0u &&
                                     complete_dma_ops(b->ops);
              spw_result_t result =
                  b->ops->get_capabilities(b->driver_context, out_capabilities);
              if (result != SPW_OK) {
                  return result;
              }
              if ((out_capabilities->bits & SPW_CAP_ZERO_COPY) != 0u && !zero_copy) {
                  return SPW_ERR_BACKEND;
              }
              if ((out_capabilities->bits & SPW_CAP_FAULT_INJECTION) != 0u) {
                  return SPW_ERR_UNSUPPORTED;
              }
              if ((out_capabilities->bits & SPW_CAP_TIME_CODE) != 0u &&
                  (b->ops->send_time_code == NULL ||
                   b->ops->receive_time_code == NULL)) {
                  return SPW_ERR_BACKEND;
              }
              if ((out_capabilities->bits & SPW_CAP_STATISTICS) != 0u &&
                  (b->ops->get_statistics == NULL ||
                   b->ops->clear_statistics == NULL)) {
                  return SPW_ERR_BACKEND;
              }
              if ((out_capabilities->bits & SPW_CAP_READINESS) != 0u &&
                  b->ops->wait == NULL) {
                  return SPW_ERR_BACKEND;
              }
              if (b->ops->wait == NULL) {
                  out_capabilities->bits &= ~SPW_CAP_READINESS;
              }
              return SPW_OK;
          }

          static bool driver_supports_zero_copy(const void* raw) {
              const spw_driver_backend_t* b = (const spw_driver_backend_t*)raw;
              return b->tx_slot_count != 0u && b->rx_slot_count != 0u &&
                     complete_dma_ops(b->ops);
          }

          static spw_result_t driver_send(void* raw,
                                          const spw_packet_t* packet,
                                          spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->send(b->driver_context, packet, timeout_us);
          }

          static spw_result_t driver_receive(void* raw,
                                             spw_packet_t* packet,
                                             spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->receive(b->driver_context, packet, timeout_us);
          }

          static spw_result_t driver_send_time_code(void* raw,
                                                    const spw_time_code_t* code,
                                                    spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->send_time_code != NULL
                         ? b->ops->send_time_code(b->driver_context, code, timeout_us)
                         : SPW_ERR_UNSUPPORTED;
          }

          static spw_result_t driver_receive_time_code(void* raw,
                                                       spw_time_code_t* code,
                                                       spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->receive_time_code != NULL
                         ? b->ops->receive_time_code(b->driver_context, code, timeout_us)
                         : SPW_ERR_UNSUPPORTED;
          }

          static spw_result_t driver_get_statistics(
              const void* raw,
              spw_statistics_t* out_statistics) {
              const spw_driver_backend_t* b = (const spw_driver_backend_t*)raw;
              if (b->ops->get_statistics == NULL) {
                  memset(out_statistics, 0, sizeof(*out_statistics));
                  return SPW_ERR_UNSUPPORTED;
              }
              return b->ops->get_statistics(b->driver_context, out_statistics);
          }

          static spw_result_t driver_clear_statistics(void* raw) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->clear_statistics != NULL
                         ? b->ops->clear_statistics(b->driver_context)
                         : SPW_ERR_UNSUPPORTED;
          }

          static spw_result_t driver_wait(void* raw,
                                          spw_ready_events_t interests,
                                          spw_timeout_us_t timeout_us,
                                          spw_ready_events_t* out_ready) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              return b->ops->wait != NULL
                         ? b->ops->wait(b->driver_context,
                                        interests,
                                        timeout_us,
                                        out_ready)
                         : SPW_ERR_UNSUPPORTED;
          }

          static spw_driver_buffer_slot_t* find_free_slot(
              spw_driver_backend_t* b,
              size_t first,
              size_t count) {
              size_t i;
              for (i = first; i < first + count; ++i) {
                  if (!b->slots[i].active) {
                      return &b->slots[i];
                  }
              }
              return NULL;
          }

          static bool token_in_use(const spw_driver_backend_t* b,
                                   spw_driver_buffer_token_t token) {
              size_t i;
              for (i = 0u; i < b->tx_slot_count + b->rx_slot_count; ++i) {
                  if (b->slots[i].active &&
                      b->slots[i].driver_buffer.token == token) {
                      return true;
                  }
              }
              return false;
          }

          static spw_driver_buffer_slot_t* find_slot_for_public_buffer(
              spw_driver_backend_t* b,
              spw_buffer_t* buffer,
              spw_buffer_direction_internal_t direction) {
              size_t i;
              for (i = 0u; i < b->tx_slot_count + b->rx_slot_count; ++i) {
                  spw_driver_buffer_slot_t* slot = &b->slots[i];
                  if (slot->active && &slot->buffer == (struct spw_buffer*)buffer &&
                      slot->buffer.owner == b && slot->buffer.direction == direction) {
                      return slot;
                  }
              }
              return NULL;
          }

          static spw_driver_buffer_slot_t* find_tx_slot_for_token(
              spw_driver_backend_t* b,
              spw_driver_buffer_token_t token) {
              size_t i;
              for (i = 0u; i < b->tx_slot_count; ++i) {
                  if (b->slots[i].active &&
                      b->slots[i].driver_buffer.token == token &&
                      b->slots[i].buffer.state == SPW_BUFFER_STATE_BACKEND) {
                      return &b->slots[i];
                  }
              }
              return NULL;
          }

          static spw_result_t validate_driver_buffer(
              const spw_driver_buffer_t* buffer,
              bool require_packet_metadata) {
              if (buffer->length > buffer->capacity ||
                  (buffer->capacity != 0u && buffer->data == NULL)) {
                  return SPW_ERR_BACKEND;
              }
              if (require_packet_metadata && !valid_terminator(buffer->terminator)) {
                  return SPW_ERR_BACKEND;
              }
              return SPW_OK;
          }

          static void expose_slot(spw_driver_backend_t* b,
                                  spw_driver_buffer_slot_t* slot,
                                  spw_buffer_direction_internal_t direction,
                                  spw_buffer_state_internal_t state) {
              slot->buffer.data = slot->driver_buffer.data;
              slot->buffer.length = slot->driver_buffer.length;
              slot->buffer.capacity = slot->driver_buffer.capacity;
              slot->buffer.terminator = slot->driver_buffer.terminator;
              slot->buffer.owner = b;
              slot->buffer.direction = direction;
              slot->buffer.state = state;
              slot->buffer.token = (size_t)(slot - b->slots);
              slot->active = true;
          }

          static spw_result_t driver_acquire_tx_buffer(void* raw,
                                                       size_t min_capacity,
                                                       spw_timeout_us_t timeout_us,
                                                       spw_buffer_t** out_buffer) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              spw_driver_buffer_slot_t* slot =
                  find_free_slot(b, 0u, b->tx_slot_count);
              spw_driver_buffer_t descriptor;
              spw_result_t result;
              if (slot == NULL) {
                  return SPW_ERR_RESOURCE_EXHAUSTED;
              }
              memset(&descriptor, 0, sizeof(descriptor));
              result = b->ops->acquire_tx_buffer(
                  b->driver_context, min_capacity, timeout_us, &descriptor);
              if (result != SPW_OK) {
                  return result;
              }
              if (validate_driver_buffer(&descriptor, false) != SPW_OK ||
                  descriptor.capacity < min_capacity ||
                  token_in_use(b, descriptor.token)) {
                  (void)b->ops->release_tx_buffer(b->driver_context, &descriptor);
                  return SPW_ERR_BACKEND;
              }
              descriptor.length = 0u;
              descriptor.terminator = SPW_TERMINATOR_EOP;
              slot->driver_buffer = descriptor;
              expose_slot(b, slot, SPW_BUFFER_DIRECTION_TX,
                          SPW_BUFFER_STATE_APPLICATION);
              *out_buffer = (spw_buffer_t*)&slot->buffer;
              return SPW_OK;
          }

          static spw_result_t driver_submit_tx_buffer(void* raw,
                                                      spw_buffer_t* buffer,
                                                      spw_timeout_us_t timeout_us) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              spw_driver_buffer_slot_t* slot = find_slot_for_public_buffer(
                  b, buffer, SPW_BUFFER_DIRECTION_TX);
              spw_result_t result;
              if (slot == NULL || slot->buffer.state != SPW_BUFFER_STATE_APPLICATION) {
                  return SPW_ERR_INVALID_STATE;
              }
              slot->driver_buffer.length = slot->buffer.length;
              slot->driver_buffer.terminator = slot->buffer.terminator;
              if (!valid_terminator(slot->driver_buffer.terminator) ||
                  slot->driver_buffer.length > slot->driver_buffer.capacity) {
                  return SPW_ERR_INVALID_PACKET;
              }
              if (b->ops->sync_buffer != NULL) {
                  result = b->ops->sync_buffer(b->driver_context,
                                               &slot->driver_buffer,
                                               SPW_DRIVER_SYNC_TO_DEVICE);
                  if (result != SPW_OK) {
                      return result;
                  }
              }
              result = b->ops->submit_tx_buffer(
                  b->driver_context, &slot->driver_buffer, timeout_us);
              if (result == SPW_OK) {
                  slot->buffer.state = SPW_BUFFER_STATE_BACKEND;
              }
              return result;
          }

          static spw_result_t driver_reclaim_tx_buffer(void* raw,
                                                       spw_timeout_us_t timeout_us,
                                                       spw_buffer_t** out_buffer) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              spw_driver_buffer_t descriptor;
              spw_driver_buffer_slot_t* slot;
              spw_result_t result;
              memset(&descriptor, 0, sizeof(descriptor));
              result = b->ops->reclaim_tx_buffer(
                  b->driver_context, timeout_us, &descriptor);
              if (result != SPW_OK) {
                  return result;
              }
              slot = find_tx_slot_for_token(b, descriptor.token);
              if (slot == NULL || validate_driver_buffer(&descriptor, false) != SPW_OK) {
                  return SPW_ERR_BACKEND;
              }
              slot->driver_buffer = descriptor;
              expose_slot(b, slot, SPW_BUFFER_DIRECTION_TX,
                          SPW_BUFFER_STATE_APPLICATION);
              *out_buffer = (spw_buffer_t*)&slot->buffer;
              return SPW_OK;
          }

          static spw_result_t driver_release_tx_buffer(void* raw,
                                                       spw_buffer_t* buffer) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              spw_driver_buffer_slot_t* slot = find_slot_for_public_buffer(
                  b, buffer, SPW_BUFFER_DIRECTION_TX);
              spw_result_t result;
              if (slot == NULL || slot->buffer.state != SPW_BUFFER_STATE_APPLICATION) {
                  return SPW_ERR_INVALID_STATE;
              }
              slot->driver_buffer.length = slot->buffer.length;
              slot->driver_buffer.terminator = slot->buffer.terminator;
              result = b->ops->release_tx_buffer(
                  b->driver_context, &slot->driver_buffer);
              if (result == SPW_OK) {
                  clear_slot(slot);
              }
              return result;
          }

          static spw_result_t driver_acquire_rx_buffer(void* raw,
                                                       spw_timeout_us_t timeout_us,
                                                       spw_buffer_t** out_buffer) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              spw_driver_buffer_slot_t* slot = find_free_slot(
                  b, b->tx_slot_count, b->rx_slot_count);
              spw_driver_buffer_t descriptor;
              spw_result_t result;
              if (slot == NULL) {
                  return SPW_ERR_RESOURCE_EXHAUSTED;
              }
              memset(&descriptor, 0, sizeof(descriptor));
              result = b->ops->acquire_rx_buffer(
                  b->driver_context, timeout_us, &descriptor);
              if (result != SPW_OK) {
                  return result;
              }
              if (validate_driver_buffer(&descriptor, true) != SPW_OK ||
                  token_in_use(b, descriptor.token)) {
                  (void)b->ops->release_rx_buffer(b->driver_context, &descriptor);
                  return SPW_ERR_BACKEND;
              }
              if (b->ops->sync_buffer != NULL) {
                  result = b->ops->sync_buffer(b->driver_context,
                                               &descriptor,
                                               SPW_DRIVER_SYNC_FROM_DEVICE);
                  if (result != SPW_OK) {
                      (void)b->ops->release_rx_buffer(b->driver_context, &descriptor);
                      return result;
                  }
              }
              slot->driver_buffer = descriptor;
              expose_slot(b, slot, SPW_BUFFER_DIRECTION_RX,
                          SPW_BUFFER_STATE_APPLICATION);
              *out_buffer = (spw_buffer_t*)&slot->buffer;
              return SPW_OK;
          }

          static spw_result_t driver_release_rx_buffer(void* raw,
                                                       spw_buffer_t* buffer) {
              spw_driver_backend_t* b = (spw_driver_backend_t*)raw;
              spw_driver_buffer_slot_t* slot = find_slot_for_public_buffer(
                  b, buffer, SPW_BUFFER_DIRECTION_RX);
              spw_result_t result;
              if (slot == NULL || slot->buffer.state != SPW_BUFFER_STATE_APPLICATION) {
                  return SPW_ERR_INVALID_STATE;
              }
              result = b->ops->release_rx_buffer(
                  b->driver_context, &slot->driver_buffer);
              if (result == SPW_OK) {
                  clear_slot(slot);
              }
              return result;
          }

          #define DRIVER_COMMON_OPS(tx_acq_, tx_submit_, tx_reclaim_, tx_release_, \
                                    rx_acq_, rx_release_, wait_) \
              { driver_start, driver_stop, driver_reset, driver_get_link_state, \
                driver_get_capabilities, driver_supports_zero_copy, driver_send, \
                driver_receive, driver_send_time_code, driver_receive_time_code, \
                driver_get_statistics, driver_clear_statistics, NULL, NULL, \
                (tx_acq_), (tx_submit_), (tx_reclaim_), (tx_release_), (rx_acq_), \
                (rx_release_), (wait_) }

          static const spw_backend_ops_t DRIVER_OPS =
              DRIVER_COMMON_OPS(NULL, NULL, NULL, NULL, NULL, NULL, NULL);
          static const spw_backend_ops_t DRIVER_WAIT_OPS =
              DRIVER_COMMON_OPS(NULL, NULL, NULL, NULL, NULL, NULL, driver_wait);
          static const spw_backend_ops_t DRIVER_DMA_OPS = DRIVER_COMMON_OPS(
              driver_acquire_tx_buffer, driver_submit_tx_buffer,
              driver_reclaim_tx_buffer, driver_release_tx_buffer,
              driver_acquire_rx_buffer, driver_release_rx_buffer, NULL);
          static const spw_backend_ops_t DRIVER_DMA_WAIT_OPS = DRIVER_COMMON_OPS(
              driver_acquire_tx_buffer, driver_submit_tx_buffer,
              driver_reclaim_tx_buffer, driver_release_tx_buffer,
              driver_acquire_rx_buffer, driver_release_rx_buffer, driver_wait);

          #define DRIVER_FACTORY_WITH_OPS(ops_) \
              { sizeof(spw_driver_backend_t), alignof(spw_driver_backend_t), \
                driver_construct, driver_destroy, (ops_), \
                driver_context_size_for_config }

          static const spw_backend_factory_t DRIVER_FACTORY =
              DRIVER_FACTORY_WITH_OPS(&DRIVER_OPS);
          static const spw_backend_factory_t DRIVER_WAIT_FACTORY =
              DRIVER_FACTORY_WITH_OPS(&DRIVER_WAIT_OPS);
          static const spw_backend_factory_t DRIVER_DMA_FACTORY =
              DRIVER_FACTORY_WITH_OPS(&DRIVER_DMA_OPS);
          static const spw_backend_factory_t DRIVER_DMA_WAIT_FACTORY =
              DRIVER_FACTORY_WITH_OPS(&DRIVER_DMA_WAIT_OPS);

          const spw_backend_factory_t* spw_driver_backend_factory(
              bool enable_wait,
              bool enable_zero_copy) {
              if (enable_zero_copy) {
                  return enable_wait ? &DRIVER_DMA_WAIT_FACTORY : &DRIVER_DMA_FACTORY;
              }
              return enable_wait ? &DRIVER_WAIT_FACTORY : &DRIVER_FACTORY;
          }
          EOF

          cat > tests/driver_dma.c <<'EOF'
          // SPDX-License-Identifier: Apache-2.0

          #include <spwkit/spwkit.h>

          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>

          enum { DMA_SLOTS = 2, DMA_CAPACITY = 64 };

          typedef enum fake_dma_state {
              DMA_FREE = 0,
              DMA_TX_APP,
              DMA_TX_COMPLETED,
              DMA_RX_READY,
              DMA_RX_APP
          } fake_dma_state_t;

          typedef struct fake_dma_slot {
              uint8_t bytes[DMA_CAPACITY];
              size_t length;
              spw_terminator_t terminator;
              spw_driver_buffer_token_t token;
              fake_dma_state_t state;
          } fake_dma_slot_t;

          typedef struct fake_dma_driver {
              spw_link_state_t state;
              fake_dma_slot_t tx[DMA_SLOTS];
              fake_dma_slot_t rx[DMA_SLOTS];
              unsigned sync_to_device;
              unsigned sync_from_device;
          } fake_dma_driver_t;

          #define CHECK(expr) \
              do { \
                  if (!(expr)) { \
                      fprintf(stderr, "CHECK failed at %s:%d: %s\n", \
                              __FILE__, __LINE__, #expr); \
                      return 1; \
                  } \
              } while (0)

          static spw_result_t start(void* raw) {
              ((fake_dma_driver_t*)raw)->state = SPW_LINK_RUN;
              return SPW_OK;
          }
          static spw_result_t stop(void* raw) {
              ((fake_dma_driver_t*)raw)->state = SPW_LINK_READY;
              return SPW_OK;
          }
          static spw_result_t reset(void* raw) {
              fake_dma_driver_t* d = (fake_dma_driver_t*)raw;
              size_t i;
              d->state = SPW_LINK_ERROR_RESET;
              for (i = 0u; i < DMA_SLOTS; ++i) {
                  d->tx[i].state = DMA_FREE;
                  d->rx[i].state = DMA_FREE;
              }
              return SPW_OK;
          }
          static spw_result_t get_state(const void* raw, spw_link_state_t* out) {
              *out = ((const fake_dma_driver_t*)raw)->state;
              return SPW_OK;
          }
          static spw_result_t get_caps(const void* raw, spw_capabilities_t* out) {
              (void)raw;
              memset(out, 0, sizeof(*out));
              out->bits = SPW_CAP_EEP | SPW_CAP_LINK_CONTROL | SPW_CAP_ZERO_COPY;
              out->max_packet_size = DMA_CAPACITY;
              out->tx_queue_depth = DMA_SLOTS;
              out->rx_queue_depth = DMA_SLOTS;
              out->buffer_alignment = 1u;
              return SPW_OK;
          }
          static spw_result_t copied_send(void* raw, const spw_packet_t* p,
                                          spw_timeout_us_t t) {
              (void)raw; (void)p; (void)t;
              return SPW_ERR_UNSUPPORTED;
          }
          static spw_result_t copied_receive(void* raw, spw_packet_t* p,
                                             spw_timeout_us_t t) {
              (void)raw; (void)p; (void)t;
              return SPW_ERR_UNSUPPORTED;
          }

          static spw_driver_buffer_t descriptor(fake_dma_slot_t* slot) {
              spw_driver_buffer_t out;
              out.data = slot->bytes;
              out.length = slot->length;
              out.capacity = sizeof(slot->bytes);
              out.terminator = slot->terminator;
              out.token = slot->token;
              return out;
          }

          static fake_dma_slot_t* find_token(fake_dma_slot_t slots[DMA_SLOTS],
                                             spw_driver_buffer_token_t token) {
              size_t i;
              for (i = 0u; i < DMA_SLOTS; ++i) {
                  if (slots[i].token == token) {
                      return &slots[i];
                  }
              }
              return NULL;
          }

          static spw_result_t acquire_tx(void* raw, size_t min_capacity,
                                         spw_timeout_us_t timeout_us,
                                         spw_driver_buffer_t* out) {
              fake_dma_driver_t* d = (fake_dma_driver_t*)raw;
              size_t i;
              (void)timeout_us;
              if (min_capacity > DMA_CAPACITY) return SPW_ERR_RESOURCE_EXHAUSTED;
              for (i = 0u; i < DMA_SLOTS; ++i) {
                  if (d->tx[i].state == DMA_FREE) {
                      d->tx[i].state = DMA_TX_APP;
                      d->tx[i].length = 0u;
                      d->tx[i].terminator = SPW_TERMINATOR_EOP;
                      *out = descriptor(&d->tx[i]);
                      return SPW_OK;
                  }
              }
              return SPW_ERR_RESOURCE_EXHAUSTED;
          }

          static spw_result_t submit_tx(void* raw, const spw_driver_buffer_t* in,
                                        spw_timeout_us_t timeout_us) {
              fake_dma_driver_t* d = (fake_dma_driver_t*)raw;
              fake_dma_slot_t* slot = find_token(d->tx, in->token);
              (void)timeout_us;
              if (slot == NULL || slot->state != DMA_TX_APP ||
                  in->data != slot->bytes || in->capacity != DMA_CAPACITY) {
                  return SPW_ERR_BACKEND;
              }
              slot->length = in->length;
              slot->terminator = in->terminator;
              slot->state = DMA_TX_COMPLETED;
              return SPW_OK;
          }

          static spw_result_t reclaim_tx(void* raw, spw_timeout_us_t timeout_us,
                                         spw_driver_buffer_t* out) {
              fake_dma_driver_t* d = (fake_dma_driver_t*)raw;
              size_t i;
              (void)timeout_us;
              for (i = 0u; i < DMA_SLOTS; ++i) {
                  if (d->tx[i].state == DMA_TX_COMPLETED) {
                      d->tx[i].state = DMA_TX_APP;
                      *out = descriptor(&d->tx[i]);
                      return SPW_OK;
                  }
              }
              return SPW_ERR_TIMEOUT;
          }

          static spw_result_t release_tx(void* raw, const spw_driver_buffer_t* in) {
              fake_dma_driver_t* d = (fake_dma_driver_t*)raw;
              fake_dma_slot_t* slot = find_token(d->tx, in->token);
              if (slot == NULL || slot->state != DMA_TX_APP) return SPW_ERR_BACKEND;
              slot->state = DMA_FREE;
              return SPW_OK;
          }

          static spw_result_t acquire_rx(void* raw, spw_timeout_us_t timeout_us,
                                         spw_driver_buffer_t* out) {
              fake_dma_driver_t* d = (fake_dma_driver_t*)raw;
              size_t i;
              (void)timeout_us;
              for (i = 0u; i < DMA_SLOTS; ++i) {
                  if (d->rx[i].state == DMA_RX_READY) {
                      d->rx[i].state = DMA_RX_APP;
                      *out = descriptor(&d->rx[i]);
                      return SPW_OK;
                  }
              }
              return SPW_ERR_TIMEOUT;
          }

          static spw_result_t release_rx(void* raw, const spw_driver_buffer_t* in) {
              fake_dma_driver_t* d = (fake_dma_driver_t*)raw;
              fake_dma_slot_t* slot = find_token(d->rx, in->token);
              if (slot == NULL || slot->state != DMA_RX_APP) return SPW_ERR_BACKEND;
              slot->state = DMA_FREE;
              return SPW_OK;
