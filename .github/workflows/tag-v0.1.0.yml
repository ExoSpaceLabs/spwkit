name: Tag v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tag-v0.1.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Create v0.1.0 tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          target="0f5104aeafe79685d6684ecb52d6a859d18d1c5a"
          tag="v0.1.0"

          git cat-file -e "${target}^{commit}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            remote_target="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
            if [[ "${remote_target}" != "${target}" ]]; then
              echo "Tag ${tag} already exists at ${remote_target}, expected ${target}." >&2
              exit 1
            fi
            echo "Tag ${tag} already points to ${target}."
            exit 0
          fi

          git tag "${tag}" "${target}"
          git push origin "refs/tags/${tag}"

          remote_target="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          [[ "${remote_target}" == "${target}" ]]
          echo "Created ${tag} at ${target}."
