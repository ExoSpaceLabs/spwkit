name: Apply #136 backend boundary patch

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/profile-backend-boundaries'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: test/profile-backend-boundaries
          fetch-depth: 0

      - name: Repair bootstrap anchor
        run: python3 scripts/fix_136_bootstrap.py

      - name: Apply deterministic patch
        run: python3 scripts/apply_136_bootstrap.py

      - name: Remove bootstrap machinery
        run: |
          rm -f scripts/fix_136_bootstrap.py
          rm -f scripts/apply_136_bootstrap.py
          rm -f .github/workflows/apply-136-bootstrap.yml

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(spwkit): instrument hosted backend boundaries"
          git push origin HEAD:test/profile-backend-boundaries
