name: Cut release tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cut-release.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cut-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Validate and cut release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release boundary
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*VERSION ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CMakeLists.txt | head -n1)"
          test -n "$version"
          tag="v${version}"

          grep -Eq "^## ${tag} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          ! grep -Eq "^## ${tag} — unreleased$" CHANGELOG.md

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify exact main release boundary
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Create immutable release tag
        if: ${{ github.event_name != 'pull_request' }}
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing="$(git rev-list -n1 "${RELEASE_TAG}")"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "${RELEASE_TAG} already exists at ${existing}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "${RELEASE_TAG} already points at the exact release boundary."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created ${RELEASE_TAG} at ${GITHUB_SHA}."

      - name: Dispatch exact-tag release audit
        if: ${{ github.event_name != 'pull_request' && steps.tag.outputs.created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref="${RELEASE_TAG}" >/dev/null
          echo "Dispatched Release audit for ${RELEASE_TAG}."
