# ST-LINK over SWD, aligned with the HardRT STM32H755 board setup.
source [find interface/stlink.cfg]
transport select hla_swd

# STM32H755 dual-bank target; SpWKit board evidence runs on CM7.
source [find target/stm32h7x_dual_bank.cfg]

# Keep reset asserted while attaching so a bad image cannot outrun the debugger.
reset_config srst_only srst_nogate connect_assert_srst

# Conservative adapter clock for reliable first-contact and qualification runs.
adapter speed 400
