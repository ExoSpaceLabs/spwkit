services:
  peer-a:
    image: ${SPWKIT_CCSDS_IMAGE:-spwkit-ccsds-v2:local}
    build:
      context: ../..
      dockerfile: integrations/ccsdspack_v2/docker/Dockerfile
      args:
        CCSDSPACK_REF: ${CCSDSPACK_REF:-develop}
        CCSDSPACK_SHA: ${CCSDSPACK_SHA:-4e198ae4c7f730737d78c1ea2f71ec3ce42ca7eb}
    command: ["udp", "A", "48100", "48101"]
    environment:
      SPWKIT_LOCAL_ADDRESS: 172.29.0.10
      SPWKIT_REMOTE_ADDRESS: 172.29.0.11
    networks:
      ccsds-link:
        ipv4_address: 172.29.0.10

  peer-b:
    image: ${SPWKIT_CCSDS_IMAGE:-spwkit-ccsds-v2:local}
    command: ["udp", "B", "48101", "48100"]
    environment:
      SPWKIT_LOCAL_ADDRESS: 172.29.0.11
      SPWKIT_REMOTE_ADDRESS: 172.29.0.10
    networks:
      ccsds-link:
        ipv4_address: 172.29.0.11

networks:
  ccsds-link:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
