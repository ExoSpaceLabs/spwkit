services:
  peer-a:
    build:
      context: ../..
      dockerfile: tests/d2d/docker/Dockerfile
    environment:
      SPWKIT_IMPL: ${SPWKIT_PEER_A_IMPL:-c}
      SPWKIT_ID: A
      SPWKIT_LOCAL_ADDRESS: 172.28.0.10
      SPWKIT_REMOTE_ADDRESS: 172.28.0.11
      SPWKIT_LOCAL_PORT: 48000
      SPWKIT_REMOTE_PORT: 48001
      SPWKIT_LINK_ID: ${SPWKIT_LINK_ID:-9001}
    networks:
      spwkit-d2d:
        ipv4_address: 172.28.0.10

  peer-b:
    build:
      context: ../..
      dockerfile: tests/d2d/docker/Dockerfile
    environment:
      SPWKIT_IMPL: ${SPWKIT_PEER_B_IMPL:-c}
      SPWKIT_ID: B
      SPWKIT_LOCAL_ADDRESS: 172.28.0.11
      SPWKIT_REMOTE_ADDRESS: 172.28.0.10
      SPWKIT_LOCAL_PORT: 48001
      SPWKIT_REMOTE_PORT: 48000
      SPWKIT_LINK_ID: ${SPWKIT_LINK_ID:-9001}
    networks:
      spwkit-d2d:
        ipv4_address: 172.28.0.11

networks:
  spwkit-d2d:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
